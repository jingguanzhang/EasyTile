  /* =============================== 画布渲染 =============================== */
  function sheetSvg(g, doc) {
    let svg = '<svg class="sheet-svg" viewBox="0 0 ' + g.sheetWidthMm + ' ' + g.sheetHeightMm + '" preserveAspectRatio="none">';
    // 纸张与装订区
    if (doc.sheet.showBindingZone && doc.sheet.marginLeftMm >= 15) {
      svg += '<rect x="0" y="0" width="' + doc.sheet.marginLeftMm + '" height="' + g.sheetHeightMm + '" fill="#f4f6f8" />';
      svg += '<line x1="' + (doc.sheet.marginLeftMm / 2) + '" y1="14" x2="' + (doc.sheet.marginLeftMm / 2) + '" y2="' + (g.sheetHeightMm - 14) + '" stroke="#aab2bc" stroke-width="0.25" stroke-dasharray="2.5 2" />';
      [0.22, 0.5, 0.78].forEach((ratio) => {
        svg += '<circle cx="' + (doc.sheet.marginLeftMm / 2) + '" cy="' + (g.sheetHeightMm * ratio) + '" r="2.2" fill="#fbfcfd" stroke="#aab2bc" stroke-width="0.3" />';
      });
      svg += '<text x="' + (doc.sheet.marginLeftMm / 2) + '" y="' + (g.sheetHeightMm * 0.36) + '" font-size="2.5" fill="#93a0ad" text-anchor="middle" style="writing-mode:vertical-rl">装订线</text>';
    }
    // 图幅分区标尺及分区外框
    if (doc.sheet.showAxisTicks) {
      const ax = computeAxisZoneMetrics(g, doc);
      const ix = g.innerRect.xMm;
      const iy = g.innerRect.yMm;
      const iw = g.innerRect.widthMm;
      const ih = g.innerRect.heightMm;
      const segW = iw / ax.cols;
      const segH = ih / ax.rows;
      const band = ax.band;
      const fs = ax.fontSize;
      svg += '<g stroke="#202226" stroke-width="0.25" fill="#202226">';
      if (ax.showOuterFrame) {
        svg += '<rect x="' + ax.outerRect.xMm + '" y="' + ax.outerRect.yMm + '" width="' + ax.outerRect.widthMm + '" height="' + ax.outerRect.heightMm + '" fill="none" />';
      }
      const cStart = ax.showOuterFrame ? 0 : 1;
      const cEnd = ax.showOuterFrame ? ax.cols : ax.cols - 1;
      for (let c = cStart; c <= cEnd; c++) {
        const xLine = ix + segW * c;
        if (ax.showTop) svg += '<line x1="' + xLine + '" y1="' + (iy - band) + '" x2="' + xLine + '" y2="' + iy + '" />';
        if (ax.showBottom) svg += '<line x1="' + xLine + '" y1="' + (iy + ih) + '" x2="' + xLine + '" y2="' + (iy + ih + band) + '" />';
      }
      for (let c = 0; c < ax.cols; c++) {
        const midX = ix + segW * (c + 0.5);
        if (ax.showTop) svg += '<text x="' + midX + '" y="' + (iy - band / 2 + fs * 0.35) + '" font-size="' + fs + '" text-anchor="middle" stroke="none">' + (c + 1) + '</text>';
        if (ax.showBottom) svg += '<text x="' + midX + '" y="' + (iy + ih + band / 2 + fs * 0.35) + '" font-size="' + fs + '" text-anchor="middle" stroke="none">' + (c + 1) + '</text>';
      }
      const rStart = ax.showOuterFrame ? 0 : 1;
      const rEnd = ax.showOuterFrame ? ax.rows : ax.rows - 1;
      for (let r = rStart; r <= rEnd; r++) {
        const yLine = iy + segH * r;
        if (ax.showLeft) svg += '<line x1="' + (ix - band) + '" y1="' + yLine + '" x2="' + ix + '" y2="' + yLine + '" />';
        if (ax.showRight) svg += '<line x1="' + (ix + iw) + '" y1="' + yLine + '" x2="' + (ix + iw + band) + '" y2="' + yLine + '" />';
      }
      ax.letters.forEach((letter, r) => {
        const midY = iy + segH * (r + 0.5);
        if (ax.showLeft) svg += '<text x="' + (ix - band / 2) + '" y="' + (midY + fs * 0.35) + '" font-size="' + fs + '" text-anchor="middle" stroke="none">' + letter + '</text>';
        if (ax.showRight) svg += '<text x="' + (ix + iw + band / 2) + '" y="' + (midY + fs * 0.35) + '" font-size="' + fs + '" text-anchor="middle" stroke="none">' + letter + '</text>';
      });
      svg += '</g>';
    }
    // 纸边外框
    if (doc.sheet.showOuterBorder !== false) {
      svg += '<rect x="0" y="0" width="' + g.sheetWidthMm + '" height="' + g.sheetHeightMm +
        '" fill="none" stroke="#202226" stroke-width="' + Math.max(0.15, num(doc.sheet.outerBorderWidthMm, 0.15)) + '" />';
    }
    // 内框
    svg += '<rect x="' + g.innerRect.xMm + '" y="' + g.innerRect.yMm + '" width="' + g.innerRect.widthMm + '" height="' + g.innerRect.heightMm +
      '" fill="none" stroke="#202226" stroke-width="' + Math.max(0.35, doc.sheet.innerBorderWidthMm) + '" />';
    svg += '</svg>';
    return svg;
  }

  /**
   * 堆叠式字段：字段名与内容之间的间距 (mm)。字段名作为单元格 MTEXT 的首行一起导出，
   * CAD 中两行基线距 = 单倍行距 × 较大字高，这里反推网页上的间距使两边一致（可为负）。
   */
  function stackedGapMm(cell) {
    const f = cadFont(cell.fontKey);
    const lh = f.cellLh;
    const half = (lh - (f.asc + f.desc)) / 2;
    const fl = cell.labelFontSizeMm, fv = cell.valueFontSizeMm;
    return lh * Math.max(fl, fv) - (half + f.desc) * fl - (half + f.asc) * fv;
  }

  function cellContentHtml(cg, cell, isEditing) {
    const P = PX_PER_MM;
    const padX = cell.paddingXMm * P;
    const padY = cell.paddingYMm * P;
    const offX = cell.offsetXMm * P;
    const offY = cell.offsetYMm * P;
    const valuePx = Math.max(5, cell.valueFontSizeMm * P);
    const labelPx = Math.max(4.5, cell.labelFontSizeMm * P);
    const justify = { left: 'flex-start', center: 'center', right: 'flex-end' }[cell.hAlign];
    const alignItems = { top: 'flex-start', middle: 'center', bottom: 'flex-end' }[cell.vAlign];
    const bold = cell.fontWeight === 'bold';
    const color = colorCss(cell.textColor);
    const BASE_LH = fontLh(cell.fontKey);   // 该字体的 CAD 单倍行距
    const CELL_LH = +(BASE_LH * clamp(num(cell.lineSpacing, 1), 0.6, 3)).toFixed(4);
    const ff = 'font-family:' + esc(fontCss(cell.fontKey)) + ';';
    const dirStyle = cell.textDirection === 'vertical' ? 'writing-mode:vertical-rl;text-orientation:upright;' : '';

    if (isEditing) {
      const layoutClass = cell.type === 'field' ? (cell.fieldLayout === 'inline' ? 'inline' : 'stack') : 'value';
      const showLabel = cell.type === 'field';
      return '<div class="cell-content" style="' + ff + 'padding:' + padY + 'px ' + padX + 'px">' +
        '<div class="direct-editor ' + layoutClass + '" style="align-items:' + (cell.fieldLayout === 'inline' ? 'baseline' : justify) + '">' +
        (showLabel ? '<input data-editor="label" value="' + esc(cell.label) + '" placeholder="字段名称" style="font-size:' + labelPx + 'px" />' : '') +
        '<textarea data-editor="value" placeholder="输入内容（回车换行，Tab 切格）" style="font-size:' + valuePx + 'px;line-height:' + CELL_LH + ';font-weight:' + (bold ? 700 : 400) + ';text-align:' + cell.hAlign + '">' + esc(cell.value) + '</textarea>' +
        '</div></div>';
    }

    if (cell.type === 'image') {
      const imgScale = clamp(cell.imgScale == null ? 0.9 : cell.imgScale, 0.1, 1.6);
      return '<div class="cell-content" style="' + ff + 'padding:' + padY + 'px ' + padX + 'px;transform:translate(' + offX + 'px,' + offY + 'px)">' +
        '<div style="display:flex;flex-direction:column;width:100%;height:100%;align-items:' + justify + ';justify-content:' + alignItems + ';gap:2px">' +
        (cell.imgSrc
          ? '<img class="cell-image" src="' + cell.imgSrc + '" alt="" draggable="false" style="max-width:' + (imgScale * 100) + '%;max-height:' + (cell.imgShowCaption ? 70 : 94) * imgScale + '%" />'
          : '<span class="cell-image-empty">双击上传图片</span>') +
        (cell.imgShowCaption && String(cell.value || '').trim()
          ? '<span style="font-size:' + valuePx + 'px;font-weight:' + (bold ? 700 : 600) + ';color:' + color + ';line-height:' + BASE_LH + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">' + esc(cell.value) + '</span>'
          : '') +
        '</div></div>';
    }

    if (cell.type === 'text') {
      return '<div class="cell-content" style="' + ff + 'padding:' + padY + 'px ' + padX + 'px">' +
        '<div style="display:flex;width:100%;height:100%;align-items:' + alignItems + ';justify-content:' + justify + ';transform:translate(' + offX + 'px,' + offY + 'px)">' +
        '<div style="font-size:' + valuePx + 'px;line-height:' + CELL_LH + ';font-weight:' + (bold ? 700 : 400) + ';color:' + color + ';text-align:' + cell.hAlign + ';white-space:pre-wrap;overflow-wrap:anywhere;' + dirStyle + '">' +
        esc(cell.value) + '</div></div></div>';
    }

    /* field：显示 前缀 + 内容 + 后缀 */
    const dv = cellDisplayValue(cell);
    if (cell.fieldLayout === 'inline') {
      return '<div class="cell-content" style="' + ff + 'padding:' + padY + 'px ' + padX + 'px">' +
        '<div style="display:flex;width:100%;height:100%;align-items:' + alignItems + ';justify-content:' + justify + ';transform:translate(' + offX + 'px,' + offY + 'px)">' +
        '<div style="display:inline-flex;align-items:baseline;gap:3px;max-width:100%;overflow:hidden;' + dirStyle + '">' +
        (cell.label.trim() ? '<span style="font-size:' + labelPx + 'px;color:#6c7077;line-height:' + BASE_LH + ';flex:0 0 auto;white-space:nowrap">' + esc(cell.label) + '：</span>' : '') +
        '<span style="font-size:' + valuePx + 'px;line-height:' + CELL_LH + ';font-weight:' + (bold ? 700 : 500) + ';color:' + color + ';white-space:pre-wrap;overflow-wrap:anywhere">' + esc(dv) + '</span>' +
        '</div></div></div>';
    }
    if (cell.fieldLayout === 'stacked') {
      return '<div class="cell-content" style="' + ff + 'padding:' + padY + 'px ' + padX + 'px">' +
        '<div style="display:flex;flex-direction:column;width:100%;height:100%;gap:' + stackedGapMm(cell) * P + 'px;align-items:' + justify + ';justify-content:' + alignItems + ';text-align:' + cell.hAlign + ';transform:translate(' + offX + 'px,' + offY + 'px)">' +
        (cell.label.trim() ? '<span style="font-size:' + labelPx + 'px;line-height:' + BASE_LH + ';color:#6c7077;white-space:nowrap">' + esc(cell.label) + '</span>' : '') +
        '<span style="font-size:' + valuePx + 'px;line-height:' + CELL_LH + ';font-weight:' + (bold ? 700 : 500) + ';color:' + color + ';white-space:pre-wrap;overflow-wrap:anywhere;' + dirStyle + '">' + esc(dv) + '</span>' +
        '</div></div>';
    }
    /* corner-label */
    const reserveTop = cell.label.trim() && cell.vAlign === 'top' ? labelPx * 1.2 : 0;
    return '<div class="cell-content" style="' + ff + 'padding:0">' +
      (cell.label.trim() ? '<span class="cell-corner-label" style="left:' + padX + 'px;top:' + padY + 'px;font-size:' + labelPx + 'px;line-height:' + BASE_LH + '">' + esc(cell.label) + '</span>' : '') +
      '<div style="position:absolute;inset:0;display:flex;align-items:' + alignItems + ';justify-content:' + justify + ';padding:' + (padY + reserveTop) + 'px ' + padX + 'px;transform:translate(' + offX + 'px,' + offY + 'px)">' +
      '<div style="font-size:' + valuePx + 'px;line-height:' + CELL_LH + ';font-weight:' + (bold ? 700 : 500) + ';color:' + color + ';text-align:' + cell.hAlign + ';white-space:pre-wrap;overflow-wrap:anywhere;' + dirStyle + '">' +
      esc(dv) + '</div></div></div>';
  }

  function freeEdges() {
    const b = state.doc.block;
    if (b.layoutMode === 'edge') {
      const left = b.edgePosition === 'right';
      return { left: left, right: !left, top: false, bottom: false, corner: left ? 'tl' : 'tr' };
    }
    const pos = b.cornerPosition;
    return {
      left: pos.endsWith('right'),
      right: pos.endsWith('left'),
      top: pos.startsWith('bottom'),
      bottom: pos.startsWith('top'),
      corner: pos === 'bottom-right' ? 'tl' : pos === 'bottom-left' ? 'tr' : pos === 'top-right' ? 'bl' : 'br'
    };
  }

  function renderCanvas() {
    const g = state.geometry;
    const doc = state.doc;
    const P = PX_PER_MM;
    const sel = state.selection;
    const clean = state.ui.cleanPreview;
    const Wp = g.sheetWidthMm * P;
    const Hp = g.sheetHeightMm * P;
    const drag = state.drag;
    let html = '';

    // 单元格
    const cellsHtml = g.cells.map((cg) => {
      const c = cg.cell;
      const isSel = sel.kind === 'cell' && sel.rowId === cg.rowId && sel.cellId === cg.cellId;
      const isRowSel = sel.kind === 'row' && sel.rowId === cg.rowId;
      const isEditing = !!state.editing && state.editing.rowId === cg.rowId && state.editing.cellId === cg.cellId;
      const isDrop = state.ui.dropCellId === cg.cellId;
      const lineW = Math.max(0.35, doc.block.gridLineWidthMm * P / 2);
      return '<div class="drawing-cell' + (isSel ? ' selected' : '') + (isRowSel ? ' row-selected' : '') + (isEditing ? ' editing' : '') + (isDrop ? ' drop-target' : '') + '"' +
        ' data-role="cell" data-row="' + cg.rowId + '" data-cell="' + cg.cellId + '"' +
        ' style="left:' + (cg.xMm * P) + 'px;top:' + (cg.yMm * P) + 'px;width:' + (cg.widthMm * P) + 'px;height:' + (cg.heightMm * P) + 'px;box-shadow:inset 0 0 0 ' + lineW + 'px #202226">' +
        cellContentHtml(cg, c, isEditing) +
        '</div>';
    }).join('');

    // 整行选中高亮框
    let rowSelBoxHtml = '';
    if (!clean && sel.kind === 'row') {
      const selRow = g.rows.find((r) => r.rowId === sel.rowId);
      if (selRow) {
        rowSelBoxHtml = '<div class="row-selection-box" style="left:' + (g.blockRect.xMm * P) + 'px;top:' + (selRow.yMm * P) + 'px;width:' + (g.blockRect.widthMm * P) + 'px;height:' + (selRow.heightMm * P) + 'px"></div>';
      }
    }

    // 行分隔线
    const rowResizers = g.rows.map((row, i) => {
      if (clean) return '';
      const isLast = i === g.rows.length - 1;
      if (isLast && doc.block.layoutMode === 'edge') return '';
      const top = (row.yMm + row.heightMm) * P;
      return '<div class="row-resizer" data-role="row-resizer" data-row="' + row.rowId + '" title="上下拖动设置本行固定高度 · 双击恢复自适应"' +
        ' style="left:' + (g.blockRect.xMm * P) + 'px;top:' + top + 'px;width:' + (g.blockRect.widthMm * P) + 'px"><i></i></div>';
    }).join('');

    // 列宽拖拽手柄（置于表格层级，避免被相邻单元格遮挡）
    const colResizers = clean ? '' : g.rows.map((row) =>
      row.cells.slice(0, -1).map((cg, i) =>
        '<div class="column-resizer" data-role="col-resizer" data-row="' + row.rowId + '" data-index="' + i + '" title="拖动调整左右单元格宽度（自动跨行磁吸，按住 Alt 自由微调）"' +
        ' style="left:' + ((cg.xMm + cg.widthMm) * P - 5) + 'px;top:' + (row.yMm * P) + 'px;height:' + (row.heightMm * P) + 'px"><i></i></div>'
      ).join('')
    ).join('');

    // 行选择器
    const rowSelectors = g.rows.map((row, i) => {
      if (clean) return '';
      const left = Math.max(1, g.blockRect.xMm - 6) * P;
      const top = (row.yMm + row.heightMm / 2) * P;
      const active = (sel.kind === 'row' && sel.rowId === row.rowId) || (sel.kind === 'cell' && sel.rowId === row.rowId);
      return '<button type="button" class="row-selector' + (active ? ' active' : '') + '" data-role="row-selector" data-row="' + row.rowId + '" title="选择第 ' + (i + 1) + ' 行"' +
        ' style="left:' + left + 'px;top:' + top + 'px">' + ic('rows-3', '', 'width:10px;height:10px') + '</button>';
    }).join('');

    // 手柄
    const fe = freeEdges();
    const br = g.blockRect;
    let handles = '';
    if (!clean) {
      const handle = (cls, leftMm, topMm) =>
        '<div class="resize-handle ' + cls + '" data-role="block-resize" data-handle="' + cls + '"' +
        ' style="left:' + (leftMm * P) + 'px;top:' + (topMm * P) + 'px"></div>';
      if (fe.left) handles += handle('table-left', br.xMm, br.yMm + br.heightMm / 2);
      if (fe.right) handles += handle('table-right', br.xMm + br.widthMm, br.yMm + br.heightMm / 2);
      if (fe.top) handles += handle('table-top', br.xMm + br.widthMm / 2, br.yMm);
      if (fe.bottom) handles += handle('table-bottom', br.xMm + br.widthMm / 2, br.yMm + br.heightMm);
      if (fe.corner === 'tl') handles += handle('table-left', br.xMm, br.yMm);
      if (fe.corner === 'tr') handles += handle('table-right', br.xMm + br.widthMm, br.yMm);
      if (fe.corner === 'bl') handles += handle('table-left', br.xMm, br.yMm + br.heightMm);
      if (fe.corner === 'br') handles += handle('table-right', br.xMm + br.widthMm, br.yMm + br.heightMm);
    }

    const tableSelected = sel.kind === 'table';
    const tag = clean ? '' :
      '<button type="button" class="table-tag" data-role="table-tag" style="left:' + (br.xMm * P) + 'px;top:' + (br.yMm * P) + 'px"' +
      ' title="点击选中整个参数表格">' + ic('move') + '参数表 · ' + snap1(br.widthMm) + ' × ' + snap1(br.heightMm) + '</button>';

    // 选中单元格时的悬浮操作菜单（随选中位置浮在格子上方）
    let cellMenu = '';
    if (sel.kind === 'cell' && !clean && !state.editing) {
      const cg = g.cells.find((c) => c.rowId === sel.rowId && c.cellId === sel.cellId);
      if (cg) {
        const zoom = state.view.zoom;
        const cx = state.view.panX + (cg.xMm + cg.widthMm / 2) * P * zoom;
        const above = state.view.panY + cg.yMm * P * zoom - 44;
        const below = state.view.panY + (cg.yMm + cg.heightMm) * P * zoom + 10;
        const vw = els.viewport.clientWidth || 1200;
        const left = clamp(cx, 118, Math.max(118, vw - 118));
        const top = above < 8 ? below : above;
        const btn = (act, icon, label, extra) =>
          '<button type="button" data-act="' + act + '" title="' + label + '"' + (extra || '') + '>' + ic(icon, '', 'width:13px;height:13px') + '<span>' + label + '</span></button>';
        const rowIdx = g.rows.findIndex((r) => r.rowId === sel.rowId);
        cellMenu = '<div class="cell-float-menu" style="left:' + left + 'px;top:' + top + 'px">' +
          btn('uploadCellImage', 'image-plus', cg.cell.imgSrc ? '换图' : '图片') +
          btn('splitSelected', 'split', '拆分', g.rows.find((r) => r.rowId === sel.rowId).cells.length >= 8 ? ' disabled' : '') +
          btn('toggleRowMode', 'rows-3', '行高') +
          btn('insertRowAt', 'plus', '插行', ' data-index="' + (rowIdx + 1) + '"') +
          btn('deleteSelected', 'trash', '删除', g.rows.length <= 1 && g.rows.find((r) => r.rowId === sel.rowId).cells.length <= 1 ? ' disabled' : '') +
          '</div>';
      }
    }

    // 选中自由文字时的悬浮编辑条（字体 / 字号 / 颜色 / 对齐 / 字间距 / 复制 / 删除），浮在文本框上方
    let textMenu = '';
    if (sel.kind === 'text' && !clean) {
      const ft = (doc.freeTexts || []).find((t) => t.id === sel.id);
      if (ft) {
        const zoom = state.view.zoom;
        const sx = state.view.panX + ft.xMm * P * zoom;
        const sy = state.view.panY + ft.yMm * P * zoom;
        const lines = Math.max(1, String(fillPreview(ft.text)).split('\n').length);
        const boxH = ft.fontSizeMm * 1.3 * lines * P * zoom;
        const vw = els.viewport.clientWidth || 1200;
        const left = clamp(sx, 8, Math.max(8, vw - 560));
        const top = sy - 46 < 8 ? sy + boxH + 10 : sy - 46;
        const ib = (act, icon, tip, value, active) => '<button type="button" data-act="' + act + '"' + (value ? ' data-value="' + value + '"' : '') +
          ' class="' + (active ? 'active' : '') + '" title="' + tip + '">' + ic(icon, '', 'width:14px;height:14px') + '</button>';
        textMenu = '<div class="text-float-bar" style="left:' + left + 'px;top:' + top + 'px">' +
          fontSelect('text:fontKey', ft.fontKey, 'class="tfb-font"') +
          '<label class="tfb-num" title="字高 (mm)"><input type="number" data-bind="text:fontSizeMm" data-vt="number" data-lazy="1" min="1" max="40" step="0.1" value="' + fnum(ft.fontSizeMm) + '" /><em>mm</em></label>' +
          '<label class="tfb-color" title="文字颜色（任意色）" style="background:' + colorCss(ft.textColor) + '"><input type="color" data-color-act="freeTextColor" value="' + colorHex(ft.textColor) + '" /></label>' +
          '<span class="tfb-sep"></span>' +
          ib('freeTextAlign', 'align-left', '左对齐', 'left', ft.hAlign === 'left') +
          ib('freeTextAlign', 'align-center', '居中', 'center', ft.hAlign === 'center') +
          ib('freeTextAlign', 'align-right', '右对齐', 'right', ft.hAlign === 'right') +
          '<span class="tfb-sep"></span>' +
          '<label class="tfb-num" title="字间距（倍，1 = 正常；多行文字导出为 CAD 跟踪系数）">' + ic('move-horizontal', '', 'width:13px;height:13px') +
          '<input type="number" data-bind="text:tracking" data-vt="number" data-lazy="1" min="0.75" max="4" step="0.05" value="' + fnum(ft.tracking) + '" /></label>' +
          '<span class="tfb-sep"></span>' +
          ib('editFreeText', 'pencil', '编辑文字（双击文字同样可以）') +
          ib('duplicateFreeText', 'copy', '复制') +
          ib('deleteFreeText', 'trash', '删除') +
          '</div>';
      }
    }

    // 自由文字
    const freeTextHandlesHtml = (id) =>
      '<span class="ft-corner ft-corner-nw" data-role="ft-corner" data-corner="nw" data-id="' + id + '" title="拖动角点缩放文字大小（按住 Alt 精细缩放）"></span>' +
      '<span class="ft-corner ft-corner-ne" data-role="ft-corner" data-corner="ne" data-id="' + id + '" title="拖动角点缩放文字大小（按住 Alt 精细缩放）"></span>' +
      '<span class="ft-corner ft-corner-sw" data-role="ft-corner" data-corner="sw" data-id="' + id + '" title="拖动角点缩放文字大小（按住 Alt 精细缩放）"></span>' +
      '<span class="ft-corner ft-corner-se" data-role="ft-corner" data-corner="se" data-id="' + id + '" title="拖动角点缩放文字大小（按住 Alt 精细缩放）"></span>' +
      '<span class="ft-resize ft-resize-l" data-role="ft-resize" data-side="left" data-id="' + id + '" title="拖动调整文本框宽度"></span>' +
      '<span class="ft-resize ft-resize-r" data-role="ft-resize" data-side="right" data-id="' + id + '" title="拖动调整文本框宽度（拖到最左回到自动宽度）"></span>';

    const freeTextsHtml = (doc.freeTexts || []).map((ft) => {
      const isSel = sel.kind === 'text' && sel.id === ft.id;
      const shown = fillPreview(ft.text);
      const empty = !shown.trim();
      const w = ft.widthMm > 0 ? 'width:' + (ft.widthMm * P) + 'px;white-space:pre-wrap;overflow-wrap:anywhere;' : 'white-space:pre;';
      const ls = (ft.tracking || 1) - 1;
      const fsPx = Math.max(4, ft.fontSizeMm * P);
      const lsStyle = Math.abs(ls) > 1e-3 ? ';letter-spacing:' + ls.toFixed(3) + 'em' : '';
      if (state.textEditing === ft.id && !clean) {
        // 画布上直接编辑（设计软件式）：同位置、同字体字号的文本框，失焦或 Esc 结束
        const rows = Math.max(1, String(ft.text).split('\n').length);
        const cols = Math.max(4, ...String(ft.text).split('\n').map((l) => measureCadTextEm(l) || l.length)) + 1;
        const taW = ft.widthMm > 0 ? (ft.widthMm * P) : (cols * (1 + ls) * fsPx);
        return '<div class="free-text free-text-edit-wrap selected" data-role="free-text" data-id="' + ft.id + '"' +
          ' style="left:' + (ft.xMm * P) + 'px;top:' + (ft.yMm * P) + 'px;color:' + colorCss(ft.textColor) + '">' +
          '<textarea class="free-text-editor' + (ft.widthMm > 0 ? ' is-wrapped' : '') + '" data-ft-editor="' + ft.id + '" spellcheck="false" rows="' + rows + '"' +
          ' style="width:' + taW + 'px;font-size:' + fsPx + 'px;font-family:' + esc(fontCss(ft.fontKey)) + lsStyle +
          ';text-align:' + ft.hAlign + '">' + esc(ft.text) + '</textarea>' +
          freeTextHandlesHtml(ft.id) +
          '</div>';
      }
      return '<div class="free-text' + (isSel && !clean ? ' selected' : '') + (empty ? ' empty' : '') + '" data-role="free-text" data-id="' + ft.id + '"' +
        ' title="拖动移动 · 双击编辑"' +
        ' style="left:' + (ft.xMm * P) + 'px;top:' + (ft.yMm * P) + 'px;' + w + 'font-size:' + fsPx + 'px;font-family:' + esc(fontCss(ft.fontKey)) +
        lsStyle + ';color:' + colorCss(ft.textColor) + ';text-align:' + ft.hAlign + (clean ? ';cursor:default' : '') + '">' +
        esc(empty ? '（空文字）' : shown) +
        (isSel && !clean ? freeTextHandlesHtml(ft.id) : '') +
        '</div>';
    }).join('');

    const snapGuide = drag && drag.kind === 'col-divider' && drag.snapX != null
      ? '<div class="snap-guide" style="left:' + (drag.snapX * P) + 'px"></div>' : '';
    const invZoom = (1 / Math.max(0.1, state.view.zoom || 1)).toFixed(4);

    html += '<div class="sheet-layer" style="--inv-zoom:' + invZoom + ';transform:translate(' + state.view.panX + 'px,' + state.view.panY + 'px) scale(' + state.view.zoom + ');width:' + Wp + 'px;height:' + Hp + 'px">' +
      '<div class="drawing-sheet" style="width:' + Wp + 'px;height:' + Hp + 'px">' +
      sheetSvg(g, doc) +
      '<div class="table-object' + (tableSelected ? ' selected' : '') + '">' + tag + cellsHtml + rowSelBoxHtml + rowResizers + colResizers + rowSelectors +
      '<div class="table-outer-border" style="left:' + (br.xMm * P) + 'px;top:' + (br.yMm * P) + 'px;width:' + (br.widthMm * P) + 'px;height:' + (br.heightMm * P) + 'px;border-width:' + Math.max(1, doc.block.outerLineWidthMm * P) + 'px"></div>' +
      handles + '</div>' +
      freeTextsHtml +
      snapGuide +
      '</div></div>' +
      // 悬浮菜单放在缩放层之外，避免跟随图纸缩放
      cellMenu + textMenu;

    els.stage.innerHTML = html;

    if (sel.kind === 'text' && !clean) {
      const ftNode = els.stage.querySelector('[data-role="free-text"][data-id="' + sel.id + '"]');
      if (ftNode) ftNode.classList.toggle('is-compact-y', ftNode.offsetHeight * state.view.zoom < 26);
    }

    // 自由文字画布内编辑
    if (state.textEditing) {
      const ta = els.stage.querySelector('[data-ft-editor]');
      if (!ta) state.textEditing = null;
      else setTimeout(() => {
        if (document.activeElement !== ta) {
          ta.focus();
          try { if (state.textEditSelectAll) ta.select(); else ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) { /* noop */ }
          state.textEditSelectAll = false;
        }
      }, 0);
    }
    // 聚焦内联编辑器
    if (state.editing) {
      const ta = els.stage.querySelector('[data-editor="value"]');
      if (ta) {
        setTimeout(() => {
          if (document.activeElement !== ta) {
            ta.focus();
            try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) { /* noop */ }
          }
        }, 0);
      }
    }
  }

  function render(opts) {
    opts = opts || {};
    state.geometry = computeLayoutGeometry(state.doc);
    if (opts.panels !== false) {
      renderRightPanel();
      renderToolbar();
      renderStatus();
      document.getElementById('btnUndo').disabled = state.past.length === 0;
      document.getElementById('btnRedo').disabled = state.future.length === 0;
    }
    renderCanvas();
    if (!state.view.initialized) {
      state.view.initialized = true;
      requestAnimationFrame(fitToScreen);
    }
  }

    /* =============================== 视图：缩放 / 布局定位 =============================== */
  function fitToScreen() {
    const rect = els.viewport.getBoundingClientRect();
    const g = state.geometry;
    if (!rect.width || !g) return;
    const padX = 84;
    const padY = 96;
    const availW = Math.max(180, rect.width - padX);
    const availH = Math.max(140, rect.height - padY);
    const z = clamp(Math.min(availW / (g.sheetWidthMm * PX_PER_MM), availH / (g.sheetHeightMm * PX_PER_MM)), 0.12, 3);
    state.view.zoom = z;
    state.view.panX = (rect.width - g.sheetWidthMm * PX_PER_MM * z) / 2;
    state.view.panY = (rect.height - g.sheetHeightMm * PX_PER_MM * z) / 2;
    state.view.focusMode = false;
    render({ panels: true });
  }

  function focusBlock() {
    const rect = els.viewport.getBoundingClientRect();
    const g = state.geometry;
    const br = g.blockRect;
    const availW = Math.max(200, rect.width - 180);
    const availH = Math.max(160, rect.height - 200);
    const z = clamp(Math.min(availW / (br.widthMm * PX_PER_MM), availH / (br.heightMm * PX_PER_MM)), 0.3, 6);
    state.view.zoom = z;
    state.view.panX = rect.width / 2 - (br.xMm + br.widthMm / 2) * PX_PER_MM * z;
    state.view.panY = rect.height / 2 - (br.yMm + br.heightMm / 2) * PX_PER_MM * z;
    state.view.focusMode = true;
    render({ panels: true });
  }

  function zoomBy(factor, anchorX, anchorY) {
    const rect = els.viewport.getBoundingClientRect();
    const ax = anchorX == null ? rect.width / 2 : anchorX;
    const ay = anchorY == null ? rect.height / 2 : anchorY;
    const old = state.view.zoom;
    const next = clamp(old * factor, 0.12, 8);
    const mmX = (ax - state.view.panX) / old;
    const mmY = (ay - state.view.panY) / old;
    state.view.zoom = next;
    state.view.panX = ax - mmX * next;
    state.view.panY = ay - mmY * next;
    render({ panels: true });
  }

  function clientToMm(clientX, clientY) {
    const r = els.viewport.getBoundingClientRect();
    return {
      x: (clientX - r.left - state.view.panX) / state.view.zoom / PX_PER_MM,
      y: (clientY - r.top - state.view.panY) / state.view.zoom / PX_PER_MM
    };
  }

  /* =============================== 内联编辑 =============================== */
  function startEdit(rowId, cellId, field) {
    const geom = state.geometry.cells.find((c) => c.rowId === rowId && c.cellId === cellId);
    if (!geom) return;
    if (geom.cell.type === 'image') {
      pendingImageCell = { rowId: rowId, cellId: cellId };
      els.imageInput.click();
      return;
    }
    pushHistory();
    state.editing = { rowId: rowId, cellId: cellId, focusField: field || 'value' };
    state.selection = { kind: 'cell', rowId: rowId, cellId: cellId };
    render();
  }

  function commitEditing(renderAfter) {
    if (!state.editing) return;
    state.editing = null;
    if (renderAfter !== false) render();
  }

  function editNextCell(direction) {
    if (!state.editing) return;
    const cells = state.geometry.cells;
    const idx = cells.findIndex((c) => c.rowId === state.editing.rowId && c.cellId === state.editing.cellId);
    if (idx === -1) return;
    const next = cells[(idx + (direction || 1) + cells.length) % cells.length];
    state.editing = { rowId: next.rowId, cellId: next.cellId, focusField: 'value' };
    state.selection = { kind: 'cell', rowId: next.rowId, cellId: next.cellId };
    render();
  }

  function silentUpdate(recipe) {
    const next = clone(state.doc);
    if (recipe(next) === false) return;
    state.doc = next;
    state.geometry = computeLayoutGeometry(state.doc);
    saveProjectSoon();
  }

  /* =============================== 业务动作 =============================== */
  let pendingImageCell = null;

  function setRowHeight(rowId, mode, fixedHeightMm, history) {
    update((doc) => {
      const row = doc.block.rows.find((r) => r.id === rowId);
      if (!row) return false;
      row.heightMode = mode;
      if (fixedHeightMm != null) row.fixedHeightMm = Math.max(6, fixedHeightMm);
      const hasAuto = doc.block.rows.some((r) => r.heightMode === 'auto');
      const sumFixed = doc.block.rows.filter((r) => r.heightMode === 'fixed').reduce((a, r) => a + Math.max(6, r.fixedHeightMm), 0);
      if (doc.block.layoutMode === 'corner') {
        if (!hasAuto) doc.block.cornerHeightMm = sumFixed;
        else if (sumFixed + 10 > doc.block.cornerHeightMm) doc.block.cornerHeightMm = sumFixed + 14;
      }
    }, { history: !!history });
  }

  function insertRowAt(index, selectNew) {
    let newRow = null;
    update((doc) => {
      const count = doc.block.layoutMode === 'edge' ? 1 : 2;
      const cells = [];
      for (let i = 0; i < count; i++) {
        cells.push(createCell({ widthRatio: 1 / count, label: i === 0 ? '新增字段' : '备注参数', value: '双击直接编辑' }));
      }
      newRow = createRow(cells, 'auto', 14);
      doc.block.rows.splice(clamp(index, 0, doc.block.rows.length), 0, newRow);
      if (doc.block.layoutMode === 'corner') {
        doc.block.cornerHeightMm = Math.min(doc.sheet.heightMm - 30, doc.block.cornerHeightMm + 13);
      }
    }, { history: true });
    if (selectNew && newRow) {
      state.selection = { kind: 'cell', rowId: newRow.id, cellId: newRow.cells[0].id };
    }
    render();
    notify('已插入新行');
  }

  function duplicateRow(rowId) {
    update((doc) => {
      const idx = doc.block.rows.findIndex((r) => r.id === rowId);
      if (idx === -1) return false;
      const src = doc.block.rows[idx];
      const copy = {
        id: uid('row'),
        heightMode: src.heightMode,
        fixedHeightMm: src.fixedHeightMm,
        cells: src.cells.map((c) => createCell(Object.assign({}, c, { id: uid('cell') })))
      };
      doc.block.rows.splice(idx + 1, 0, copy);
    }, { history: true });
    notify('已复制本行', 'success');
  }

  function deleteRow(rowId) {
    if (state.doc.block.rows.length <= 1) return;
    update((doc) => { doc.block.rows = doc.block.rows.filter((r) => r.id !== rowId); }, { history: true });
    state.selection = { kind: 'table' };
    render();
    notify('已删除该行');
  }

  function addRowEnd() { insertRowAt(state.doc.block.rows.length, true); }

  function splitSelectedCell() {
    if (state.selection.kind !== 'cell') return;
    const { rowId, cellId } = state.selection;
    let newId = cellId;
    update((doc) => {
      const row = doc.block.rows.find((r) => r.id === rowId);
      if (!row) return false;
      const res = splitCellInRow(row, cellId);
      newId = res.newCellId;
      Object.assign(row, res.row);
    }, { history: true });
    state.selection = { kind: 'cell', rowId: rowId, cellId: newId };
    render();
  }

  function mergeSelectedCell() {
    if (state.selection.kind !== 'cell') return;
    const { rowId, cellId } = state.selection;
    let survivor = cellId;
    update((doc) => {
      const row = doc.block.rows.find((r) => r.id === rowId);
      if (!row || row.cells.length <= 1) return false;
      const res = removeOrMergeCellInRow(row, cellId);
      survivor = res.survivorId;
      Object.assign(row, res.row);
    }, { history: true });
    state.selection = { kind: 'cell', rowId: rowId, cellId: survivor };
    render();
  }

  function deleteSelected() {
    const sel = state.selection;
    if (sel.kind === 'cell') {
      const row = state.doc.block.rows.find((r) => r.id === sel.rowId);
      if (!row) return;
      if (row.cells.length > 1) mergeSelectedCell();
      else if (state.doc.block.rows.length > 1) deleteRow(row.id);
    } else if (sel.kind === 'row') {
      deleteRow(sel.rowId);
    }
  }

  function applyFieldToCell(fieldId) {
    const sel = state.selection;
    if (sel.kind !== 'cell') { notify('请先在图纸中选中一个格子', 'error'); return; }
    const field = findDataField(fieldId);
    if (!field) return;
    update((doc) => {
      const row = doc.block.rows.find((r) => r.id === sel.rowId);
      if (!row) return false;
      const cell = row.cells.find((c) => c.id === sel.cellId);
      if (!cell) return false;
      cell.type = 'field';
      cell.fieldId = field.id;
      cell.label = field.label;
      cell.value = field.value;
    }, { history: true });
    notify('已填入「' + field.label + '」', 'success');
  }

  function handleSheetPreset(key) {
    const d = SHEET_DIMENSIONS[key];
    update((doc) => {
      doc.sheet.preset = key;
      doc.sheet.widthMm = d.widthMm;
      doc.sheet.heightMm = d.heightMm;
      const innerW = Math.max(50, d.widthMm - doc.sheet.marginLeftMm - doc.sheet.marginRightMm);
      const innerH = Math.max(40, d.heightMm - doc.sheet.marginTopMm - doc.sheet.marginBottomMm);
      doc.block.cornerWidthMm = clamp(doc.block.cornerWidthMm, 40, Math.round(innerW));
      doc.block.cornerHeightMm = clamp(doc.block.cornerHeightMm, 24, Math.round(innerH));
      doc.block.edgeWidthMm = clamp(doc.block.edgeWidthMm, 24, Math.round(innerW * 0.6));
    }, { history: true });
    requestAnimationFrame(fitToScreen);
  }

  function applyTemplate(tplId) {
    const tpl = TEMPLATES.find((t) => t.id === tplId);
    if (!tpl) return;
    pushHistory();
    const fresh = tpl.create();
    fresh.name = state.doc.name;
    state.doc = fresh;
    state.selection = { kind: 'table' };
    state.ui.templateOpen = false;
    saveProjectSoon();
    renderModals();
    render();
    requestAnimationFrame(fitToScreen);
    notify('已应用「' + tpl.name + '」', 'success');
  }

  /* =============================== 自由文字 =============================== */
  function addFreeText() {
    commitEditing(false);
    const g = state.geometry;
    // 放在当前可见区域中心（落在图纸内），否则放在内框左上角附近
    const rect = els.viewport.getBoundingClientRect();
    let pt = clientToMm(rect.left + rect.width / 2, rect.top + rect.height / 2);
    if (!(pt.x > 0 && pt.x < g.sheetWidthMm && pt.y > 0 && pt.y < g.sheetHeightMm)) pt = { x: g.innerRect.xMm + 20, y: g.innerRect.yMm + 20 };
    const ft = createFreeText({ xMm: snap05(clamp(pt.x - 15, 0, g.sheetWidthMm - 10)), yMm: snap05(clamp(pt.y - 3, 0, g.sheetHeightMm - 5)), text: '双击编辑文字' });
    update((doc) => { if (!Array.isArray(doc.freeTexts)) doc.freeTexts = []; doc.freeTexts.push(ft); }, { history: true });
    state.textEditing = ft.id;
    state.textEditSelectAll = true;
    selectSel({ kind: 'text', id: ft.id });
    notify('已添加文本框：直接输入文字，拖动可移动，上方编辑条可改字体 / 颜色 / 字间距', 'success');
  }
  function deleteFreeText(id) {
    if (!id) return;
    update((doc) => {
      const before = (doc.freeTexts || []).length;
      doc.freeTexts = (doc.freeTexts || []).filter((t) => t.id !== id);
      if (doc.freeTexts.length === before) return false;
    }, { history: true });
    selectSel({ kind: 'none' });
  }
  function duplicateFreeText(id) {
    const src = (state.doc.freeTexts || []).find((t) => t.id === id);
    if (!src) return;
    const ft = createFreeText(Object.assign({}, src, { id: uid('txt'), xMm: src.xMm + 4, yMm: src.yMm + 4 }));
    update((doc) => { doc.freeTexts.push(ft); }, { history: true });
    selectSel({ kind: 'text', id: ft.id });
  }
  /** 进入 / 结束画布内文字编辑 */
  function startFreeTextEdit(id, selectAll) {
    commitEditing(false);
    state.textEditing = id;
    state.textEditSelectAll = !!selectAll;
    state.textEditDirty = false;
    state.selection = { kind: 'text', id: id };
    render();
  }
  function endFreeTextEdit() {
    if (!state.textEditing) return;
    state.textEditing = null;
    state.textEditDirty = false;
    render();
  }

  /* =============================== 模板 JSON 导出 / 导入 =============================== */
  // 导出的文件与 assets/data/frame-templates.json 同格式：当前图框替换同 id 的模板（自定义图框追加为新模板），直接覆盖该文件即可
  async function exportTemplatesJson() {
    commitEditing(false);
    const doc = state.doc;
    const cur = TEMPLATES.find((t) => t.id === doc.templateId && t.source);
    const id = cur ? cur.id : (doc.templateId && doc.templateId !== 'custom' && doc.templateId !== 'tpl-blank' ? doc.templateId : uid('tpl-custom'));
    const entry = {
      id: id,
      name: (cur && cur.name) || doc.name || '自定义图框',
      subtitle: cur ? cur.subtitle : '自定义图框',
      description: cur ? cur.description : '由图框编辑器导出的自定义模板。',
      preview: cur ? cur.preview : (doc.block.layoutMode === 'edge' ? 'side' : ''),
      doc: Object.assign(docToTemplateDoc(doc), { templateId: id })
    };
    const list = TEMPLATES.filter((t) => t.source).map((t) => (t.id === id ? entry : t.source));
    if (!list.some((t) => t.id === id)) list.push(entry);
    const file = Object.assign({}, templatesFileMeta, { version: templatesFileMeta.version || 1, savedAt: new Date().toISOString(), templates: list });
    const text = JSON.stringify(file, null, 2);
    const res1 = await triggerDownload(text, 'frame-templates.json', 'application/json');
    if (res1 && res1.cancelled) return;
    notify('已导出 frame-templates.json（含 ' + list.length + ' 个模板），覆盖 assets/data/frame-templates.json 即可生效', 'success');
  }
  function importTemplatesJson(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const json = JSON.parse(String(reader.result || ''));
        const list = (Array.isArray(json) ? json : (json.templates || (json.doc ? [json] : [])))
          .filter((t) => t && t.id && t.doc && t.doc.block && Array.isArray(t.doc.block.rows) && t.doc.block.rows.length);
        if (!list.length) throw new Error('文件中没有可用的模板');
        TEMPLATES = list.map(templateEntryFromJson);
        if (!Array.isArray(json)) templatesFileMeta = Object.assign({}, json, { templates: undefined });
        state.ui.templateOpen = true;
        renderModals();
        render();
        notify('已载入 ' + list.length + ' 个模板（本次会话有效），点击模板即可应用', 'success');
      } catch (err) {
        notify('模板 JSON 读取失败：' + (err && err.message ? err.message : err), 'error');
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  async function applyImageFile(file, targetCell) {
    if (!file || !targetCell) return;
    try {
      const saved = await StorageDB.saveImage(file, FRAME_IMG_LIMITS);
      update((doc) => {
        const row = doc.block.rows.find((r) => r.id === targetCell.rowId);
        const cell = row && row.cells.find((c) => c.id === targetCell.cellId);
        if (!cell) return false;
        cell.type = 'image';
        cell.imgId = saved.id;
        cell.imgSrc = saved.dataUrl;
        if (!cell.label || cell.label === '字段名称') cell.label = (file.name || '图片').replace(/\.[^.]+$/, '').slice(0, 12) || '图片';
      }, { history: true });
      state.selection = { kind: 'cell', rowId: targetCell.rowId, cellId: targetCell.cellId };
      await pruneFrameCellImages(true);
      render();
      notify('图片已放入所选格子并保存至数据库', 'success');
    } catch (err) {
      notify(err && err.message ? err.message : '图片读取或保存失败', 'error');
    }
  }

  async function clearCellImage() {
    const sel = state.selection;
    if (sel.kind !== 'cell') return;
    update((doc) => {
      const row = doc.block.rows.find((r) => r.id === sel.rowId);
      const cell = row && row.cells.find((c) => c.id === sel.cellId);
      if (!cell) return false;
      cell.imgId = '';
      cell.imgSrc = '';
    }, { history: true });
    await pruneFrameCellImages(true);
    notify('已移除图片');
  }

  /* =============================== 数据绑定 =============================== */
  let bindSessionActive = false;
  let bindSessionDirty = false;
  let bindSessionEl = null;
  let deferPanelRebuild = false;
  let pendingPanelRebuild = false;
  let inFocusOut = false;
  let focusoutTarget = null;
  const NUMBER_PROPS = {
    'cell:paddingXMm': 1, 'cell:paddingYMm': 1, 'cell:offsetXMm': 1, 'cell:offsetYMm': 1,
    'cell:labelFontSizeMm': 1, 'cell:valueFontSizeMm': 1, 'cell:imgScale': 1
  };

  function applyBind(el, commit, skipPanels) {
    const spec = el.getAttribute('data-bind');
    if (!spec) return;
    const vt = el.getAttribute('data-vt') || 'string';
    let value;
    if (el.type === 'checkbox') value = el.checked;
    else if (vt === 'number') { value = Number(el.value); if (!Number.isFinite(value)) return; }
    else value = el.value;
    const parts = spec.split(':');
    const scope = parts[0];
    const updateOpts = { panels: !!commit && !skipPanels, history: !!commit && !bindSessionActive };

    if (scope === 'cell') {
      const prop = parts[1];
      const sel = state.selection;
      if (sel.kind !== 'cell') return;
      const rowId = sel.rowId, cellId = sel.cellId;
      update((doc) => {
        const row = doc.block.rows.find((r) => r.id === rowId);
        const cell = row && row.cells.find((c) => c.id === cellId);
        if (!cell) return false;
        if (prop === 'bold') { cell.fontWeight = value ? 'bold' : 'normal'; return; }
        if (prop === 'imgScale') { cell.imgScale = clamp(value, 0.1, 1.6); return; }
        if (prop === 'lineSpacing') { cell.lineSpacing = clamp(value, 0.6, 3); return; }
        cell[prop] = value;
        if (prop === 'label' || prop === 'value') {
          if (cell.fieldId) {
            const f = doc.customFields.find((x) => x.id === cell.fieldId);
            if (f) f[prop] = value;
          }
        }
        const numeric = NUMBER_PROPS[spec];
        if (numeric) cell[prop] = Math.max(0, value);
      }, updateOpts);
    } else if (scope === 'cellWidth') {
      const sel = state.selection;
      if (sel.kind !== 'cell') return;
      const geom = geomOfSelection();
      const row = rowGeomOf(sel.rowId);
      if (!geom || !row) return;
      if (row.cells.length === 1) {
        update((doc) => {
          if (doc.block.layoutMode === 'edge') doc.block.edgeWidthMm = value;
          else doc.block.cornerWidthMm = value;
        }, updateOpts);
      } else {
        update((doc) => {
          const r = doc.block.rows.find((x) => x.id === sel.rowId);
          if (!r) return false;
          const g = computeLayoutGeometry(doc);
          Object.assign(r, setCellExactWidthInRow(r, sel.cellId, value, g.blockRect.widthMm));
        }, updateOpts);
      }
    } else if (scope === 'row') {
      // 两种写法：row:prop 作用于当前选中行；row:<rowId>:prop 直接指定某一行
      let rowId;
      let rowProp;
      if (parts.length >= 3) { rowId = parts[1]; rowProp = parts[2]; }
      else {
        const sel = state.selection;
        if (sel.kind !== 'cell' && sel.kind !== 'row') return;
        rowId = sel.rowId;
        rowProp = parts[1];
      }
      update((doc) => {
        const row = doc.block.rows.find((r) => r.id === rowId);
        if (!row) return false;
        row[rowProp] = Math.max(6, value);
        if (rowProp === 'fixedHeightMm') row.heightMode = 'fixed';
      }, updateOpts);
    } else if (scope === 'table') {
      update((doc) => {
        doc.block[parts[1]] = value;
        if (parts[1] === 'cornerHeightMm' && doc.block.layoutMode === 'corner' && !doc.block.rows.some((r) => r.heightMode === 'auto')) {
          const sum = doc.block.rows.reduce((a, r) => a + Math.max(6, r.fixedHeightMm), 0);
          if (sum > 0) {
            const ratio = value / sum;
            doc.block.rows.forEach((r) => { r.fixedHeightMm = Math.max(6, Math.round(r.fixedHeightMm * ratio * 10) / 10); });
          }
        }
      }, updateOpts);
    } else if (scope === 'sheet') {
      const prop = parts[1];
      update((doc) => {
        let nextVal = value;
        if (prop === 'axisCols') nextVal = clamp(Math.round(value), 2, 12);
        else if (prop === 'axisRows') nextVal = clamp(Math.round(value), 2, 10);
        else if (prop === 'axisBandMm') nextVal = clamp(value, 2, 12);
        else if (prop === 'axisFontSizeMm') nextVal = clamp(value, 1.2, 5);
        doc.sheet[prop] = nextVal;
        if (prop === 'widthMm' || prop === 'heightMm') doc.sheet.preset = 'CUSTOM';
        if (prop === 'showAxisTicks') state.ui.exportOpts.includeAxisTicks = !!nextVal;
      }, updateOpts);
    } else if (scope === 'text') {
      const prop = parts[1];
      const sel = state.selection;
      if (sel.kind !== 'text') return;
      update((doc) => {
        const ft = (doc.freeTexts || []).find((t) => t.id === sel.id);
        if (!ft) return false;
        if (prop === 'text') ft.text = String(value);
        else if (prop === 'fontSizeMm') ft.fontSizeMm = clamp(value, 1, 40);
        else if (prop === 'widthMm') ft.widthMm = Math.max(0, value);
        else if (prop === 'tracking') ft.tracking = clamp(value, 0.75, 4);
        else if (prop === 'fontKey') ft.fontKey = CAD_FONTS.some((f) => f.key === value) ? value : 'simhei';
        else if (prop === 'xMm' || prop === 'yMm') ft[prop] = value;
      }, updateOpts);
    } else if (scope === 'field') {
      const fieldId = parts[1];
      const prop = parts[2];
      update((doc) => {
        const f = doc.customFields.find((x) => x.id === fieldId);
        if (!f) return false;
        f[prop] = value;
        doc.block.rows.forEach((r) => r.cells.forEach((c) => {
          if (c.fieldId === fieldId) c[prop] = value;
        }));
      }, { panels: false });
    }
  }

  /* =============================== 事件：点击动作 =============================== */
  function handleAction(actEl) {
    const act = actEl.getAttribute('data-act');
    const val = actEl.getAttribute('data-value');
    const row = actEl.getAttribute('data-row');
    const cell = actEl.getAttribute('data-cell');
    switch (act) {
      case 'numberStep': {
        const input = actEl.closest('.number-field').querySelector('input[type="number"]');
        if (!input || input.disabled) break;
        if (!bindSessionActive || bindSessionEl !== input || !bindSessionDirty) {
          pushHistory();
          bindSessionEl = input;
          bindSessionActive = true;
          bindSessionDirty = true;
        }
        const dir = Number(actEl.getAttribute('data-dir'));
        if (dir > 0) input.stepUp(); else input.stepDown();
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.focus({ preventScroll: true });
        break;
      }
      case 'rightTab': {
        state.ui.rightTab = val;
        state.editing = null;
        if (val === 'table') state.selection = { kind: 'table' };
        else if (val === 'page') state.selection = { kind: 'page' };
        else if (state.selection.kind !== 'cell' && state.selection.kind !== 'row') state.selection = { kind: 'none' };
        render();
        break;
      }
      case 'applyTemplate': applyTemplate(val); break;
      case 'openTemplates': state.ui.templateOpen = true; renderModals(); break;
      case 'closeTemplates': state.ui.templateOpen = false; renderModals(); break;
      case 'sheetPreset': handleSheetPreset(val); break;
      case 'selectTable': selectSel({ kind: 'table' }); break;
      case 'selectPage': selectSel({ kind: 'page' }); break;
      case 'selectCell': selectSel({ kind: 'cell', rowId: row, cellId: cell }); closeMobilePanels(); break;
      case 'setCornerPos': update((d) => { d.block.cornerPosition = val; }, { history: true }); break;
      case 'setEdgePos': update((d) => { d.block.edgePosition = val; }, { history: true }); break;
      case 'layoutMode': update((d) => { d.block.layoutMode = val; }, { history: true }); break;
      case 'rowCellCount': {
        update((doc) => {
          const r = doc.block.rows.find((x) => x.id === row);
          if (!r) return false;
          Object.assign(r, updateRowCellCount(r, Number(val)));
        }, { history: true });
        if (state.selection.kind === 'cell' && state.selection.rowId === row) {
          const r = state.doc.block.rows.find((x) => x.id === row);
          if (r && !r.cells.some((c) => c.id === state.selection.cellId)) state.selection = { kind: 'row', rowId: row };
        }
        render();
        break;
      }
      case 'rowHeightMode': {
        const r = rowGeomOf(row);
        setRowHeight(row, val, val === 'fixed' ? Math.round(r ? r.heightMm : 14) : null, true);
        break;
      }
      case 'moveRow': {
        const dir = Number(val);
        update((doc) => {
          const idx = doc.block.rows.findIndex((r) => r.id === row);
          const target = idx + dir;
          if (idx === -1 || target < 0 || target >= doc.block.rows.length) return false;
          const moved = doc.block.rows.splice(idx, 1)[0];
          doc.block.rows.splice(target, 0, moved);
        }, { history: true });
        break;
      }
      case 'deleteRow': deleteRow(row); break;
      case 'duplicateRow': duplicateRow(row); break;
      case 'insertRowAt': insertRowAt(Number(actEl.getAttribute('data-index')), true); break;
      case 'addRowEnd': addRowEnd(); break;
      case 'splitSelected': splitSelectedCell(); break;
      case 'splitCell': splitSelectedCell(); break;
      case 'mergeCell': mergeSelectedCell(); break;
      case 'deleteSelected': deleteSelected(); break;
      case 'cellType': {
        const sel = state.selection;
        if (sel.kind !== 'cell') return;
        update((doc) => {
          const r = doc.block.rows.find((x) => x.id === sel.rowId);
          const c = r && r.cells.find((x) => x.id === sel.cellId);
          if (!c) return false;
          c.type = val;
        }, { history: true });
        break;
      }
      case 'fieldLayout': {
        const sel = state.selection;
        if (sel.kind !== 'cell') return;
        update((doc) => {
          const r = doc.block.rows.find((x) => x.id === sel.rowId);
          const c = r && r.cells.find((x) => x.id === sel.cellId);
          if (!c) return false;
          c.fieldLayout = val;
        }, { history: true });
        break;
      }
      case 'textDirection': {
        const sel = state.selection;
        if (sel.kind !== 'cell') return;
        update((doc) => {
          const r = doc.block.rows.find((x) => x.id === sel.rowId);
          const c = r && r.cells.find((x) => x.id === sel.cellId);
          if (!c) return false;
          c.textDirection = val;
        }, { history: true });
        break;
      }
      case 'align': {
        const sel = state.selection;
        if (sel.kind !== 'cell') return;
        update((doc) => {
          const r = doc.block.rows.find((x) => x.id === sel.rowId);
          const c = r && r.cells.find((x) => x.id === sel.cellId);
          if (!c) return false;
          c.hAlign = actEl.getAttribute('data-h');
          c.vAlign = actEl.getAttribute('data-v');
        }, { history: true });
        break;
      }
      case 'textColor': {
        const sel = state.selection;
        if (sel.kind !== 'cell') return;
        update((doc) => {
          const r = doc.block.rows.find((x) => x.id === sel.rowId);
          const c = r && r.cells.find((x) => x.id === sel.cellId);
          if (!c) return false;
          c.textColor = val;
        }, { history: true });
        break;
      }
      case 'uploadCellImage': {
        const sel = state.selection;
        pendingImageCell = sel.kind === 'cell' ? { rowId: sel.rowId, cellId: sel.cellId } : null;
        if (!pendingImageCell) { notify('请先选中一个格子', 'error'); break; }
        els.imageInput.click();
        break;
      }
      case 'clearCellImage': clearCellImage(); break;
      case 'toggleClean': {
        state.ui.cleanPreview = !state.ui.cleanPreview;
        state.editing = null;
        render();
        break;
      }
      case 'zoomIn': zoomBy(1.18); break;
      case 'zoomOut': zoomBy(1 / 1.18); break;
      case 'fitSheet': fitToScreen(); break;
      case 'focusBlock': focusBlock(); break;
      case 'toggleRowMode': {
        const sel = state.selection;
        if (sel.kind !== 'cell') return;
        const r = rowGeomOf(sel.rowId);
        if (!r) return;
        setRowHeight(sel.rowId, r.heightMode === 'auto' ? 'fixed' : 'auto', Math.round(r.heightMm), true);
        break;
      }
      case 'openExport': openExportModal(); break;
      case 'closeExport': state.ui.exportOpen = false; renderModals(); break;
      case 'quickDownload': quickDownloadDxf(); break;
      case 'downloadDxf': downloadDxf(); break;
      case 'copyDxf': copyDxfSource(); break;
      case 'exportVersion': state.ui.exportOpts.dxfVersion = Number(val) === 1032 ? 1032 : 1021; renderModals(); runExportPreview(); break;
      case 'exportToggle': {
        const key = actEl.getAttribute('data-key');
        state.ui.exportOpts[key] = actEl.checked;
        renderModals();
        runExportPreview();
        break;
      }
      case 'sheetAxisSides':
        update((doc) => { doc.sheet.axisSides = val; }, { history: true });
        break;
      case 'addFreeText': addFreeText(); break;
      case 'deleteFreeText': state.textEditing = null; deleteFreeText(state.selection.id); break;
      case 'editFreeText': if (state.selection.kind === 'text') startFreeTextEdit(state.selection.id, false); break;
      case 'duplicateFreeText': duplicateFreeText(state.selection.id); break;
      case 'freeTextAlign':
      case 'freeTextColor': {
        const sel = state.selection;
        if (sel.kind !== 'text') return;
        update((doc) => {
          const ft = (doc.freeTexts || []).find((t) => t.id === sel.id);
          if (!ft) return false;
          if (act === 'freeTextAlign') ft.hAlign = val; else ft.textColor = val;
        }, { history: true });
        break;
      }
      case 'exportTemplatesJson': exportTemplatesJson(); break;
      case 'importTemplatesJson': els.jsonInput.click(); break;
      default: break;
    }
  }

  function flushDeferredPanelRebuild() {
    deferPanelRebuild = false;
    if (!pendingPanelRebuild) return;
    const active = document.activeElement;
    if (active && active.tagName === 'SELECT' && active.closest('#rightPanel')) return;
    pendingPanelRebuild = false;
    renderRightPanel();
  }

  document.addEventListener('pointerdown', (e) => {
    if (e.target.closest('.number-steppers')) e.preventDefault();
    const panel = e.target.closest('#rightPanel');
    const ctrl = panel && e.target.closest('button, label, input, select, textarea, [data-act], [data-bind]');
    const active = document.activeElement;
    if (ctrl && active && active !== ctrl && !ctrl.contains(active) &&
      active.matches && active.matches('#rightPanel [data-bind]')) {
      deferPanelRebuild = true;
      pendingPanelRebuild = false;
    } else {
      deferPanelRebuild = false;
      pendingPanelRebuild = false;
    }
  });

  window.addEventListener('pointerup', () => {
    if (!deferPanelRebuild && !pendingPanelRebuild) return;
    setTimeout(flushDeferredPanelRebuild, 0);
  });

  window.addEventListener('pointercancel', () => {
    if (!deferPanelRebuild && !pendingPanelRebuild) return;
    setTimeout(flushDeferredPanelRebuild, 0);
  });

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.tagName === 'INPUT' && el.type === 'checkbox') return; // 由 change 处理
    deferPanelRebuild = false;
    pendingPanelRebuild = false;
    if (!els.stage.contains(el)) commitEditing(false);
    handleAction(el);
  });

  document.addEventListener('change', (e) => {
    const el = e.target;
    if (el.matches('input[type="color"][data-color-act]')) {
      el.setAttribute('data-act', el.getAttribute('data-color-act'));
      el.setAttribute('data-value', el.value.toLowerCase());
      handleAction(el);
      el.removeAttribute('data-act');
      return;
    }
    if (el.matches('input[type="checkbox"][data-act]')) {
      deferPanelRebuild = false;
      pendingPanelRebuild = false;
      handleAction(el);
      return;
    }
    if (el.matches('select[data-act="applyFieldSelect"]')) {
      deferPanelRebuild = false;
      pendingPanelRebuild = false;
      const sel = state.selection;
      if (sel.kind !== 'cell') return;
      const id = el.value;
      if (!id) {
        update((doc) => {
          const r = doc.block.rows.find((x) => x.id === sel.rowId);
          const c = r && r.cells.find((x) => x.id === sel.cellId);
          if (c) c.fieldId = undefined;
        }, { history: true });
      } else {
        applyFieldToCell(id);
      }
      return;
    }
    if (el.matches('[data-bind]')) {
      const t = el.type;
      if (t === 'checkbox' || el.tagName === 'SELECT') {
        deferPanelRebuild = false;
        pendingPanelRebuild = false;
        bindSessionActive = false;
        bindSessionDirty = false;
        bindSessionEl = null;
        applyBind(el, true, false);
        return;
      }
      const needHistory = !(bindSessionActive && bindSessionEl === el && bindSessionDirty);
      if (needHistory) pushHistory();
      const skipPanels = deferPanelRebuild;
      if (skipPanels) pendingPanelRebuild = true;
      bindSessionActive = true;
      applyBind(el, true, skipPanels);
      bindSessionActive = false;
      bindSessionDirty = false;
      bindSessionEl = null;
    }
  });

  document.addEventListener('input', (e) => {
    const el = e.target;
    if (el.matches('[data-ft-editor]')) {
      const id = el.getAttribute('data-ft-editor');
      if (!state.textEditDirty) { pushHistory(); state.textEditDirty = true; }
      silentUpdate((doc) => {
        const ft = (doc.freeTexts || []).find((t) => t.id === id);
        if (!ft) return false;
        ft.text = el.value;
      });
      el.rows = Math.max(1, el.value.split('\n').length);
      const ft = (state.doc.freeTexts || []).find((t) => t.id === id);
      if (ft && !(ft.widthMm > 0)) {
        const fsPx = parseFloat(el.style.fontSize) || 12;
        const ls = (ft.tracking || 1) - 1;
        el.style.width = ((Math.max(4, ...el.value.split('\n').map((l) => measureCadTextEm(l) || l.length)) + 1) * (1 + ls) * fsPx) + 'px';
      }
      if (el.parentElement && el.parentElement.classList.contains('free-text-edit-wrap')) {
        el.parentElement.classList.toggle('is-compact-y', el.parentElement.offsetHeight * state.view.zoom < 26);
      }
      const side = els.rightPanel.querySelector('[data-bind="text:text"]');
      if (side && side !== el) side.value = el.value;
      return;
    }
    if (el.matches('input[type="color"][data-color-act]')) {
      // 拖动取色时只做实时预览，松开 / 关闭取色器时 change 再写入文档
      const host = el.closest('.swatch-picker, .tfb-color');
      if (host) host.style.background = el.value;
      const sel = state.selection;
      if (sel.kind === 'text') {
        const node = els.stage.querySelector('[data-role="free-text"][data-id="' + sel.id + '"]');
        if (node) node.style.color = el.value;
      }
      return;
    }
    if (el.matches('[data-lazy]')) return;   // 悬浮编辑条：回车 / 失焦时由 change 提交
    if (el.matches('[data-editor]')) {
      const cellEl = el.closest('[data-role="cell"]');
      if (!cellEl) return;
      const rowId = cellEl.getAttribute('data-row');
      const cellId = cellEl.getAttribute('data-cell');
      const field = el.getAttribute('data-editor');
      silentUpdate((doc) => {
        const r = doc.block.rows.find((x) => x.id === rowId);
        const c = r && r.cells.find((x) => x.id === cellId);
        if (!c) return false;
        c[field] = el.value;
        if (c.fieldId) {
          const f = doc.customFields.find((x) => x.id === c.fieldId);
          if (f) f[field] = el.value;
        }
      });
      return;
    }
    if (el.matches('[data-bind]') && el.type !== 'checkbox') {
      if (!bindSessionActive || bindSessionEl !== el) {
        bindSessionEl = el;
        bindSessionActive = true;
        bindSessionDirty = false;
      }
      if (!bindSessionDirty) {
        const vt = el.getAttribute('data-vt') || 'string';
        if (vt !== 'number' || (el.value !== '' && Number.isFinite(Number(el.value)))) {
          pushHistory();
          bindSessionDirty = true;
        }
      }
      applyBind(el, false);
    }
  });

  document.addEventListener('focusin', (e) => {
    const el = e.target;
    if (!el.matches || !el.matches('[data-bind]')) return;
    const t = el.type;
    if (t === 'checkbox' || el.tagName === 'SELECT') return;
    if (bindSessionActive && bindSessionEl === el) return;
    bindSessionEl = el;
    bindSessionActive = true;
    bindSessionDirty = false;
  });

  document.addEventListener('focusout', (e) => {
    const el = e.target;
    if (el.matches && el.matches('[data-ft-editor]')) {
      const to = e.relatedTarget;
      if (to && to.closest && to.closest('.text-float-bar')) return;
      setTimeout(() => { if (state.textEditing && document.activeElement !== el) endFreeTextEdit(); }, 0);
      return;
    }
    const isBind = el.matches && el.matches('[data-bind]');
    const t = el.type;
    if (!isBind || t === 'checkbox' || el.tagName === 'SELECT') {
      if (el && el.tagName === 'SELECT' && pendingPanelRebuild) {
        setTimeout(flushDeferredPanelRebuild, 0);
      }
      return;
    }
    if (el.isConnected && bindSessionDirty && (!bindSessionEl || bindSessionEl === el)) {
      const skipPanels = deferPanelRebuild;
      if (skipPanels) pendingPanelRebuild = true;
      inFocusOut = true;
      focusoutTarget = e.relatedTarget || null;
      try {
        applyBind(el, true, skipPanels);
      } finally {
        inFocusOut = false;
        focusoutTarget = null;
      }
    }
    bindSessionActive = false;
    bindSessionDirty = false;
    bindSessionEl = null;
  });

  /* =============================== 画布指针交互 =============================== */
  let spacePressed = false;

  els.viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const r = els.viewport.getBoundingClientRect();
    zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  els.viewport.addEventListener('pointerdown', (e) => {
    if (state.ui.cleanPreview) return;
    const target = e.target;
    // 悬浮操作菜单：不触发画布选中 / 平移，交给 click 委托处理
    if (target.closest('.cell-float-menu, .text-float-bar')) { e.stopPropagation(); return; }
    if (target.closest('[data-ft-editor]')) { e.stopPropagation(); return; }
    const cornerEl = target.closest('[data-role="ft-corner"]');
    if (cornerEl) {
      e.preventDefault();
      e.stopPropagation();
      const id = cornerEl.getAttribute('data-id');
      const corner = cornerEl.getAttribute('data-corner');
      if (state.textEditing) endFreeTextEdit();
      const ft = (state.doc.freeTexts || []).find((t) => t.id === id);
      const box = els.stage.querySelector('[data-role="free-text"][data-id="' + id + '"]');
      if (!ft || !box) return;
      const origW = ft.widthMm > 0 ? ft.widthMm : Math.max(2, box.offsetWidth / PX_PER_MM);
      const origH = Math.max(2, box.offsetHeight / PX_PER_MM);
      const anchorX = (corner === 'nw' || corner === 'sw') ? ft.xMm + origW : ft.xMm;
      const anchorY = (corner === 'nw' || corner === 'ne') ? ft.yMm + origH : ft.yMm;
      state.drag = {
        kind: 'ft-corner', id: id, corner: corner,
        startX: e.clientX, startY: e.clientY,
        origX: ft.xMm, origY: ft.yMm, origW: origW, origH: origH,
        origFs: ft.fontSizeMm, origWidthMm: ft.widthMm,
        anchorX: anchorX, anchorY: anchorY, moved: false
      };
      bindWindowDrag();
      return;
    }
    const rz = target.closest('[data-role="ft-resize"]');
    if (rz) {
      e.preventDefault();
      e.stopPropagation();
      const id = rz.getAttribute('data-id');
      const side = rz.getAttribute('data-side') || 'right';
      if (state.textEditing) endFreeTextEdit();
      const ft = (state.doc.freeTexts || []).find((t) => t.id === id);
      const box = els.stage.querySelector('[data-role="free-text"][data-id="' + id + '"]');
      if (!ft || !box) return;
      const curW = ft.widthMm > 0 ? ft.widthMm : box.offsetWidth / PX_PER_MM;
      state.drag = { kind: 'ft-resize', id: id, side: side, startX: e.clientX, origX: ft.xMm, origW: curW, moved: false };
      bindWindowDrag();
      return;
    }
    if (state.textEditing) endFreeTextEdit();
    const cellEl = target.closest('[data-role="cell"]');

    // 平移：中键 / 空格
    if (e.button === 1 || (e.button === 0 && spacePressed)) {
      e.preventDefault();
      state.drag = { kind: 'pan', startX: e.clientX, startY: e.clientY, origX: state.view.panX, origY: state.view.panY };
      els.viewport.classList.add('panning');
      bindWindowDrag();
      return;
    }
    if (e.button !== 0) return;

    const resizer = target.closest('[data-role="col-resizer"]');
    if (resizer) {
      e.preventDefault();
      e.stopPropagation();
      commitEditing(false);
      pushHistory();
      const rowId = resizer.getAttribute('data-row');
      state.drag = {
        kind: 'col-divider', rowId: rowId, index: Number(resizer.getAttribute('data-index')),
        snapXs: getMagneticSnapRelativeXs(state.geometry, rowId), snapX: null, startX: e.clientX
      };
      bindWindowDrag();
      return;
    }

    const rowRes = target.closest('[data-role="row-resizer"]');
    if (rowRes) {
      e.preventDefault();
      e.stopPropagation();
      commitEditing(false);
      pushHistory();
      const rowId = rowRes.getAttribute('data-row');
      const row = rowGeomOf(rowId);
      state.drag = { kind: 'row-divider', rowId: rowId, startY: e.clientY, origH: row ? row.heightMm : 14 };
      bindWindowDrag();
      return;
    }

    const rowSel = target.closest('[data-role="row-selector"]');
    if (rowSel) {
      e.stopPropagation();
      selectSel({ kind: 'row', rowId: rowSel.getAttribute('data-row') });
      return;
    }

    const handle = target.closest('[data-role="block-resize"]');
    if (handle) {
      e.preventDefault();
      e.stopPropagation();
      commitEditing(false);
      pushHistory();
      const br = state.geometry.blockRect;
      state.drag = {
        kind: 'block-outer', handle: handle.getAttribute('data-handle'),
        startX: e.clientX, startY: e.clientY, origW: br.widthMm, origH: br.heightMm
      };
      bindWindowDrag();
      return;
    }

    const ftEl = target.closest('[data-role="free-text"]');
    if (ftEl) {
      e.preventDefault();
      e.stopPropagation();
      commitEditing(false);
      const id = ftEl.getAttribute('data-id');
      const ft = (state.doc.freeTexts || []).find((t) => t.id === id);
      if (!ft) return;
      if (!(state.selection.kind === 'text' && state.selection.id === id)) {
        state.selection = { kind: 'text', id: id };
        render();
      }
      state.drag = { kind: 'free-text', id: id, startX: e.clientX, startY: e.clientY, origX: ft.xMm, origY: ft.yMm, moved: false };
      bindWindowDrag();
      return;
    }

    const tag = target.closest('[data-role="table-tag"]');
    if (tag) {
      e.stopPropagation();
      selectSel({ kind: 'table' });
      return;
    }

    if (cellEl) {
      e.stopPropagation();
      const rowId = cellEl.getAttribute('data-row');
      const cellId = cellEl.getAttribute('data-cell');
      const isSame = state.selection.kind === 'cell' && state.selection.rowId === rowId && state.selection.cellId === cellId;
      if (state.editing && !(state.editing.rowId === rowId && state.editing.cellId === cellId)) commitEditing(false);
      if (!isSame) {
        state.selection = { kind: 'cell', rowId: rowId, cellId: cellId };
        render();
      }
      return;
    }

    // 空白处：取消选择
    commitEditing(false);
    if (e.target.closest('.drawing-sheet')) {
      selectSel({ kind: 'page' });
    } else {
      state.selection = { kind: 'none' };
      state.drag = { kind: 'pan', startX: e.clientX, startY: e.clientY, origX: state.view.panX, origY: state.view.panY };
      els.viewport.classList.add('panning');
      bindWindowDrag();
      render();
    }
  });

  els.viewport.addEventListener('dblclick', (e) => {
    if (state.ui.cleanPreview) return;
    if (e.target.closest('[data-ft-editor]')) return;
    const ftEl = e.target.closest('[data-role="free-text"]');
    if (ftEl) {
      e.preventDefault();
      startFreeTextEdit(ftEl.getAttribute('data-id'), false);
      return;
    }
    const cellEl = e.target.closest('[data-role="cell"]');
    if (!cellEl) return;
    e.preventDefault();
    startEdit(cellEl.getAttribute('data-row'), cellEl.getAttribute('data-cell'), 'value');
  });

  /* 拖拽与拖放：把图片拖到格子内 */
  els.viewport.addEventListener('dragover', (e) => {

  els.viewport.addEventListener('dragleave', () => {

  function bindWindowDrag() {
    window.addEventListener('pointermove', onWindowPointerMove);

  function showDragTip(e, text) {
    const tip = els.dragTooltip;
    tip.classList.remove('hidden');

    tip.style.top = (e.clientY + 14) + 'px';
