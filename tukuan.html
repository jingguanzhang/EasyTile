  function onWindowPointerMove(e) {
    const d = state.drag;
    if (!d) return;
    if (d.kind === 'pan') {
      state.view.panX = d.origX + (e.clientX - d.startX);
      state.view.panY = d.origY + (e.clientY - d.startY);
      const layer = els.stage.querySelector('.sheet-layer');
      if (layer) layer.style.transform = 'translate(' + state.view.panX + 'px,' + state.view.panY + 'px) scale(' + state.view.zoom + ')';
      return;
    }
    if (d.kind === 'ft-corner') {
      const dxMm = (e.clientX - d.startX) / state.view.zoom / PX_PER_MM;
      const dyMm = (e.clientY - d.startY) / state.view.zoom / PX_PER_MM;
      if (!d.moved) {
        if (Math.abs(e.clientX - d.startX) + Math.abs(e.clientY - d.startY) < 2) return;
        d.moved = true;
        pushHistory();
      }
      const sx = (d.corner === 'ne' || d.corner === 'se') ? 1 : -1;
      const sy = (d.corner === 'sw' || d.corner === 'se') ? 1 : -1;
      const dwRatio = (sx * dxMm) / Math.max(1, d.origW);
      const dhRatio = (sy * dyMm) / Math.max(1, d.origH);
      const absW = Math.abs(dwRatio), absH = Math.abs(dhRatio);
      const denom = absW + absH;
      const deltaRatio = denom > 1e-6 ? (dwRatio * absW + dhRatio * absH) / denom : 0;
      const rawScale = Math.max(1 / d.origFs, Math.min(40 / d.origFs, 1 + deltaRatio));
      const newFs = clamp(e.altKey ? Math.round(d.origFs * rawScale * 100) / 100 : snap1(d.origFs * rawScale), 1, 40);
      const actualScale = newFs / d.origFs;
      const newWidthMm = d.origWidthMm > 0
        ? Math.max(3, Math.round(d.origWidthMm * actualScale * 10) / 10)
        : 0;
      const isLeft = d.corner === 'nw' || d.corner === 'sw';
      const isTop = d.corner === 'nw' || d.corner === 'ne';
      const g = state.geometry;
      silentUpdate((doc) => {
        const ft = (doc.freeTexts || []).find((t) => t.id === d.id);
        if (!ft) return false;
        ft.fontSizeMm = newFs;
        ft.widthMm = newWidthMm;
        const estW = newWidthMm > 0 ? newWidthMm : d.origW * actualScale;
        const estH = d.origH * actualScale;
        ft.xMm = isLeft ? clamp(Math.round((d.anchorX - estW) * 100) / 100, 0, g.sheetWidthMm - 1) : d.origX;
        ft.yMm = isTop ? clamp(Math.round((d.anchorY - estH) * 100) / 100, 0, g.sheetHeightMm - 1) : d.origY;
      });
      renderCanvas();
      if (isLeft || isTop) {
        const box = els.stage.querySelector('[data-role="free-text"][data-id="' + d.id + '"]');
        if (box) {
          const realW = newWidthMm > 0 ? newWidthMm : (box.offsetWidth / PX_PER_MM);
          const realH = box.offsetHeight / PX_PER_MM;
          let adjusted = false;
          silentUpdate((doc) => {
            const ft = (doc.freeTexts || []).find((t) => t.id === d.id);
            if (!ft) return false;
            if (isLeft) {
              const nx = clamp(Math.round((d.anchorX - realW) * 100) / 100, 0, g.sheetWidthMm - 1);
              if (Math.abs(nx - ft.xMm) > 0.01) { ft.xMm = nx; adjusted = true; }
            }
            if (isTop) {
              const ny = clamp(Math.round((d.anchorY - realH) * 100) / 100, 0, g.sheetHeightMm - 1);
              if (Math.abs(ny - ft.yMm) > 0.01) { ft.yMm = ny; adjusted = true; }
            }
          });
          if (adjusted) renderCanvas();
        }
      }
      showDragTip(e, '字高 ' + newFs.toFixed(1) + ' mm' + (newWidthMm > 0 ? ' · 宽 ' + newWidthMm.toFixed(1) + ' mm' : '') + '（按住 Alt 精细缩放）');
      return;
    }
    if (d.kind === 'ft-resize') {
      const dxMm = (e.clientX - d.startX) / state.view.zoom / PX_PER_MM;
      if (!d.moved) {
        if (Math.abs(e.clientX - d.startX) < 2) return;
        d.moved = true;
        pushHistory();
      }
      if (d.side === 'left') {
        const anchorRight = d.origX + d.origW;
        let w = clamp(d.origW - dxMm, 4, anchorRight);
        if (!e.altKey) w = Math.max(4, Math.min(anchorRight, snap05(w)));
        const x = Math.max(0, anchorRight - w);
        silentUpdate((doc) => {
          const ft = (doc.freeTexts || []).find((t) => t.id === d.id);
          if (!ft) return false;
          ft.widthMm = w;
          ft.xMm = x;
        });
        showDragTip(e, '文本框宽度 ' + w.toFixed(1) + ' mm（超出自动换行）');
      } else {
        let w = d.origW + dxMm;
        if (!e.altKey) w = snap05(w);
        w = w < 3 ? 0 : w;
        silentUpdate((doc) => {
          const ft = (doc.freeTexts || []).find((t) => t.id === d.id);
          if (!ft) return false;
          ft.widthMm = w;
        });
        showDragTip(e, w > 0 ? '文本框宽度 ' + w.toFixed(1) + ' mm（超出自动换行）' : '自动宽度（不换行）');
      }
      renderCanvas();
      return;
    }
    if (d.kind === 'free-text') {
      const dxMm = (e.clientX - d.startX) / state.view.zoom / PX_PER_MM;
      const dyMm = (e.clientY - d.startY) / state.view.zoom / PX_PER_MM;
      if (!d.moved) {
        if (Math.abs(e.clientX - d.startX) + Math.abs(e.clientY - d.startY) < 3) return;
        d.moved = true;
        pushHistory();
      }
      const g = state.geometry;
      let x = clamp(d.origX + dxMm, 0, g.sheetWidthMm - 1);
      let y = clamp(d.origY + dyMm, 0, g.sheetHeightMm - 1);
      if (!e.altKey) { x = snap05(x); y = snap05(y); }
      silentUpdate((doc) => {
        const ft = (doc.freeTexts || []).find((t) => t.id === d.id);
        if (!ft) return false;
        ft.xMm = x; ft.yMm = y;
      });
      showDragTip(e, '文字位置 X ' + x.toFixed(1) + ' mm · Y ' + y.toFixed(1) + ' mm（距纸张左上角）');
      renderCanvas();
      return;
    }
    if (d.kind === 'col-divider') {
      const pt = clientToMm(e.clientX, e.clientY);
      const g = state.geometry;
      let relX = pt.x - g.blockRect.xMm;
      if (!e.altKey) relX = Math.round(relX * 2) / 2;
      let snapped = null;
      if (!e.altKey) {
        for (const sx of d.snapXs) {
          if (Math.abs(relX - sx) <= 1.6) { relX = sx; snapped = sx; break; }
        }
      }
      d.snapX = snapped;
      const rowGeom = rowGeomOf(d.rowId);
      silentUpdate((doc) => {
        const row = doc.block.rows.find((r) => r.id === d.rowId);
        if (!row) return false;
        const gg = computeLayoutGeometry(doc);
        Object.assign(row, resizeRowDividerAtPosition(row, d.index, relX, gg.blockRect.widthMm));
      });
      if (rowGeom && rowGeom.cells[d.index] && rowGeom.cells[d.index + 1]) {
        const lx = rowGeom.cells[d.index].xMm - g.blockRect.xMm;
        const pairW = rowGeom.cells[d.index].widthMm + rowGeom.cells[d.index + 1].widthMm;
        const lw = clamp(relX - lx, 8, pairW - 8);
        showDragTip(e, '左格 ' + lw.toFixed(1) + ' mm │ 右格 ' + (pairW - lw).toFixed(1) + ' mm' + (snapped != null ? ' · 已跨行磁吸对齐' : ''));
      }
      renderCanvas();
      return;
    }
    if (d.kind === 'row-divider') {
      const rowGeom = rowGeomOf(d.rowId);
      const deltaMm = (e.clientY - d.startY) / state.view.zoom / PX_PER_MM;
      const raw = Math.max(6, d.origH + deltaMm);
      const h = e.altKey ? raw : Math.round(raw * 2) / 2;
      silentUpdate((doc) => {
        const row = doc.block.rows.find((r) => r.id === d.rowId);
        if (!row) return false;
        row.heightMode = 'fixed';
        row.fixedHeightMm = h;
      });
      const r2 = rowGeomOf(d.rowId);
      if (r2 && state.doc.block.layoutMode === 'corner' && !state.doc.block.rows.some((r) => r.heightMode === 'auto')) {
        silentUpdate((doc) => {
          doc.block.cornerHeightMm = doc.block.rows.reduce((a, r) => a + Math.max(6, r.fixedHeightMm), 0);
        });
      }
      showDragTip(e, '第 ' + ((rowGeom ? rowGeom.rowIndex : 0) + 1) + ' 行固定高度 ' + h.toFixed(1) + ' mm（双击分隔线可恢复自适应）');
      renderCanvas();
      return;
    }
    if (d.kind === 'block-outer') {
      const dxMm = (e.clientX - d.startX) / state.view.zoom / PX_PER_MM;
      const dyMm = (e.clientY - d.startY) / state.view.zoom / PX_PER_MM;
      const b = state.doc.block;
      const g = state.geometry;
      if (b.layoutMode === 'edge') {
        const sign = b.edgePosition === 'right' ? -1 : 1;
        const w = Math.round(clamp(d.origW + sign * dxMm, 28, g.innerRect.widthMm * 0.6) * 2) / 2;
        silentUpdate((doc) => { doc.block.edgeWidthMm = w; });
        showDragTip(e, '竖列通栏宽度 ' + w.toFixed(1) + ' mm');
      } else {
        const signX = b.cornerPosition.endsWith('right') ? -1 : 1;
        const signY = b.cornerPosition.startsWith('bottom') ? -1 : 1;
        const patch = {};
        if (d.handle === 'table-left' || d.handle === 'table-right') patch.cw = Math.round(clamp(d.origW + signX * dxMm, 50, g.innerRect.widthMm) * 2) / 2;
        if (d.handle === 'table-top' || d.handle === 'table-bottom') patch.ch = Math.round(clamp(d.origH + signY * dyMm, 24, g.innerRect.heightMm) * 2) / 2;
        silentUpdate((doc) => {
          if (patch.cw != null) doc.block.cornerWidthMm = patch.cw;
          if (patch.ch != null) {
            doc.block.cornerHeightMm = patch.ch;
            if (!doc.block.rows.some((r) => r.heightMode === 'auto')) {
              const sum = doc.block.rows.reduce((a, r) => a + Math.max(6, r.fixedHeightMm), 0);
              if (sum > 0) {
                const ratio = patch.ch / sum;
                doc.block.rows.forEach((r) => { r.fixedHeightMm = Math.max(6, Math.round(r.fixedHeightMm * ratio * 10) / 10); });
              }
            }
          }
        });
        showDragTip(e, '参数框 ' + snap1(patch.cw != null ? patch.cw : d.origW) + ' × ' + snap1(patch.ch != null ? patch.ch : d.origH) + ' mm');
      }
      renderCanvas();
      return;
    }
  }

  function onWindowPointerUp() {
    const d = state.drag;
    state.drag = null;
    window.removeEventListener('pointermove', onWindowPointerMove);
    window.removeEventListener('pointerup', onWindowPointerUp);
    document.body.classList.remove('is-dragging');
    els.viewport.classList.remove('panning');
    els.dragTooltip.classList.add('hidden');
    if (d) { saveProjectSoon(); render(); }
  }

  /* =============================== 键盘 =============================== */
  window.addEventListener('keydown', (e) => {
    const tag = (e.target.tagName || '').toLowerCase();
    const inInput = tag === 'input' || tag === 'textarea' || tag === 'select';
    if (e.code === 'Space' && !inInput) { spacePressed = true; e.preventDefault(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
      if (inInput && e.target.getAttribute && e.target.getAttribute('data-editor')) { /* 允许原生撤销 */ return; }
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (e.key === 'Escape') {
      if (state.textEditing) { e.preventDefault(); endFreeTextEdit(); return; }
      if (state.editing) { commitEditing(); return; }
      if (state.selection.kind !== 'none') { selectSel({ kind: 'none' }); return; }
    }
    if (state.editing) {
      if (e.key === 'Tab') { e.preventDefault(); editNextCell(e.shiftKey ? -1 : 1); return; }
      if (e.key === 'Enter' && !e.shiftKey && e.target.tagName === 'TEXTAREA' && e.target.value.indexOf('\n') === -1) { e.preventDefault(); commitEditing(); return; }
      if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); commitEditing(); return; }
    }
    if (!inInput && e.key === 'Enter' && state.selection.kind === 'cell') {
      e.preventDefault();
      startEdit(state.selection.rowId, state.selection.cellId, 'value');
    }
    if (!inInput && (e.key === 'Delete' || e.key === 'Backspace') && state.selection.kind === 'text') {
      e.preventDefault();
      deleteFreeText(state.selection.id);
      return;
    }
    if (!inInput && e.key === 'Enter' && state.selection.kind === 'text') { e.preventDefault(); startFreeTextEdit(state.selection.id, false); return; }
    if (!inInput && (e.key === 'Delete' || e.key === 'Backspace') && state.selection.kind === 'cell') {
      e.preventDefault();
      const sel = state.selection;
      update((doc) => {
        const r = doc.block.rows.find((x) => x.id === sel.rowId);
        const c = r && r.cells.find((x) => x.id === sel.cellId);
        if (c) c.value = '';
      }, { history: true });
    }
  });
  window.addEventListener('keyup', (e) => { if (e.code === 'Space') spacePressed = false; });

    /* =============================== DXF 导出引擎 (acadrust WASM) =============================== */
  const { CAD_VERSION, loadAcadrust } = CadShared;

  /* ---------- 图片格 → CAD 实体 ----------
   * DXF/DWG 无法内嵌位图（IMAGE 只能引用外部文件，换台电脑即丢失），因此把图片栅格化为
   * AutoCAD 索引色 (ACI) 的 SOLID 填充色块：同色相邻像素合并为矩形，透明与纯白像素视为纸面不输出。
   * 解码是异步的，导出 / 保存前先 primeImageRasters() 预解码，buildCadDrawingSpec 内同步读取缓存。 */
  const imageRasterCache = new Map();   // imgSrc -> { canvas, w, h } | null
  function loadImageRaster(src) {
    if (!src) return Promise.resolve(null);
    if (imageRasterCache.has(src)) return Promise.resolve(imageRasterCache.get(src));
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const nw = img.naturalWidth || img.width || 256, nh = img.naturalHeight || img.height || 256;
        const k = Math.min(1, 600 / Math.max(nw, nh));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(nw * k)); cv.height = Math.max(1, Math.round(nh * k));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        const ras = { canvas: cv, w: cv.width, h: cv.height };
        imageRasterCache.set(src, ras);
        resolve(ras);
      };
      img.onerror = () => { imageRasterCache.set(src, null); resolve(null); };
      img.src = src;
    });
  }
  function primeImageRasters(doc) {
    const srcs = new Set();
    ((doc && doc.block && doc.block.rows) || []).forEach((r) => r.cells.forEach((c) => { if (c.type === 'image' && c.imgSrc) srcs.add(c.imgSrc); }));
    return Promise.all(Array.from(srcs).map(loadImageRaster));
  }
  function r3(v) {
    const n = Number(v);
    return Number.isFinite(n) ? Math.round(n * 1000) / 1000 : 0;
  }

  function cleanCadText(str) {
    return String(str == null ? '' : str).replace(/[\r\n]+/g, ' ').trim();
  }

  let g_cadMeasureCtx = null;
  let g_cadMeasureReady = null;
  function measureCadTextEm(str) {
    const s = cleanCadText(str);
    if (!s) return 0;
    if (g_cadMeasureReady === null) {
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas && canvas.getContext && canvas.getContext('2d');
        if (ctx) {
          ctx.font = '100px SimHei, "Microsoft YaHei", sans-serif';
          const probe = ctx.measureText('中').width;
          if (probe > 60) {
            g_cadMeasureCtx = ctx;
            g_cadMeasureReady = true;
          } else {
            g_cadMeasureReady = false;
          }
        } else {
          g_cadMeasureReady = false;
        }
      } catch (err) {
        g_cadMeasureReady = false;
      }
    }
    if (g_cadMeasureReady && g_cadMeasureCtx) {
      return g_cadMeasureCtx.measureText(s).width / 100;
    }
    let total = 0;
    for (const ch of s) {
      const cp = ch.codePointAt(0);
      if (cp >= 0x2e80) total += 1.0;
      else if (ch === ' ') total += 0.3;
      else if ('.,:;!|\'"`'.indexOf(ch) !== -1) total += 0.34;
      else if ('iljtfrI()[]{}'.indexOf(ch) !== -1) total += 0.38;
      else if ('WMmw@%&'.indexOf(ch) !== -1) total += 0.76;
      else total += 0.56;
    }
    return total;
  }

  function mapCellColorToAci(c) {
    if (c === 'blueprint') return 5;
    if (c === 'red') return 1;
    if (c === 'muted') return 8;
    return 7;
  }

  function buildCadDrawingSpec(doc, geometry, options) {
    const g = geometry;
    const toDxfY = (y) => g.sheetHeightMm - y;
    const layers = [
      ['0', 7, 'CONTINUOUS'],
      ['TK_OUTER', 7, 'CONTINUOUS'],
      ['TK_AXIS', 7, 'CONTINUOUS'],
      ['TK_BORDER', 7, 'CONTINUOUS'],
      ['TK_TABLE_OUTER', 7, 'CONTINUOUS'],
      ['TK_TABLE_GRID', 7, 'CONTINUOUS'],
      ['TK_TEXT_LABEL', 8, 'CONTINUOUS'],
      ['TK_TEXT_VALUE', 7, 'CONTINUOUS'],
      ['TK_TEXT_FREE', 7, 'CONTINUOUS'],
      ['TK_IMAGE', 7, 'CONTINUOUS']
    ];
    const entities = [];
    const images = [];   // 图片原图（DXF 纸面坐标）：随应用图框保存，供工作站导出 PDF 时嵌入彩色位图
    const stats = {
      tableCount: 0, polylineCount: 0, lineCount: 0, textCount: 0,
      mtextCount: 0, layerCount: layers.length, fileSizeKb: 0
    };

    const addLine = (x1, y1, x2, y2, layer) => {
      entities.push({ t: 'L', l: layer, p: [r3(x1), r3(toDxfY(y1)), r3(x2), r3(toDxfY(y2))] });
      stats.lineCount++;
    };

    const addHeavyRect = (rx, ry, rw, rh, layer, lineWidthMm) => {
      const lw = r3(Math.max(0.05, lineWidthMm));
      const yTop = r3(toDxfY(ry));
      const yBot = r3(toDxfY(ry + rh));
      const x0 = r3(rx);
      const x1 = r3(rx + rw);
      entities.push({
        t: 'P', l: layer, c: true,
        p: [x0, yTop, x1, yTop, x1, yBot, x0, yBot],
        w: [lw, lw, lw, lw]
      });
      stats.polylineCount++;
    };

    /** 图片栅格 → IM 实体：acadrust 按最近索引色合并成 SOLID 色块，写成一个图块（可整体选中 / 删除） */
    const addImageRaster = (ras, x, y, w, h, imageId = '') => {
      if (!ras || !(w > 0.2) || !(h > 0.2)) return;
      const grid = CadShared.imageToRaster(ras.canvas, ras.w, ras.h, w, h);
      if (!grid) return;
      entities.push({ t: 'IM', l: 'TK_IMAGE', p: [r3(x), r3(toDxfY(y))], w: r3(w), h: r3(h), gw: grid.gw, gh: grid.gh, px: grid.px });
      stats.imageCount = (stats.imageCount || 0) + 1;
      if (options.keepPlaceholders && imageId) {
        images.push({ p: [r3(x), r3(toDxfY(y + h)), r3(x + w), r3(toDxfY(y))], imageId });
      } else {
        if (!ras.png) { try { ras.png = ras.canvas.toDataURL('image/png'); } catch (e) { ras.png = ''; } }
        if (ras.png) images.push({ p: [r3(x), r3(toDxfY(y + h)), r3(x + w), r3(toDxfY(y))], src: ras.png });
      }
    };

    // 编辑器内直接导出 DXF 时，前后缀 / 自由文字里的 {{字段}} 按预览值填入；保存应用图框时保留占位符，由工作站逐页填入
    const resolveText = (str) => (options.keepPlaceholders ? String(str == null ? '' : str) : fillPreview(str));
    const cellValueText = (cell) => (cell.type === 'field'
      ? resolveText(cell.prefix) + String(cell.value == null ? '' : cell.value) + resolveText(cell.suffix)
      : String(cell.value == null ? '' : cell.value));

    // 用到的非黑体字体：导出时登记为 CAD 文字样式（TK_SIMSUN …）与字形参数，由 acadrust 建样式并换算字高
    const usedFonts = new Map();
    const fontStyle = (key) => {
      const f = cadFont(key);
      if (f.key !== 'simhei' && !usedFonts.has(f.style)) usedFonts.set(f.style, [f.style, f.face, f.file, +f.cap.toFixed(5), +f.asc.toFixed(5), +f.desc.toFixed(5)]);
      return f.style;
    };

    /** 多行文字 → MTEXT 文本框。(ax, ay) 为纸面坐标（Y 向下）的附着点，al 为 1~9 附着点代码 */
    /** 屏幕口径：fontH 为字号 (em)，(ax, ay) 为首行行框顶边，lh 为屏幕行高；CAD 字高 / 行距 / 首行位置由 acadrust 换算 */
    const addMText = (rawText, ax, ay, fontH, al, layer, aci, widthMm, lh, extra) => {
      const text = String(rawText == null ? '' : rawText).replace(/\r\n?/g, '\n').replace(/^\n+|\n+$/g, '');
      if (!text.trim()) return;
      const ent = {
        t: 'MT', l: layer, p: [r3(ax), r3(toDxfY(ay))], h: r3(Math.max(1, fontH)), s: text,
        al: al || 1, w: r3(Math.max(0, widthMm || 0)), em: true, lh: r3(lh || 1.3), st: 'STANDARD'
      };
      if (aci !== undefined && aci !== null) ent.col = aci;
      if (extra) Object.assign(ent, extra);
      entities.push(ent);
      stats.mtextCount++;
      stats.textCount++;
    };

    // 单行文字基线（屏幕口径）：行高 lh 的行框中，基线在顶边下 ((lh-1)/2 + 上升) × 字号、底边上 ((lh-1)/2 + 下降) × 字号
    const computeBaseline = (rawText, ax, ay, fontH, hAlign, vAlign, lh, fontKey) => {
      const F = cadFont(fontKey);
      const clean = cleanCadText(rawText);
      if (!clean) return null;
      const h = Math.max(1.2, fontH);
      const textW = measureCadTextEm(clean) * h;
      let tx = ax;
      if (hAlign === 'center') tx = ax - textW * 0.5;
      else if (hAlign === 'right') tx = ax - textW;
      const cadAy = toDxfY(ay);
      let ty = cadAy;
      const half = ((lh || F.cellLh) - (F.asc + F.desc)) / 2;
      if (vAlign === 'top') ty = cadAy - h * (half + F.asc);
      else if (vAlign === 'middle') ty = cadAy - h * (F.asc - (F.asc + F.desc) / 2);
      else ty = cadAy + h * (half + F.desc);
      // 含 {{字段}} 占位符的文字：记录对齐锚点，导出时填入真实值后按真实字宽重新定位
      const meta = clean.indexOf('{{') !== -1 ? { ax: r3(ax), ha: hAlign || 'left' } : null;
      return { clean, tx, ty, h, meta };
    };

    const addText = (rawText, ax, ay, fontH, hAlign, vAlign, layer, color) => {
      const pt = computeBaseline(rawText, ax, ay, fontH, hAlign, vAlign);
      if (!pt) return;
      const ent = { t: 'T', l: layer, p: [r3(pt.tx), r3(pt.ty)], h: r3(pt.h), em: true, s: pt.clean, st: 'STANDARD' };
      if (color !== undefined && color !== null) ent.col = color;
      if (pt.meta) ent.m = pt.meta;
      entities.push(ent);
      stats.textCount++;
    };

    // 1. 图框外框、分区标尺与内框 (acadrust 实体)
    if (doc.sheet.showOuterBorder !== false) {
      addHeavyRect(0, 0, g.sheetWidthMm, g.sheetHeightMm, 'TK_OUTER', Math.max(0.1, doc.sheet.outerBorderWidthMm));
    }

    if (options.includeAxisTicks) {
      const ax = computeAxisZoneMetrics(g, doc);
      const ix = g.innerRect.xMm;
      const iy = g.innerRect.yMm;
      const iw = g.innerRect.widthMm;
      const ih = g.innerRect.heightMm;
      const segW = iw / ax.cols;
      const segH = ih / ax.rows;
      const band = ax.band;
      if (ax.showOuterFrame) {
        const ox = ax.outerRect.xMm;
        const oy = ax.outerRect.yMm;
        const ow = ax.outerRect.widthMm;
        const oh = ax.outerRect.heightMm;
        addLine(ox, oy, ox + ow, oy, 'TK_AXIS');
        addLine(ox + ow, oy, ox + ow, oy + oh, 'TK_AXIS');
        addLine(ox + ow, oy + oh, ox, oy + oh, 'TK_AXIS');
        addLine(ox, oy + oh, ox, oy, 'TK_AXIS');
      }
      const cStart = ax.showOuterFrame ? 0 : 1;
      const cEnd = ax.showOuterFrame ? ax.cols : ax.cols - 1;
      for (let c = cStart; c <= cEnd; c++) {
        const xLine = ix + segW * c;
        if (ax.showTop) addLine(xLine, iy - band, xLine, iy, 'TK_AXIS');
        if (ax.showBottom) addLine(xLine, iy + ih, xLine, iy + ih + band, 'TK_AXIS');
      }
      for (let c = 0; c < ax.cols; c++) {
        const midX = ix + segW * (c + 0.5);
        if (ax.showTop) addText(String(c + 1), midX, iy - band / 2, ax.fontSize, 'center', 'middle', 'TK_AXIS', 7);
        if (ax.showBottom) addText(String(c + 1), midX, iy + ih + band / 2, ax.fontSize, 'center', 'middle', 'TK_AXIS', 7);
      }
      const rStart = ax.showOuterFrame ? 0 : 1;
      const rEnd = ax.showOuterFrame ? ax.rows : ax.rows - 1;
      for (let r = rStart; r <= rEnd; r++) {
        const yLine = iy + segH * r;
        if (ax.showLeft) addLine(ix - band, yLine, ix, yLine, 'TK_AXIS');
        if (ax.showRight) addLine(ix + iw, yLine, ix + iw + band, yLine, 'TK_AXIS');
      }
      ax.letters.forEach((letter, r) => {
        const midY = iy + segH * (r + 0.5);
        if (ax.showLeft) addText(letter, ix - band / 2, midY, ax.fontSize, 'center', 'middle', 'TK_AXIS', 7);
        if (ax.showRight) addText(letter, ix + iw + band / 2, midY, ax.fontSize, 'center', 'middle', 'TK_AXIS', 7);
      });
    }

    addHeavyRect(g.innerRect.xMm, g.innerRect.yMm, g.innerRect.widthMm, g.innerRect.heightMm, 'TK_BORDER', Math.max(0.3, doc.sheet.innerBorderWidthMm));

    // 2. 参数表外框（毫米级带宽多段线）
    const br = g.blockRect;
    addHeavyRect(br.xMm, br.yMm, br.widthMm, br.heightMm, 'TK_TABLE_OUTER', Math.max(0.25, doc.block.outerLineWidthMm));

    // 3. 参数表：按相邻行同列宽分组输出原生 CAD 表格 (ACAD_TABLE)，与 index.html 同一模式
    const sameColumns = (rowA, rowB) => {
      if (rowA.cells.length !== rowB.cells.length) return false;
      for (let i = 0; i < rowA.cells.length; i++) {
        if (Math.abs(rowA.cells[i].widthMm - rowB.cells[i].widthMm) > 0.05) return false;
      }
      return true;
    };

    const rowGroups = [];
    g.rows.forEach((row) => {
      const lastGroup = rowGroups[rowGroups.length - 1];
      if (lastGroup && sameColumns(lastGroup[lastGroup.length - 1], row)) {
        lastGroup.push(row);
      } else {
        rowGroups.push([row]);
      }
    });

    rowGroups.forEach((group) => {
      const bandX = br.xMm;
      const bandTopSvgY = group[0].yMm;
      const bandTopCadY = toDxfY(bandTopSvgY);
      const cw = group[0].cells.map((c) => r3(c.widthMm));
      const rh = group.map((row) => r3(row.heightMm));

      // 单元格内容 = 格内以表格颜色 (ACI 7) 显示的文字行；网格线、内边距、字高缩放与文字排版由 acadrust 生成
      const cellLines = rh.map(() => cw.map(() => []));
      let curRow = 0, curCol = 0;
      const cellMetas = [];
      const postOverlayEntities = [];
      let thSum = 0;
      let thCount = 0;
      let padXSum = 0;
      let padYSum = 0;

      // 格子内容（含单行、彩色文字）一律写进表格单元格，颜色 / 字体随单元格；只有角标式字段名作为单行文字叠在表格上
      const emitCellText = (rawText, ax, ay, fontH, hAlign, vAlign, layer, aci) => {
        const fk = curCell ? curCell.fontKey : 'simhei';
        const pt = computeBaseline(rawText, ax, ay, fontH, hAlign, vAlign, fontLh(fk), fk);
        if (!pt) return;
        if (layer !== 'TK_TEXT_LABEL') {
          cellLines[curRow][curCol].push({ s: pt.clean, h: pt.h });
          cellColors[curRow][curCol] = aci;
        } else {
          const ent = { t: 'T', l: layer, p: [r3(pt.tx), r3(pt.ty)], h: r3(pt.h), em: true, s: pt.clean, col: aci, st: 'STANDARD' };
          if (fk !== 'simhei') ent.ff = fontStyle(fk);
          if (pt.meta) ent.m = pt.meta;
          postOverlayEntities.push(ent);
        }
        stats.textCount++;
      };

      // 多行内容（含竖排）整体写进表格单元格（单元格本身就是多行 MTEXT），在 CAD 中双击单元格即可编辑全部文字；
      // 文字颜色随单元格 (cc)。单行内容同样放进单元格。
      const cellColors = rh.map(() => cw.map(() => null));
      const cellRgb = rh.map(() => cw.map(() => -1));
      const cellFonts = rh.map(() => cw.map(() => ''));
      const cellLabels = rh.map(() => cw.map(() => null));
      const cellFieldLabels = rh.map(() => cw.map(() => ''));
      // 逐格文字框（格边到文字行框的 [上, 左, 下, 右]，与画布排版一致），由 acadrust 写成单元格内边距
      const cellBoxes = rh.map(() => cw.map(() => null));
      let curCell = null;
      const setBox = (top, bottom) => {
        if (!curCell) return;
        const c = curCell;
        cellBoxes[curRow][curCol] = [r3(top - c.y), r3(c.lx - c.x), r3(c.y + c.h - bottom), r3(c.x + c.w - c.rx)];
      };
      const pushCellBlock = (text, h, aci) => {
        cellLines[curRow][curCol].push({ s: text, h: h });
        cellColors[curRow][curCol] = aci;
        stats.textCount++;
      };
      // 自定义行间距（≠ 1 倍）时，ACAD_TABLE 单元格在 CAD 中仅支持单倍行距，因此改用 MTEXT 精确行距输出
      const pushCellMText = (rawText, ax, ay, fontH, hAlign, vAlign, layer, aci, widthMm, lh) => {
        const text = String(rawText == null ? '' : rawText).replace(/\r\n?/g, '\n').replace(/^\n+|\n+$/g, '');
        if (!text.trim()) return;
        const ent = {
          t: 'MT', l: layer, p: [r3(ax), r3(toDxfY(ay))], h: r3(Math.max(1, fontH)), s: text,
          al: tableCellAlignCode(hAlign, vAlign), w: r3(Math.max(0, widthMm || 0)), em: true, lh: r3(lh), st: 'STANDARD'
        };
        if (aci !== undefined && aci !== null) ent.col = aci;
        if (curCell && curCell.fontKey !== 'simhei') ent.ff = fontStyle(curCell.fontKey);
        if (layer !== 'TK_TEXT_LABEL' && curCell && curCell.rgb != null) ent.rgb = curCell.rgb;
        if (layer !== 'TK_TEXT_LABEL' && curCell && curCell.label) ent.fl = curCell.label;
        postOverlayEntities.push(ent);
        stats.mtextCount++;
        stats.textCount++;
      };
      const renderMultiline = (raw, ax, baseTopY, availBoxH, fontH, hAlign, vAlign, layer, aci, vertical, lineSpacing = 1) => {
        const h = Math.max(1.2, fontH);
        const ay = vAlign === 'top' ? baseTopY : vAlign === 'middle' ? baseTopY + availBoxH / 2 : baseTopY + availBoxH;
        const fk = curCell ? curCell.fontKey : 'simhei';
        const baseLh = fontLh(fk);
        const customLs = Math.abs(lineSpacing - 1) > 1e-3;
        setBox(baseTopY, baseTopY + availBoxH);
        if (vertical) {
          const chars = Array.from(String(raw == null ? '' : raw).replace(/[\r\n]+/g, '')).filter((ch) => ch.trim());
          if (!chars.length) return;
          if (chars.length === 1) { emitCellText(chars[0], ax, ay, h, hAlign, vAlign, layer, aci); return; }
          if (customLs) { pushCellMText(chars.join('\n'), ax, ay, h, hAlign, vAlign, layer, aci, 0, baseLh * lineSpacing); return; }
          pushCellBlock(chars.join('\n'), h, aci);
          return;
        }
        const all = String(raw == null ? '' : raw).replace(/\r\n?/g, '\n').split('\n').map((l) => l.trim());
        while (all.length && !all[0]) all.shift();
        while (all.length && !all[all.length - 1]) all.pop();
        if (!all.length) return;
        if (customLs) {
          const refW = curCell ? Math.max(2, curCell.rx - curCell.lx) : 0;
          pushCellMText(all.join('\n'), ax, ay, h, hAlign, vAlign, layer, aci, refW, baseLh * lineSpacing);
          return;
        }
        if (all.length === 1) {
          emitCellText(all[0], ax, ay, h, hAlign, vAlign, layer, aci);
          return;
        }
        pushCellBlock(all.join('\n'), h, aci);
      };

      group.forEach((row, ri) => {
        row.cells.forEach((cg, ci) => {
          curRow = ri; curCol = ci;
          const cell = cg.cell;
          const padX = cell.paddingXMm;
          const padY = cell.paddingYMm;
          const innerX = cg.xMm + padX + cell.offsetXMm;
          const innerY = cg.yMm + padY + cell.offsetYMm;
          const innerW = Math.max(2, cg.widthMm - padX * 2);
          const innerH = Math.max(2, cg.heightMm - padY * 2);
          const anchorX = (h) => (h === 'center' ? innerX + innerW / 2 : h === 'right' ? innerX + innerW : innerX);
          const rgb = colorRgb(cell.textColor);
          const lbl = cleanCadText(cell.label);
          curCell = { x: cg.xMm, y: cg.yMm, w: cg.widthMm, h: cg.heightMm, lx: innerX, rx: innerX + innerW, fontKey: cadFont(cell.fontKey).key, rgb, label: lbl };
          if (curCell.fontKey !== 'simhei') cellFonts[ri][ci] = fontStyle(curCell.fontKey);
          if (rgb != null) cellRgb[ri][ci] = rgb;
          const CELL_LH = fontLh(curCell.fontKey);
          const cellLs = clamp(num(cell.lineSpacing, 1), 0.6, 3);
          const anchorY = (v) => (v === 'middle' ? innerY + innerH / 2 : v === 'bottom' ? innerY + innerH : innerY);
          const aci = mapCellColorToAci(cell.textColor);

          const valueText = cellValueText(cell);
          const val = cleanCadText(valueText);
          if (cell.type !== 'image' && cell.valueFontSizeMm) {
            thSum += Math.max(1.2, cell.valueFontSizeMm);
            thCount++;
          }
          padXSum += clamp(padX, 0.4, 4.0);
          padYSum += clamp(padY, 0.4, 4.0);
          cellMetas.push({
            th: cell.valueFontSizeMm ? r3(Math.max(1.2, cell.valueFontSizeMm)) : null,
            aci: aci,
            alignCode: tableCellAlignCode(cell.hAlign, cell.vAlign)
          });

          if (cell.type === 'image') {
            // 与画布排版一致：图片按“图片缩放”等比放入格内（有说明文字时图片最高占 70%），说明文字紧随图片下方
            const capH = cell.imgShowCaption && val ? Math.max(1.2, cell.valueFontSizeMm || 2.5) : 0;
            const ras = cell.imgSrc ? imageRasterCache.get(cell.imgSrc) : null;
            const sc = clamp(cell.imgScale == null ? 0.9 : cell.imgScale, 0.1, 1.6);
            let imgW = 0, imgH = 0;
            if (ras) {
              const maxW = Math.min(innerW, innerW * sc);
              const maxH = Math.min(innerH, innerH * (capH ? 0.70 : 0.94) * sc);
              const ratio = ras.w / ras.h;
              imgW = Math.min(maxW, maxH * ratio);
              imgH = imgW / ratio;
            }
            const groupH = imgH + (capH ? (imgH ? 0.6 : 0) + capH * 1.15 : 0);
            const top = cell.vAlign === 'top' ? innerY : cell.vAlign === 'bottom' ? innerY + innerH - groupH : innerY + (innerH - groupH) / 2;
            if (ras && imgW > 0) {
              const ix = cell.hAlign === 'left' ? innerX : cell.hAlign === 'right' ? innerX + innerW - imgW : innerX + (innerW - imgW) / 2;
              addImageRaster(ras, ix, top, imgW, imgH, cell.imgId || '');
            }
            if (capH) {
              setBox(top + imgH + (imgH ? 0.6 : 0), cg.yMm + cg.heightMm - padY + cell.offsetYMm);
              emitCellText(cell.value, anchorX(cell.hAlign), top + imgH + (imgH ? 0.6 : 0), capH, cell.hAlign, 'top', 'TK_TEXT_VALUE', aci);
            }
            return;
          }
          const vertical = cell.textDirection === 'vertical';
          if (cell.type === 'text') {
            if (lbl) cellFieldLabels[ri][ci] = lbl;
            renderMultiline(valueText, anchorX(cell.hAlign), innerY, innerH, cell.valueFontSizeMm, cell.hAlign, cell.vAlign, 'TK_TEXT_VALUE', aci, vertical, cellLs);
            return;
          }
          if (cell.fieldLayout === 'inline') {
            const combined = lbl ? cell.label + '：' + valueText : valueText;
            renderMultiline(combined, anchorX(cell.hAlign), innerY, innerH, cell.valueFontSizeMm, cell.hAlign, cell.vAlign, 'TK_TEXT_VALUE', aci, vertical, cellLs);
          } else if (cell.fieldLayout === 'stacked') {
            // 字段名作为单元格 MTEXT 的首行（灰色、较小字高）与内容一起写进单元格：
            // CAD 中双击编辑单元格后重新生成表格，字段名与内容仍是一个整体，不会因单元格内边距被重置而错位
            const gap = stackedGapMm(cell);
            const labelBox = lbl ? cell.labelFontSizeMm * CELL_LH + gap : 0;
            const valueLines = val ? Math.max(1, String(valueText).split('\n').length) : 0;
            const totalPair = labelBox + cell.valueFontSizeMm * (CELL_LH * cellLs) * valueLines - (lbl && !valueLines ? gap : 0);
            let startTop = innerY;
            if (cell.vAlign === 'middle') startTop = innerY + (innerH - totalPair) / 2;
            if (cell.vAlign === 'bottom') startTop = innerY + innerH - totalPair;
            if (Math.abs(cellLs - 1) > 1e-3) {
              if (lbl) pushCellMText(lbl, anchorX(cell.hAlign), startTop, Math.max(1, cell.labelFontSizeMm), cell.hAlign, 'top', 'TK_TEXT_LABEL', 8, 0, CELL_LH);
              if (valueLines) renderMultiline(valueText, anchorX(cell.hAlign), startTop + labelBox, Math.max(cell.valueFontSizeMm, innerY + innerH - (startTop + labelBox)), cell.valueFontSizeMm, cell.hAlign, 'top', 'TK_TEXT_VALUE', aci, vertical, cellLs);
            } else {
              if (valueLines) renderMultiline(valueText, anchorX(cell.hAlign), startTop + labelBox, Math.max(cell.valueFontSizeMm, innerY + innerH - (startTop + labelBox)), cell.valueFontSizeMm, cell.hAlign, 'top', 'TK_TEXT_VALUE', aci, vertical, 1);
              if (lbl) {
                cellLabels[ri][ci] = { s: lbl, h: r3(Math.max(1, cell.labelFontSizeMm)), col: 8 };
                if (cellColors[ri][ci] == null) cellColors[ri][ci] = aci;
                stats.textCount++;
              }
              setBox(startTop, startTop + totalPair);
            }
          } else {
            if (lbl) emitCellText(cell.label, cg.xMm + padX, cg.yMm + padY, cell.labelFontSizeMm, 'left', 'top', 'TK_TEXT_LABEL', 8);
            const reserve = lbl && cell.vAlign === 'top' ? cell.labelFontSizeMm * 1.2 : 0;
            const valTop = cell.vAlign === 'top' ? innerY + reserve : innerY;
            const valH = cell.vAlign === 'top' ? Math.max(2, innerH - reserve) : innerH;
            renderMultiline(valueText, anchorX(cell.hAlign), valTop, valH, cell.valueFontSizeMm, cell.hAlign, cell.vAlign, 'TK_TEXT_VALUE', aci, vertical, cellLs);
          }
        });
      });

      const tableTh = r3(thCount > 0 ? thSum / thCount : 3.0);
      const cellTotal = cellMetas.length || 1;
      const avgPadX = r3(clamp(padXSum / cellTotal, 0.5, 3.0));
      const avgPadY = r3(clamp(padYSum / cellTotal, 0.5, 3.0));
      let mi = 0;
      const al = [], ch = [];
      const cc = cellColors.map((row) => row.map((c) => (c == null ? 7 : c)));
      const hasCc = cc.some((row) => row.some((c) => c !== 7));
      const tableCells = cellLines.map((rowLines) => {
        const alRow = [], chRow = [];
        al.push(alRow); ch.push(chRow);
        return rowLines.map((lines) => {
          const cm = cellMetas[mi++] || {};
          alRow.push(cm.alignCode || 5);
          chRow.push(r3(lines.length ? Math.max.apply(null, lines.map((l) => l.h)) : (cm.th || tableTh)));
          return lines.map((l) => l.s).join('\n');
        });
      });
      entities.push({
        t: 'TB',
        l: 'TK_TABLE_GRID',
        col: 7,
        p: [r3(bandX), r3(bandTopCadY)],
        cw: cw,
        rh: rh,
        cells: tableCells,
        th: tableTh,
        pad: [avgPadX, avgPadY],
        al: al,
        ch: ch,
        em: true,
        bx: cellBoxes.map((row) => row.map((b) => b || [avgPadY, avgPadX, avgPadY, avgPadX])),
        ...(hasCc ? { cc: cc } : {}),
        ...(cellFonts.some((r) => r.some((v) => v)) ? { cf: cellFonts } : {}),
        ...(cellRgb.some((r) => r.some((v) => v >= 0)) ? { crgb: cellRgb } : {}),
        ...(cellLabels.some((r) => r.some((v) => v)) ? { lb: cellLabels } : {}),
        ...(cellFieldLabels.some((r) => r.some((v) => v)) ? { fl: cellFieldLabels } : {})
      });
      stats.tableCount++;
      stats.lineCount += rh.length + cw.length + 2;
      postOverlayEntities.forEach((ent) => entities.push(ent));
    });

    // 4. 自由文字（画布工具栏「添加文字」）：每个文本框写成一个 MTEXT，位置与画布一致
    (doc.freeTexts || []).forEach((ft) => {
      const text = resolveText(ft.text);
      if (!text.trim()) return;
      const h = Math.max(1, ft.fontSizeMm);
      const lines = text.split(/\r?\n/);
      const tr = clamp(num(ft.tracking, 1), 0.75, 4);
      // 自动宽度：字宽 + 字间距（网页 letter-spacing = (跟踪 − 1) em / 字）
      const boxW = ft.widthMm > 0 ? ft.widthMm : Math.max.apply(null, lines.map((l) => (measureCadTextEm(l) + (tr - 1) * Array.from(l).length) * h));
      const ax = ft.hAlign === 'center' ? ft.xMm + boxW / 2 : ft.hAlign === 'right' ? ft.xMm + boxW : ft.xMm;
      const al = ft.hAlign === 'center' ? 2 : ft.hAlign === 'right' ? 3 : 1;
      // 画布 .free-text 行高 1.3，文本框顶边即首行行框顶边
      const extra = {};
      if (cadFont(ft.fontKey).key !== 'simhei') extra.ff = fontStyle(ft.fontKey);
      const rgb = colorRgb(ft.textColor);
      if (rgb != null) extra.rgb = rgb;
      if (Math.abs(tr - 1) > 1e-3) extra.tr = r3(tr);
      addMText(text, ax, ft.yMm, h, al, 'TK_TEXT_FREE', mapCellColorToAci(ft.textColor), ft.widthMm > 0 ? ft.widthMm : 0, 1.3, extra);
    });

    return {
      spec: {
        insunits: 4,
        layers: layers,
        styles: [['STANDARD', 'SimHei', 'simhei.ttf']],
        fonts: [...usedFonts.values()],
        entities: entities
      },
      stats: stats,
      images: images
    };
  }

  function tableCellAlignCode(hAlign, vAlign) {
    const rowBase = vAlign === 'top' ? 1 : vAlign === 'bottom' ? 7 : 4;
    const colOffset = hAlign === 'left' ? 0 : hAlign === 'right' ? 2 : 1;
    return rowBase + colOffset;
  }

  async function generateDxfDocument(doc, geometry, options) {
    const opts = options || {};
    await primeImageRasters(doc);
    const built = buildCadDrawingSpec(doc, geometry, opts);
    const acad = await loadAcadrust();
    const versionCode = Number(opts.dxfVersion) || CAD_VERSION.dxf;
    // 表格样式、单元格内边距与文字排版均由 acadrust 直接写出，无需再修补 DXF
    const dxfBytes = acad.buildDrawing(JSON.stringify(built.spec), false, versionCode);
    const dxfContent = new TextDecoder().decode(dxfBytes);
    built.stats.fileSizeKb = Math.round((dxfBytes.byteLength / 1024) * 10) / 10;
    return { dxfBytes: dxfBytes, dxfContent: dxfContent, stats: built.stats };
  }

  /* =============================== 导出流程 =============================== */
  function dxfFilename() {
    const modeTag = state.doc.block.layoutMode === 'edge' ? '侧栏竖排' : '贴角标准';
    return '家装技术图框_' + state.doc.sheet.preset + '_' + modeTag + '_' + state.geometry.sheetWidthMm + 'x' + state.geometry.sheetHeightMm + '.dxf';
  }

  async function triggerDownload(content, filename, mime) {
    return await DesktopHost.saveBlob(content, filename, { mime: mime || 'application/octet-stream' });
  }

  function openExportModal() {
    state.ui.exportOpen = true;
    state.ui.exportResult = null;
    state.ui.exportBusy = true;
    state.ui.exportError = null;
    state.ui.exportOpts.includeAxisTicks = state.doc.sheet.showAxisTicks !== false;
    renderModals();
    runExportPreview();
  }

  function runExportPreview() {
    if (!state.ui.exportOpen) return;
    state.ui.exportBusy = true;
    state.ui.exportError = null;
    refreshExportModalDynamic();
    generateDxfDocument(state.doc, computeLayoutGeometry(state.doc), state.ui.exportOpts).then((res) => {
      if (!state.ui.exportOpen) return;
      state.ui.exportResult = res;
      state.ui.exportBusy = false;
      refreshExportModalDynamic();
    }).catch((err) => {
      state.ui.exportBusy = false;
      state.ui.exportError = String(err && err.message ? err.message : err);
      refreshExportModalDynamic();
    });
  }

  async function downloadDxf() {
    if (!state.ui.exportResult) { notify('DXF 仍在生成图元，请稍候', 'error'); return; }
    const payload = state.ui.exportResult.dxfBytes || state.ui.exportResult.dxfContent;
    const res = await triggerDownload(payload, dxfFilename(), 'application/dxf');
    if (res && res.saved && !res.cancelled) notify('已下载 ' + (res.name || dxfFilename()), 'success');
  }

  /**
   * 保存应用图框：把当前图框转换为 CAD 图元描述（纸面毫米、Y 轴向上），
   * 关联工程数据的格子写成 {{字段}} 占位符，供 EasyTile 导出时逐页填入。
   */
  function buildAppliedFramePackage(doc) {
    const work = clone(doc);
    work.block.rows.forEach((r) => r.cells.forEach((c) => {
      if (isDataFieldId(c.fieldId)) c.value = '{{' + dataFieldKey(c.fieldId) + '}}';
    }));
    const g = computeLayoutGeometry(work);
    const built = buildCadDrawingSpec(work, g, { includeAxisTicks: work.sheet.showAxisTicks !== false, keepPlaceholders: true });
    const dims = SHEET_DIMENSIONS[work.sheet.preset];
    return {
      version: 1,
      // 2：图纸编号 / 图纸名称由工作站给原始值，前后缀写在格子里；含 MT (MTEXT) 图元
      fieldVersion: 2,
      name: doc.name || '自定义图框',
      savedAt: new Date().toISOString(),
      sheetLabel: dims ? dims.label + ' ' + (dims.sub === '竖' ? '竖向' : '横向') : (g.sheetWidthMm + '×' + g.sheetHeightMm),
      sheetWidthMm: g.sheetWidthMm,
      sheetHeightMm: g.sheetHeightMm,
      innerRect: g.innerRect,
      blockRect: g.blockRect,
      layoutMode: work.block.layoutMode,
      cornerPosition: work.block.cornerPosition,
      edgePosition: work.block.edgePosition,
      layers: built.spec.layers,
      fonts: built.spec.fonts || [],
      entities: built.spec.entities,
      images: built.images
    };
  }

  async function saveAppliedFrame() {
    try {
      commitEditing(false);
      // 兜底：若撤销恢复了已清理的图片格，将其重新写入 IndexedDB images 表
      for (const r of (state.doc.block.rows || [])) {
        for (const c of (r.cells || [])) {
          if (c.type !== 'image' || !c.imgSrc) continue;
          const exists = c.imgId ? await StorageDB.getImage(c.imgId) : null;
          if (!exists) {
            const saved = await StorageDB.saveImage(c.imgSrc, FRAME_IMG_LIMITS);
            c.imgId = saved.id;
            c.imgSrc = saved.dataUrl;
          }
        }
      }
      await primeImageRasters(state.doc);
      const pkg = buildAppliedFramePackage(state.doc);
      await StorageDB.setJSON(APPLIED_FRAME_KEY, pkg);
      // 立即写入编辑稿并清理未被当前编辑稿或应用图框引用的旧图，避免僵尸图片残留
      clearTimeout(state.saveTimer);
      await StorageDB.setJSON(STORAGE_KEY, serializeDocForStorage(state.doc));
      await pruneFrameCellImages(true);
      notify('已保存，导出 DXF / DWG / PDF 将使用此图框（' + pkg.sheetLabel + '）', 'success');
      await DesktopHost.postToOpener({ type: 'tilecalc-frame-applied', name: pkg.name, sheetLabel: pkg.sheetLabel });
    } catch (err) {
      notify('保存失败：' + (err && err.message ? err.message : err), 'error');
    }
  }
  window.TilecalcFrameEditor = {
    buildAppliedFramePackage: async () => { await primeImageRasters(state.doc); return buildAppliedFramePackage(state.doc); },
    save: saveAppliedFrame,
    getDoc: () => state.doc
  };

  async function quickDownloadDxf() {
    try {
      notify('正在通过 acadrust WASM 生成 DXF…');
      const res = await generateDxfDocument(state.doc, computeLayoutGeometry(state.doc), {
        dxfVersion: state.ui.exportOpts.dxfVersion || CAD_VERSION.dxf,
        includeAxisTicks: state.doc.sheet.showAxisTicks
      });
      const res2 = await triggerDownload(res.dxfBytes || res.dxfContent, dxfFilename(), 'application/dxf');
      if (res2 && res2.saved && !res2.cancelled) notify('已按推荐参数导出 DXF', 'success');
    } catch (err) {
      notify('DXF 生成失败：' + (err && err.message ? err.message : err), 'error');
    }
  }

  function copyDxfSource() {
    if (!state.ui.exportResult) return;
    const text = state.ui.exportResult.dxfContent;
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, text.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        notify(ok ? '完整 DXF 源码已复制' : '复制被浏览器拦截，请直接下载文件', ok ? 'success' : 'error');
      } catch (err) {
        notify('复制被浏览器拦截，请直接下载文件', 'error');
      }
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => notify('完整 DXF 源码已复制', 'success')).catch(fallback);
    } else {
      fallback();
    }
  }

  /* =============================== 弹窗渲染 =============================== */
  function renderModals() {
    const prevBody = document.querySelector('.modal-panel .modal-body');
    const prevScroll = prevBody ? prevBody.scrollTop : 0;
    let html = '';
    if (state.ui.templateOpen) html += templateModalHtml();
    if (state.ui.exportOpen) html += exportModalHtml();
    els.modalRoot.innerHTML = html;
    const nextBody = document.querySelector('.modal-panel .modal-body');
    if (nextBody && prevScroll) nextBody.scrollTop = prevScroll;
  }

  function templateModalHtml() {
    return '<div class="modal-backdrop" data-close="templates"><div class="modal-panel wide" role="dialog" aria-modal="true" aria-label="选择技术图框模板">' +
      '<div class="modal-head"><div><h2>选择技术图框模板</h2>' +
      '<p>模板会替换当前图纸参数；应用后仍可通过撤销恢复，所有字段都能继续自由编辑。</p></div>' +
      '<button type="button" class="icon-button" data-act="closeTemplates" aria-label="关闭">' + ic('x') + '</button></div>' +
      '<div class="template-grid">' + TEMPLATES.map((t) =>
        '<button type="button" class="template-card' + (state.doc.templateId === t.id ? ' active' : '') + '" data-act="applyTemplate" data-value="' + t.id + '">' +
        '<div class="template-preview ' + t.preview + '"><div class="preview-paper"><i class="preview-border"></i>' +
        '<div class="preview-block">' + Array.from({ length: t.preview === 'side' ? 8 : 5 }).map(() => '<i></i>').join('') + '</div><b></b></div></div>' +
        '<div class="template-card-body"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><strong>' + esc(t.name) + '</strong>' +
        (state.doc.templateId === t.id ? ic('check', '', 'width:15px;height:15px;color:var(--primary)') : '') + '</div>' +
        '<span>' + esc(t.subtitle) + '</span><p>' + esc(t.description) + '</p></div></button>').join('') + '</div>' +
      '<div class="modal-foot" style="justify-content:flex-end">' +
      '<div class="actions"><button type="button" class="button-secondary" data-act="closeTemplates">取消</button></div></div></div></div>';
  }

  function exportModalHtml() {
    const o = state.ui.exportOpts;
    const g = state.geometry;
    const verLabel = Number(o.dxfVersion) === 1032 ? 'AutoCAD 2018 (AC1032)' : 'AutoCAD 2007 (AC1021)';
    return '<div class="modal-backdrop" data-close="export"><div class="modal-panel" style="max-width:660px" role="dialog" aria-modal="true" aria-label="导出 AutoCAD DXF">' +
      '<div class="modal-head"><div><h2>导出 AutoCAD DXF</h2>' +
      '<p>基于 acadrust WASM 实时生成，参数表使用原生 ACAD_TABLE 表格，图纸可在 CAD 中继续编辑。</p></div>' +
      '<button type="button" class="icon-button" data-act="closeExport" aria-label="关闭">' + ic('x') + '</button></div>' +
      '<div class="modal-body" style="max-height:62vh;overflow-y:auto">' +
      '<div class="export-summary"><div class="export-file-icon">' + ic('file-code', '', 'width:24px;height:24px') + '</div>' +
      '<div style="min-width:0;flex:1"><strong>' + esc(dxfFilename()) + '</strong>' +
      '<span>' + g.sheetWidthMm + ' × ' + g.sheetHeightMm + ' mm · 1:1 毫米 · acadrust WASM · ' + verLabel + '</span></div>' +
      '<span class="format-badge">DXF</span></div>' +
      '<div id="exportDynamic" style="margin-top:16px">' + exportDynamicHtml() + '</div>' +
      '<div style="margin-top:16px" class="stack">' +
      '<div class="stack">' +
      '<div class="helper-copy" style="font-weight:600;color:var(--text-secondary)">DXF 版本（acadrust WASM 生成）</div>' +
      '<label class="radio-card"><input type="radio" name="dxf-ver" data-act="exportVersion" data-value="1021"' + (Number(o.dxfVersion) !== 1032 ? ' checked' : '') + ' />' +
      '<div><b>AutoCAD 2007 / AC1021（推荐）</b><span>与主站导出一致，原生写入 ACAD_TABLE 参数表与中文 TrueType（SimHei）</span></div></label>' +
      '<label class="radio-card"><input type="radio" name="dxf-ver" data-act="exportVersion" data-value="1032"' + (Number(o.dxfVersion) === 1032 ? ' checked' : '') + ' />' +
      '<div><b>AutoCAD 2018 / AC1032</b><span>新版 DXF 格式容器，适合高版本 AutoCAD 与现代看图器</span></div></label>' +
      '</div>' +
      '<div class="stack" style="margin-top:4px;padding-top:12px;border-top:1px solid var(--border-light)">' +
      '<label class="toggle-row"><span>包含图幅外框分区标尺（TK_AXIS）</span>' +
      '<input type="checkbox" class="toggle-input" data-act="exportToggle" data-key="includeAxisTicks"' + (o.includeAxisTicks ? ' checked' : '') + ' /></label>' +
      '</div>' +
      '<div class="export-note">' + ic('info') + '<p>图纸由 acadrust WASM 引擎构建并自动写入图层、样式与视口；参数表按同列宽行分组为原生 ACAD_TABLE 表格（*T 显示块），图框内外框保留毫米级带宽多段线。</p></div>' +
      '<div class="layer-list"><span>TK_OUTER</span><span>TK_AXIS</span><span>TK_BORDER</span><span>TK_TABLE_OUTER</span><span>TK_TABLE_GRID</span><span>TK_TEXT_LABEL</span><span>TK_TEXT_VALUE</span><span>TK_TEXT_FREE</span><span>TK_IMAGE</span></div>' +
      '</div></div>' +
      '<div class="modal-foot" style="justify-content:flex-end">' +
      '<button type="button" class="button-secondary" data-act="closeExport">继续编辑</button>' +
      '<button type="button" class="button-secondary" data-act="quickDownload">' + ic('download', '', 'width:13px;height:13px') + '推荐参数直接下载</button>' +
      '<button type="button" class="button-primary" id="downloadDxfBtn" data-act="downloadDxf"' + (state.ui.exportBusy || !state.ui.exportResult ? ' disabled' : '') + '>' +
      (state.ui.exportBusy ? ic('loader-circle', 'spin', 'width:14px;height:14px') : ic('download', '', 'width:14px;height:14px')) +
      '<span>' + (state.ui.exportBusy ? '正在生成实体…' : '下载 .DXF 文件') + '</span></button></div></div></div>';
  }

  function exportDynamicHtml() {
    if (state.ui.exportError) {
      return '<div class="export-stat" style="padding:14px;border-color:var(--color-danger-border);background:var(--color-danger-soft);color:var(--color-danger-text);text-align:left">' +
        '<strong style="font-size:12px;color:var(--color-danger-hover)">DXF 生成失败</strong>' +
        '<p style="margin:6px 0 0;font-size:11px;line-height:1.5;color:var(--color-danger-text)">' + esc(state.ui.exportError) + '</p></div>';
    }
    const res = state.ui.exportResult;
    if (state.ui.exportBusy || !res) {
      return '<div class="export-stat" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:18px">' +
        ic('loader-circle', 'spin', 'width:14px;height:14px;color:var(--primary)') + '<span style="color:var(--text-muted);font-size:10px">正在通过 acadrust WASM 生成 CAD 图框与参数表格…</span></div>';
    }
    const s = res.stats;
    return '<div class="g4" style="grid-template-columns:repeat(4,1fr)">' +
      '<div class="export-stat"><strong>' + s.tableCount + '</strong><span>CAD 原生表格</span></div>' +
      '<div class="export-stat"><strong>' + s.polylineCount + '</strong><span>带宽多段线</span></div>' +
      '<div class="export-stat"><strong>' + s.lineCount + '</strong><span>标尺/网格线</span></div>' +
      '<div class="export-stat"><strong>' + s.textCount + '</strong><span>文字图元</span></div>' +
      '</div>' +
      '<div class="g3" style="margin-top:6px">' +
      '<div class="export-stat"><strong>' + (s.mtextCount || 0) + '</strong><span>多行文本框</span></div>' +
      '<div class="export-stat"><strong>' + s.layerCount + '</strong><span>CAD 图层</span></div>' +
      '<div class="export-stat"><strong>' + s.fileSizeKb + '</strong><span>文件大小 KB</span></div>' +
      '</div>' +
      '<div style="margin-top:12px">' +
      '<div class="between" style="margin-bottom:6px"><span class="helper-copy">acadrust WASM 生成 DXF 源码预览（前 60 行）</span>' +
      '<button type="button" class="text-button" data-act="copyDxf">' + ic('copy', '', 'width:12px;height:12px;vertical-align:-2px') + ' 复制完整源码</button></div>' +
      '<pre class="code-preview">' + esc(res.dxfContent.split(/\r?\n/).slice(0, 60).join('\n')) + '\n... (完整内容请点击下载 .dxf 文件)</pre></div>';
  }

  function refreshExportModalDynamic() {
    const box = document.getElementById('exportDynamic');
    if (box) box.innerHTML = exportDynamicHtml();
    const dl = document.getElementById('downloadDxfBtn');
    if (dl) {
      dl.disabled = state.ui.exportBusy || !state.ui.exportResult;
      dl.innerHTML = (state.ui.exportBusy ? ic('loader-circle', 'spin', 'width:14px;height:14px') : ic('download', '', 'width:14px;height:14px')) +
        '<span>' + (state.ui.exportBusy ? '正在生成实体…' : '下载 .DXF 文件') + '</span>';
    }
  }

  document.addEventListener('mousedown', (e) => {
    const backdrop = e.target.closest('.modal-backdrop');
    if (backdrop && e.target === backdrop) {
      if (backdrop.getAttribute('data-close') === 'templates') { state.ui.templateOpen = false; renderModals(); }
      if (backdrop.getAttribute('data-close') === 'export') { state.ui.exportOpen = false; renderModals(); }
    }
  });

  /* =============================== 移动端面板 =============================== */
  function closeMobilePanels() {
    state.ui.mobileRight = false;
    applyMobilePanels();
  }
  function applyMobilePanels() {
    els.rightPanel.classList.toggle('mobile-open', state.ui.mobileRight);
    els.panelScrim.classList.toggle('show', state.ui.mobileRight);
  }

  /* =============================== 初始化 =============================== */
  async function init() {
    await StorageDB.init();
    await loadTemplates();
    state.doc = bindDataFields(loadStoredProject() || TEMPLATES[0].create());
    await hydrateDocImages(state.doc);
    state.geometry = computeLayoutGeometry(state.doc);

    if (window.location.search.indexOf('embed=1') >= 0) {
      document.body.classList.add('is-embed');
    }
    const byId = (id) => document.getElementById(id);
    byId('btnUndo').addEventListener('click', undo);
    byId('btnRedo').addEventListener('click', redo);
    byId('btnReset').addEventListener('click', () => { applyTemplate(state.doc.templateId); notify('已重置为模板初始状态'); });
    byId('btnExport').addEventListener('click', saveAppliedFrame);
    byId('btnRightPanel').addEventListener('click', () => { state.ui.mobileRight = !state.ui.mobileRight; applyMobilePanels(); });
    DesktopHost.bindWindowControls({
      minBtn: byId('btnWinMin'),
      maxBtn: byId('btnWinMax'),
      closeBtn: byId('btnWinClose')
    });
    els.panelScrim.addEventListener('click', closeMobilePanels);

    els.jsonInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) importTemplatesJson(file);
      e.target.value = '';
    });

    els.imageInput.addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      const sel = state.selection;
      const target = pendingImageCell || (sel.kind === 'cell' ? { rowId: sel.rowId, cellId: sel.cellId } : null);
      if (file && target) applyImageFile(file, target);
      pendingImageCell = null;
      e.target.value = '';
    });

    window.addEventListener('resize', () => {
      if (!state.view.focusMode) fitToScreen();
    });
    const refreshLinkedDataFields = async () => {
      if (!state.doc || state.editing || state.textEditing) return;
      await StorageDB.refreshKey(MERCHANT_INFO_KEY);
      await StorageDB.refreshKey(FRAME_CONTEXT_KEY);
      bindDataFields(state.doc);
      render();
    };
    StorageDB.onChange((key) => {
      if (!key || key === MERCHANT_INFO_KEY || key === FRAME_CONTEXT_KEY) refreshLinkedDataFields();
    });
    DesktopHost.onOpenerMessage((msg) => {
      if (msg && msg.type === 'tilecalc-frame-context-updated') refreshLinkedDataFields();
    });
    window.addEventListener('focus', refreshLinkedDataFields);

    render();
    setTimeout(() => { fitToScreen(); }, 60);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

})();
</script>
