<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#F5F7FA" />
<meta name="description" content="面向家装施工图的可视化技术图框编辑器：表格直接编辑、自定义 Logo、字段排版、图幅管理与 DXF 导出。" />
<title>筑构 · 家装技术图框编辑器</title>
<link rel="icon" type="image/x-icon" href="assets/images/app.ico" />

<!-- 本地 Phosphor 图标 · 共享设计令牌与公共组件 · Tailwind 工具类 · 编辑器专用样式 -->
<link rel="stylesheet" href="assets/css/phosphor.css" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/components.css" />
<link rel="stylesheet" href="assets/css/tailwind.css" />
<link rel="stylesheet" href="assets/css/tukuan.css" />
</head>
<body>
<div class="app-shell">
  <!-- ============================ 顶栏（兼 WebView2 无边框子窗体虚拟标题栏） ============================ -->
  <header class="app-header" data-host-drag>
    <div class="header-main">
      <div class="header-title-wrap">
        <span class="header-title">图框设置</span>
        <span class="header-sub">编辑后点击“保存应用图框”，导出 DXF / DWG / PDF 即使用该图框</span>
      </div>
    </div>
    <div class="rowflex header-secondary" data-host-no-drag>
      <button class="icon-button" id="btnUndo" title="撤销 Ctrl+Z"><i class="ic ph ph-arrow-u-up-left" aria-hidden="true"></i></button>
      <button class="icon-button" id="btnRedo" title="重做 Ctrl+Shift+Z"><i class="ic ph ph-arrow-u-up-right" aria-hidden="true"></i></button>
      <button class="icon-button" id="btnReset" title="重置当前模板"><i class="ic ph ph-arrow-counter-clockwise" aria-hidden="true"></i></button>
      <button class="icon-button" data-act="importTemplatesJson" title="导入模板 JSON（frame-templates.json 格式，本次会话有效）"><i class="ic ph ph-upload-simple" aria-hidden="true"></i></button>
      <button class="button-secondary hidden" data-act="exportTemplatesJson" title="把当前图框写入预设模板，导出 frame-templates.json，覆盖 assets/data/ 下同名文件即可作为默认模板"><i class="ic ph ph-file-arrow-down" style="font-size:14px;width:14px;height:14px" aria-hidden="true"></i>导出 JSON</button>
    </div>
    <button class="button-primary" id="btnExport" data-host-no-drag title="保存当前图框，并作为 EasyTile 导出 DXF / DWG / PDF 时的图框"><i class="ic ph ph-floppy-disk" style="font-size:15px;width:15px;height:15px" aria-hidden="true"></i>保存应用图框</button>
    <button class="mobile-panel-button" id="btnRightPanel" data-host-no-drag aria-label="打开属性面板"><i class="ic ph ph-sidebar-simple" style="transform:scaleX(-1)" aria-hidden="true"></i></button>
    <div class="header-win-sep" data-host-no-drag></div>
    <div class="win-controls" id="winControls" data-host-no-drag>
      <button id="btnWinMin" type="button" class="win-btn" data-host-action="minimize" title="最小化" aria-label="最小化">
        <i class="ph ph-minus"></i>
      </button>
      <button id="btnWinMax" type="button" class="win-btn" data-host-action="toggleMaximize" title="最大化" aria-label="最大化">
        <i class="ph ph-square"></i>
      </button>
      <button id="btnWinClose" type="button" class="win-btn win-btn-close" data-host-action="close" title="关闭" aria-label="关闭">
        <i class="ph ph-x"></i>
      </button>
    </div>
  </header>

  <!-- ============================ 主区域 ============================ -->
  <main class="main-row">
    <button class="panel-scrim" id="panelScrim" aria-label="关闭面板"></button>


    <section class="workspace">
      <div class="canvas-toolbar" id="canvasToolbar"></div>
      <div class="canvas-viewport" id="viewport">
        <div id="stage"></div>
        <button type="button" class="exit-preview hidden" id="exitPreview" data-act="toggleClean"><i class="ic ph ph-eye-slash" style="font-size:14px;width:14px;height:14px" aria-hidden="true"></i>退出纯净预览</button>
      </div>
      <footer class="status-bar" id="statusBar"></footer>
    </section>

    <aside class="right-panel" id="rightPanel"></aside>
  </main>
</div>

<input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden />
<input type="file" id="jsonInput" accept="application/json,.json" hidden />
<div id="modalRoot"></div>
<div class="toast-stack" id="toastStack" aria-live="polite"></div>
<div id="dragTooltip" class="drag-tooltip hidden"></div>

<script src="assets/js/storage.js"></script>
<script src="assets/js/desktop-host.js"></script>
<script src="assets/js/cad-shared.js"></script>
<script>
/* =============================================================================
   构框 · 家装技术图框编辑器
   原生单文件实现（HTML + 原生 JS + CSS）。功能模型来自 React 版「筑框」工程，
   界面语言沿用「构框」的设计体系。
   ============================================================================= */
(function () {
  'use strict';

  /* =============================== 基础工具 =============================== */
  const CAD_FONT = CadShared.CAD_FONT;  // 黑体字形参数（与 Rust font 模块一致）
  const CELL_LH = +CAD_FONT.cellLh.toFixed(4);  // 表格单元格文字行高 = CAD 单倍行距（黑体）
  const CAD_FONTS = CadShared.CAD_FONTS;  // 可选中文字体（Windows 预装）及字形参数
  const cadFont = CadShared.cadFont;
  /** 某字体的表格单元格行高 = 该字体的 CAD 单倍行距 (5/3 × 大写字母高) */
  const fontLh = (key) => +cadFont(key).cellLh.toFixed(4);
  const fontCss = (key) => cadFont(key).css;
  const HEX_RE = /^#[0-9a-f]{6}$/i;
  /** 文字颜色：预设名 (ink / blueprint / red / muted) 或 #rrggbb 任意色 */
  const isColorValue = (v) => !!(COLOR_CSS[v] || HEX_RE.test(String(v || '')));
  const colorCss = (v) => COLOR_CSS[v] || (HEX_RE.test(String(v || '')) ? v : COLOR_CSS.ink);
  const colorHex = (v) => colorCss(v).toLowerCase();
  /** 任意色导出为 CAD 真彩色 (0xRRGGBB)；预设色仍用 ACI 索引色 */
  const colorRgb = (v) => (HEX_RE.test(String(v || '')) ? parseInt(String(v).slice(1), 16) : null);
  const PX_PER_MM = 4;                 // 图纸基准像素/毫米（再乘以缩放比）
  const MAX_HISTORY = 40;
  const STORAGE_KEY = 'goukuang-cad-frame-v2';

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const snap1 = (v) => Math.round(v * 10) / 10;
  const snap05 = (v) => Math.round(v * 2) / 2;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clone = (o) => (typeof structuredClone === 'function' ? structuredClone(o) : JSON.parse(JSON.stringify(o)));
  const $ = (sel, root) => (root || document).querySelector(sel);
  const PH_ICON = {
    'align-center-horizontal': 'ph-align-center-horizontal',
    'align-left': 'ph-text-align-left',
    'align-center': 'ph-text-align-center',
    'align-right': 'ph-text-align-right',
    'move-horizontal': 'ph-arrows-horizontal',
    'pencil': 'ph-pencil-simple',
    'arrow-down': 'ph-arrow-down',
    'arrow-up': 'ph-arrow-up',
    'check': 'ph-check',
    'chevron-down': 'ph-caret-down',
    'chevron-right': 'ph-caret-right',
    'columns-3': 'ph-columns',
    'copy': 'ph-copy',
    'corner-down-right': 'ph-arrow-bend-down-right',
    'download': 'ph-download-simple',
    'eye': 'ph-eye',
    'eye-off': 'ph-eye-slash',
    'file-code': 'ph-file-code',
    'focus': 'ph-crosshair',
    'frame': 'ph-frame-corners',
    'grid-3x3': 'ph-grid-nine',
    'image-plus': 'ph-image',
    'info': 'ph-info',
    'layers': 'ph-stack',
    'layout-grid': 'ph-squares-four',
    'list-filter': 'ph-list-dashes',
    'loader-circle': 'ph-spinner',
    'maximize-2': 'ph-arrows-out-simple',
    'merge': 'ph-arrows-merge',
    'minus': 'ph-minus',
    'mouse-pointer-2': 'ph-cursor',
    'move': 'ph-arrows-out-cardinal',
    'plus': 'ph-plus',
    'rows-3': 'ph-rows',
    'search': 'ph-magnifying-glass',
    'settings-2': 'ph-sliders-horizontal',
    'split': 'ph-split-horizontal',
    'table-2': 'ph-table',
    'trash': 'ph-trash',
    'type': 'ph-text-t',
    'upload': 'ph-upload-simple',
    'x': 'ph-x',
    'zoom-in': 'ph-magnifying-glass-plus',
    'zoom-out': 'ph-magnifying-glass-minus'
  };
  const ic = (name, cls, style) => {
    const iconCls = PH_ICON[name] || ('ph-' + name);
    let finalStyle = style || '';
    if (finalStyle && !/font-size\s*:/i.test(finalStyle)) {
      const m = finalStyle.match(/width\s*:\s*([0-9.]+px)/i);
      if (m) finalStyle = 'font-size:' + m[1] + ';' + finalStyle;
    }
    return '<i class="ic ph ' + iconCls + (cls ? ' ' + cls : '') + '"' + (finalStyle ? ' style="' + finalStyle + '"' : '') + ' aria-hidden="true"></i>';
  };
  const num = (v, fb) => (Number.isFinite(Number(v)) ? Number(v) : (fb || 0));

  let uidN = 1000;
  const uid = (prefix) => prefix + '-' + (++uidN) + '-' + Math.random().toString(36).slice(2, 6);

  /* =============================== 常量与图幅 =============================== */
  const SHEET_DIMENSIONS = {
    A4_H: { widthMm: 297, heightMm: 210, label: 'A4', sub: '横' },
    A3_H: { widthMm: 420, heightMm: 297, label: 'A3', sub: '横' },
    A2_H: { widthMm: 594, heightMm: 420, label: 'A2', sub: '横' },
    A1_H: { widthMm: 841, heightMm: 594, label: 'A1', sub: '横' },
    A4_V: { widthMm: 210, heightMm: 297, label: 'A4', sub: '竖' }
  };
  const SHEET_ORDER = ['A4_H', 'A3_H', 'A2_H', 'A1_H', 'A4_V'];

  /* ---------- 工程数据字段：导出时由 EasyTile 按每张图纸自动填入 ---------- */
  const APPLIED_FRAME_KEY = 'tilecalc-applied-frame-v1';
  const FRAME_CONTEXT_KEY = 'tilecalc-frame-context-v1';
  const MERCHANT_INFO_KEY = 'tilecalc.merchantInfo';
  const DATA_FIELDS = [
    { key: 'merchantCompany', label: '商家 / 公司名称', group: '商家信息', sample: '品砖美家瓷砖地板体验馆' },
    { key: 'merchantContact', label: '商家联系人', group: '商家信息', sample: '张经理' },
    { key: 'merchantPhone', label: '联系电话', group: '商家信息', sample: '138-0000-8888' },
    { key: 'merchantAddress', label: '商家地址', group: '商家信息', sample: '红星美凯龙建材馆A区108号' },
    { key: 'projectName', label: '工程名称', group: '工程', sample: '未命名项目' },
    { key: 'clientName', label: '客户名称', group: '工程', sample: '张先生' },
    { key: 'floorName', label: '图纸层名称', group: '工程', sample: '1F' },
    { key: 'sheetTitle', label: '图纸名称', group: '图纸', sample: '全屋铺贴排砖施工总图' },
    { key: 'sheetDesc', label: '图纸说明', group: '图纸', sample: '全屋墙体、起铺基准与排砖总览' },
    { key: 'sheetNo', label: '图纸编号（序号）', group: '图纸', sample: '01' },
    { key: 'sheetSeq', label: '图纸序号', group: '图纸', sample: '01' },
    { key: 'pageNo', label: '页码', group: '图纸', sample: '1 / 7' },
    { key: 'totalSheets', label: '总页数', group: '图纸', sample: '7' },
    { key: 'date', label: '出图日期', group: '图纸', sample: '2026.11.13' },
    { key: 'sheetSize', label: '图幅', group: '图纸', sample: 'A3 横向' },
    { key: 'lengthUnit', label: '长度单位', group: '图纸', sample: '毫米 (mm)' },
    { key: 'roomName', label: '本页空间', group: '本页空间', sample: '全屋' },
    { key: 'roomSpec', label: '本页规格 / 铺法', group: '本页空间', sample: '800×800mm 正铺' },
    { key: 'roomArea', label: '本页铺贴面积', group: '本页空间', sample: '65.83 m²' },
    { key: 'roomBuy', label: '本页建议采购', group: '本页空间', sample: '251 块' },
    { key: 'roomCount', label: '空间数量', group: '全屋汇总', sample: '5 个' },
    { key: 'totalArea', label: '全屋铺贴面积', group: '全屋汇总', sample: '65.83 m²' },
    { key: 'totalBuy', label: '全屋建议采购', group: '全屋汇总', sample: '251 块' },
    { key: 'totalCost', label: '全屋预估造价', group: '全屋汇总', sample: '¥8756' },
    { key: 'unitPrice', label: '主材单价', group: '全屋汇总', sample: '¥133 / m²' }
  ];
  const MERCHANT_FIELD_MAP = {
    merchantCompany: 'company',
    merchantContact: 'contact',
    merchantPhone: 'phone',
    merchantAddress: 'address'
  };
  const DATA_FIELD_PREFIX = 'data:';
  const isDataFieldId = (id) => typeof id === 'string' && id.indexOf(DATA_FIELD_PREFIX) === 0;
  const dataFieldKey = (id) => (isDataFieldId(id) ? id.slice(DATA_FIELD_PREFIX.length) : '');
  /** 预览值：商家字段优先取报价页面已保存的 tilecalc.merchantInfo，其余优先取工作站当前工程数据 */
  function dataFieldPreview(key) {
    if (MERCHANT_FIELD_MAP[key]) {
      try {
        const m = StorageDB.getJSON(MERCHANT_INFO_KEY, null);
        const mField = MERCHANT_FIELD_MAP[key];
        if (m && m[mField] != null && String(m[mField]).trim() !== '') return String(m[mField]).trim();
      } catch (e) { /* ignore */ }
    }
    let ctx = null;
    try { ctx = StorageDB.getJSON(FRAME_CONTEXT_KEY, null); } catch (e) { ctx = null; }
    if (ctx && ctx[key] != null && String(ctx[key]) !== '') return String(ctx[key]);
    const f = DATA_FIELDS.find((x) => x.key === key);
    return f ? f.sample : '';
  }
  function findDataField(id) {
    const key = dataFieldKey(id);
    const f = key && DATA_FIELDS.find((x) => x.key === key);
    return f ? { id: DATA_FIELD_PREFIX + f.key, key: f.key, label: f.label, value: dataFieldPreview(f.key), isData: true } : null;
  }
  /** 模板中原「字段库」字段 → 工程数据字段 */
  const LEGACY_FIELD_TO_DATA = {
    'f-project': { key: 'projectName', label: '工程名称' },
    'f-drawing-title': { key: 'sheetTitle', label: '图纸名称' },
    'f-drawing-no': { key: 'sheetNo', label: '图纸编号' },
    'f-date': { key: 'date', label: '出图日期' },
    'f-scale': { key: 'pageNo', label: '页码' }
  };
  /** 把文档里的格子绑定到工程数据字段，并刷新预览值；其余旧字段库引用解除为独立输入 */
  function bindDataFields(doc) {
    doc.block.rows.forEach((r) => r.cells.forEach((c) => {
      if (c.fieldId && !isDataFieldId(c.fieldId)) {
        const m = LEGACY_FIELD_TO_DATA[c.fieldId];
        if (m) {
          c.fieldId = DATA_FIELD_PREFIX + m.key;
          // 中英双语标签保留英文部分
          const en = String(c.label || '').match(/[A-Z][A-Z .]+$/);
          c.label = m.label + (en ? ' ' + en[0].trim() : '');
        } else {
          c.fieldId = undefined;
        }
      }
      if (isDataFieldId(c.fieldId)) c.value = dataFieldPreview(dataFieldKey(c.fieldId));
    }));
    doc.customFields = [];
    return doc;
  }

  const CELL_TYPE_OPTIONS = [
    { value: 'field', label: '字段键值' },
    { value: 'text', label: '纯文本' },
    { value: 'image', label: '图片' }
  ];
  const FIELD_LAYOUT_OPTIONS = [
    { value: 'corner-label', label: '左上角标式' },
    { value: 'inline', label: '同行并列式' },
    { value: 'stacked', label: '整体堆叠式' }
  ];
  const TEXT_COLORS = [
    { value: 'ink', css: '#111827', tip: 'CAD 标准黑' },
    { value: 'blueprint', css: '#1D4ED8', tip: '工程蓝' },
    { value: 'red', css: '#DC2626', tip: '审定红' },
    { value: 'muted', css: '#6B7280', tip: '注释灰' }
  ];
  const COLOR_CSS = { ink: '#111827', blueprint: '#1D4ED8', red: '#DC2626', muted: '#6B7280' };
  const ALIGNMENTS = [];
  ['top', 'middle', 'bottom'].forEach((v) => ['left', 'center', 'right'].forEach((h) => ALIGNMENTS.push({ h: h, v: v })));
  const ALIGN_LABEL = { left: '左', center: '中', right: '右', top: '上', middle: '中', bottom: '下' };

  /* =============================== 文档工厂 =============================== */
  function createCell(partial) {
    return Object.assign({
      id: uid('cell'),
      type: 'field',
      widthRatio: 1,
      fieldId: undefined,
      label: '字段名称',
      value: '未填写内容',
      prefix: '',          // 字段内容前缀：可写 {{floorName}} 等工程数据占位符
      suffix: '',          // 字段内容后缀
      fieldLayout: 'corner-label',
      hAlign: 'left',
      vAlign: 'middle',
      paddingXMm: 2.2,
      paddingYMm: 1.6,
      offsetXMm: 0,
      offsetYMm: 0,
      labelFontSizeMm: 2.1,
      valueFontSizeMm: 3.2,
      lineSpacing: 1,      // 行间距（倍，1 = CAD 单倍行距；多行文字时生效）
      fontWeight: 'normal',
      textDirection: 'horizontal',
      textColor: 'ink',
      fontKey: 'simhei',   // 字体（CadShared.CAD_FONTS 的 key）
      imgId: '',           // IndexedDB images 表中的资源 ID
      imgSrc: '',          // 运行时内存预览 dataUrl（持久化时若存在 imgId 则不写入 KV）
      imgScale: 0.9,
      imgShowCaption: false
    }, partial || {});
  }

  function createRow(cells, heightMode, fixedHeightMm) {
    const total = cells.reduce((a, c) => a + (c.widthRatio > 0 ? c.widthRatio : 1), 0) || 1;
    return {
      id: uid('row'),
      heightMode: heightMode || 'auto',
      fixedHeightMm: fixedHeightMm == null ? 14 : fixedHeightMm,
      cells: cells.map((c) => Object.assign({}, c, { widthRatio: (c.widthRatio > 0 ? c.widthRatio : 1) / total }))
    };
  }

  /** 自由文字（画布工具栏「添加文字」）：纸面毫米坐标，(xMm, yMm) 为文本框左上角；widthMm = 0 时按内容自动宽度 */
  function createFreeText(partial) {
    const t = Object.assign({
      id: uid('txt'),
      xMm: 20,
      yMm: 20,
      widthMm: 0,
      text: '双击编辑文字',
      fontSizeMm: 3.5,
      hAlign: 'left',
      textColor: 'ink',
      fontKey: 'simhei',
      tracking: 1          // 字间距（倍，1 = 正常；导出为 MTEXT 跟踪 \\T，0.75 ~ 4）
    }, partial || {});
    if (!t.id) t.id = uid('txt');
    t.tracking = clamp(num(t.tracking, 1), 0.75, 4);
    if (!CAD_FONTS.some((f) => f.key === t.fontKey)) t.fontKey = 'simhei';
    t.xMm = num(t.xMm, 20); t.yMm = num(t.yMm, 20);
    t.widthMm = Math.max(0, num(t.widthMm, 0));
    t.fontSizeMm = clamp(num(t.fontSizeMm, 3.5), 1, 40);
    if (['left', 'center', 'right'].indexOf(t.hAlign) === -1) t.hAlign = 'left';
    if (!isColorValue(t.textColor)) t.textColor = 'ink';
    t.text = String(t.text == null ? '' : t.text);
    return t;
  }
  /** 预览：把 {{字段}} 占位符替换为工程数据预览值 */
  function fillPreview(str) {
    return String(str == null ? '' : str).replace(/\{\{(\w+)\}\}/g, (_, k) => dataFieldPreview(k));
  }
  /** 字段格显示值 = 前缀 + 内容 + 后缀（占位符替换为预览值） */
  function cellDisplayValue(cell) {
    if (!cell || cell.type !== 'field') return cell ? String(cell.value == null ? '' : cell.value) : '';
    return fillPreview(cell.prefix) + String(cell.value == null ? '' : cell.value) + fillPreview(cell.suffix);
  }

  const DEFAULT_SHEET = {
    preset: 'A3_H', widthMm: 420, heightMm: 297,
    marginLeftMm: 10, marginTopMm: 10, marginRightMm: 10, marginBottomMm: 10,
    showBindingZone: true, showOuterBorder: true,
    showAxisTicks: true, axisOuterFrame: true, axisCols: 6, axisRows: 4, axisBandMm: 5, axisFontSizeMm: 2.4, axisSides: 'all',
    outerBorderWidthMm: 0.15, innerBorderWidthMm: 0.6
  };

  /** 空白图框：预设模板 JSON 加载失败时的兜底，也是旧项目补全缺省属性的基准 */
  function buildBlankTemplate() {
    return {
      templateId: 'tpl-blank',
      name: '空白图框',
      sheet: Object.assign({}, DEFAULT_SHEET),
      customFields: [],
      freeTexts: [],
      block: {
        layoutMode: 'corner', cornerPosition: 'bottom-right', edgePosition: 'right',
        cornerWidthMm: 160, cornerHeightMm: 30, edgeWidthMm: 54,
        outerLineWidthMm: 0.45, gridLineWidthMm: 0.2,
        rows: [
          createRow([
            createCell({ type: 'field', widthRatio: 0.7, fieldId: 'data:sheetTitle', label: '图纸名称', value: '', prefix: '{{floorName}}', hAlign: 'left', vAlign: 'bottom', valueFontSizeMm: 3.6, fontWeight: 'bold' }),
            createCell({ type: 'field', widthRatio: 0.3, fieldId: 'data:sheetNo', label: '图纸编号', value: '', prefix: 'PZ-', hAlign: 'center', vAlign: 'bottom', valueFontSizeMm: 3.4, fontWeight: 'bold' })
          ], 'auto', 16)
        ]
      }
    };
  }

  /* ---------- 预设模板：assets/data/frame-templates.json（顶栏「导出 JSON」生成同格式文件，直接覆盖即可） ---------- */
  const TEMPLATES_URL = 'assets/data/frame-templates.json';
  let TEMPLATES = [];
  let templatesFileMeta = { version: 1 };
  function templateEntryFromJson(t) {
    return {
      id: t.id,
      name: t.name || t.id,
      subtitle: t.subtitle || '',
      description: t.description || '',
      preview: t.preview || '',
      rows: (t.doc.block.rows || []).length,
      source: t,
      create: () => {
        const doc = bindDataFields(hydrateProject(clone(t.doc)));
        doc.templateId = t.id;
        return doc;
      }
    };
  }
  const BLANK_TEMPLATE_ENTRY = {
    id: 'tpl-blank', name: '空白图框', subtitle: '兜底模板', description: '预设模板文件读取失败时使用。', preview: '', rows: 1,
    source: null, create: () => bindDataFields(buildBlankTemplate())
  };
  function parseTemplatesFile(json) {
    templatesFileMeta = Object.assign({}, Array.isArray(json) ? {} : json, { templates: undefined });
    return (Array.isArray(json) ? json : (json.templates || []))
      .filter((t) => t && t.id && t.doc && t.doc.sheet && t.doc.block && Array.isArray(t.doc.block.rows) && t.doc.block.rows.length)
      .map(templateEntryFromJson);
  }
  async function loadTemplates() {
    let list = [];
    try {
      const res = await fetch(TEMPLATES_URL, { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      list = parseTemplatesFile(await res.json());
    } catch (err) {
      console.warn('预设模板读取失败：' + TEMPLATES_URL, err);
    }
    if (!list.length) notify('预设模板文件读取失败，已使用空白图框（' + TEMPLATES_URL + '）', 'error');
    TEMPLATES = list.length ? list : [BLANK_TEMPLATE_ENTRY];
  }

  /** 当前文档 → 模板 JSON 里的一项（去掉运行期 id，数据字段的预览值不写入） */
  function docToTemplateDoc(doc) {
    const d = clone(doc);
    delete d.customFields;
    d.block.rows = d.block.rows.map((r) => ({
      heightMode: r.heightMode,
      fixedHeightMm: r.fixedHeightMm,
      cells: r.cells.map((c) => {
        const o = {};
        Object.keys(c).forEach((k) => { if (k !== 'id' && c[k] !== undefined) o[k] = c[k]; });
        if (isDataFieldId(o.fieldId)) o.value = '';
        return o;
      })
    }));
    d.freeTexts = (d.freeTexts || []).map((t) => { const o = Object.assign({}, t); delete o.id; return o; });
    return d;
  }

    /* =============================== 布局计算引擎 =============================== */
  const MIN_CELL_WIDTH_MM = 8;
  const MIN_ROW_HEIGHT_MM = 6;

  function computeLayoutGeometry(doc) {
    const sheet = doc.sheet;
    const block = doc.block;
    const sheetWidthMm = Math.max(100, sheet.widthMm);
    const sheetHeightMm = Math.max(80, sheet.heightMm);

    const innerX = Math.max(2, sheet.marginLeftMm);
    const innerY = Math.max(2, sheet.marginTopMm);
    const innerW = Math.max(50, sheetWidthMm - sheet.marginLeftMm - sheet.marginRightMm);
    const innerH = Math.max(40, sheetHeightMm - sheet.marginTopMm - sheet.marginBottomMm);
    const innerRect = { xMm: innerX, yMm: innerY, widthMm: innerW, heightMm: innerH };

    const rowCount = Math.max(1, block.rows.length);
    const blockW = block.layoutMode === 'edge'
      ? Math.min(Math.max(24, block.edgeWidthMm), innerW * 0.65)
      : Math.min(Math.max(40, block.cornerWidthMm), innerW);
    let targetBlockH = block.layoutMode === 'edge'
      ? innerH
      : Math.min(Math.max(rowCount * MIN_ROW_HEIGHT_MM, block.cornerHeightMm), innerH);

    const fixedRows = block.rows.filter((r) => r.heightMode === 'fixed');
    const autoRows = block.rows.filter((r) => r.heightMode === 'auto');
    const sumFixedRaw = fixedRows.reduce((a, r) => a + Math.max(MIN_ROW_HEIGHT_MM, r.fixedHeightMm), 0);
    let heights = [];

    if (block.layoutMode === 'corner') {
      if (autoRows.length === 0) {
        const scale = sumFixedRaw > innerH ? innerH / sumFixedRaw : 1;
        heights = block.rows.map((r) => Math.max(MIN_ROW_HEIGHT_MM, r.fixedHeightMm) * scale);
        targetBlockH = heights.reduce((a, b) => a + b, 0);
      } else {
        const minAutoTotal = autoRows.length * 8;
        if (sumFixedRaw + minAutoTotal > targetBlockH) targetBlockH = Math.min(innerH, sumFixedRaw + minAutoTotal);
        if (sumFixedRaw + autoRows.length * MIN_ROW_HEIGHT_MM > targetBlockH) {
          const maxFixedAllowed = Math.max(MIN_ROW_HEIGHT_MM * fixedRows.length, targetBlockH - autoRows.length * MIN_ROW_HEIGHT_MM);
          const fixedScale = sumFixedRaw > 0 ? maxFixedAllowed / sumFixedRaw : 1;
          const autoEach = (targetBlockH - sumFixedRaw * fixedScale) / autoRows.length;
          heights = block.rows.map((r) => (r.heightMode === 'fixed' ? Math.max(MIN_ROW_HEIGHT_MM, r.fixedHeightMm) * fixedScale : autoEach));
        } else {
          const remaining = targetBlockH - sumFixedRaw;
          const autoEach = remaining / autoRows.length;
          heights = block.rows.map((r) => (r.heightMode === 'fixed' ? Math.max(MIN_ROW_HEIGHT_MM, r.fixedHeightMm) : autoEach));
        }
        targetBlockH = heights.reduce((a, b) => a + b, 0);
      }
    } else {
      targetBlockH = innerH;
      if (autoRows.length === 0) {
        const scale = sumFixedRaw > 0 ? innerH / sumFixedRaw : 1;
        heights = block.rows.map((r) => Math.max(MIN_ROW_HEIGHT_MM, r.fixedHeightMm) * scale);
      } else {
        const minAutoTotal = autoRows.length * MIN_ROW_HEIGHT_MM;
        if (sumFixedRaw + minAutoTotal > innerH) {
          const availableForFixed = Math.max(fixedRows.length * MIN_ROW_HEIGHT_MM, innerH - minAutoTotal);
          const scale = sumFixedRaw > 0 ? availableForFixed / sumFixedRaw : 1;
          const actualFixedSum = fixedRows.reduce((a, r) => a + Math.max(MIN_ROW_HEIGHT_MM, r.fixedHeightMm) * scale, 0);
          const autoEach = Math.max(MIN_ROW_HEIGHT_MM, (innerH - actualFixedSum) / autoRows.length);
          heights = block.rows.map((r) => (r.heightMode === 'fixed' ? Math.max(MIN_ROW_HEIGHT_MM, r.fixedHeightMm) * scale : autoEach));
        } else {
          const autoEach = (innerH - sumFixedRaw) / autoRows.length;
          heights = block.rows.map((r) => (r.heightMode === 'fixed' ? Math.max(MIN_ROW_HEIGHT_MM, r.fixedHeightMm) : autoEach));
        }
      }
    }

    let blockX = innerX;
    let blockY = innerY;
    if (block.layoutMode === 'edge') {
      blockY = innerY;
      blockX = block.edgePosition === 'right' ? innerX + innerW - blockW : innerX;
    } else {
      if (block.cornerPosition === 'bottom-right') { blockX = innerX + innerW - blockW; blockY = innerY + innerH - targetBlockH; }
      else if (block.cornerPosition === 'bottom-left') { blockX = innerX; blockY = innerY + innerH - targetBlockH; }
      else if (block.cornerPosition === 'top-right') { blockX = innerX + innerW - blockW; blockY = innerY; }
      else { blockX = innerX; blockY = innerY; }
    }
    const blockRect = { xMm: blockX, yMm: blockY, widthMm: blockW, heightMm: targetBlockH };

    let drawingAreaRect = Object.assign({}, innerRect);
    if (block.layoutMode === 'edge') {
      drawingAreaRect = block.edgePosition === 'right'
        ? { xMm: innerX, yMm: innerY, widthMm: Math.max(20, innerW - blockW), heightMm: innerH }
        : { xMm: innerX + blockW, yMm: innerY, widthMm: Math.max(20, innerW - blockW), heightMm: innerH };
    }

    const rows = [];
    const cells = [];
    let cursorY = blockY;
    block.rows.forEach((row, rIdx) => {
      const rowH = heights[rIdx] == null ? 12 : heights[rIdx];
      const totalWeight = row.cells.reduce((a, c) => a + (c.widthRatio > 0 ? c.widthRatio : 1), 0) || 1;
      let cursorX = blockX;
      const rowCells = row.cells.map((cell, cIdx) => {
        const ratio = (cell.widthRatio > 0 ? cell.widthRatio : 1) / totalWeight;
        const cellW = cIdx === row.cells.length - 1 ? blockX + blockW - cursorX : blockW * ratio;
        const geom = {
          rowId: row.id, rowIndex: rIdx, cellId: cell.id, cellIndex: cIdx,
          xMm: cursorX, yMm: cursorY, widthMm: Math.max(1, cellW), heightMm: rowH,
          rowHeightMode: row.heightMode, cell: cell
        };
        cursorX += cellW;
        cells.push(geom);
        return geom;
      });
      rows.push({ rowId: row.id, rowIndex: rIdx, yMm: cursorY, heightMm: rowH, heightMode: row.heightMode, fixedHeightMm: row.fixedHeightMm, cells: rowCells });
      cursorY += rowH;
    });

    return { sheetWidthMm, sheetHeightMm, innerRect, drawingAreaRect, blockRect, rows, cells };
  }

  function computeAxisZoneMetrics(g, doc) {
    const s = doc.sheet;
    const cols = clamp(Math.round(num(s.axisCols, 6)), 2, 12);
    const rows = clamp(Math.round(num(s.axisRows, 4)), 2, 10);
    const sides = (s.axisSides === 'no-left' || s.axisSides === 'br') ? s.axisSides : 'all';
    const showTop = sides !== 'br';
    const showBottom = true;
    const showLeft = sides === 'all';
    const showRight = true;
    const activeMargins = [s.marginBottomMm, s.marginRightMm];
    if (showTop) activeMargins.push(s.marginTopMm);
    if (showLeft) activeMargins.push(s.marginLeftMm);
    const minMargin = Math.max(2, Math.min.apply(null, activeMargins));
    const band = clamp(num(s.axisBandMm, 5), 2, minMargin);
    const fontSize = clamp(num(s.axisFontSizeMm, 2.4), 1.2, Math.min(5, band * 0.78));
    const x0 = g.innerRect.xMm - (showLeft ? band : 0);
    const y0 = g.innerRect.yMm - (showTop ? band : 0);
    const x1 = g.innerRect.xMm + g.innerRect.widthMm + (showRight ? band : 0);
    const y1 = g.innerRect.yMm + g.innerRect.heightMm + (showBottom ? band : 0);
    const letters = [];
    for (let r = 0; r < rows; r++) letters.push(String.fromCharCode(65 + r));
    return {
      cols: cols,
      rows: rows,
      sides: sides,
      showTop: showTop,
      showBottom: showBottom,
      showLeft: showLeft,
      showRight: showRight,
      band: band,
      fontSize: fontSize,
      showOuterFrame: s.axisOuterFrame !== false,
      outerRect: { xMm: x0, yMm: y0, widthMm: x1 - x0, heightMm: y1 - y0 },
      letters: letters
    };
  }

  function updateRowCellCount(row, targetCount) {
    const count = clamp(Math.round(targetCount), 1, 8);
    if (count === row.cells.length) return row;
    let next = row.cells.slice();
    if (count < next.length) next = next.slice(0, count);
    else while (next.length < count) {
      next.push(createCell({ widthRatio: 1 / count, label: '字段 ' + (next.length + 1), value: '点击输入' }));
    }
    const equal = 1 / next.length;
    return Object.assign({}, row, { cells: next.map((c) => Object.assign({}, c, { widthRatio: equal })) });
  }

  function splitCellInRow(row, cellId) {
    if (row.cells.length >= 8) return { row: row, newCellId: cellId };
    const idx = row.cells.findIndex((c) => c.id === cellId);
    if (idx === -1) return { row: row, newCellId: cellId };
    const target = row.cells[idx];
    const half = target.widthRatio / 2;
    const sibling = createCell({
      widthRatio: half, label: '新增字段', value: '双击编辑', fieldLayout: target.fieldLayout,
      hAlign: target.hAlign, vAlign: target.vAlign,
      labelFontSizeMm: target.labelFontSizeMm, valueFontSizeMm: target.valueFontSizeMm
    });
    const next = row.cells.slice();
    next.splice(idx, 1, Object.assign({}, target, { widthRatio: half }), sibling);
    return { row: Object.assign({}, row, { cells: next }), newCellId: sibling.id };
  }

  function removeOrMergeCellInRow(row, cellId) {
    if (row.cells.length <= 1) return { row: row, survivorId: cellId };
    const idx = row.cells.findIndex((c) => c.id === cellId);
    if (idx === -1) return { row: row, survivorId: row.cells[0].id };
    const removed = row.cells[idx];
    const next = row.cells.filter((c) => c.id !== cellId);
    const absorbIdx = Math.max(0, idx - 1);
    next[absorbIdx] = Object.assign({}, next[absorbIdx], { widthRatio: next[absorbIdx].widthRatio + removed.widthRatio });
    return { row: Object.assign({}, row, { cells: next }), survivorId: next[absorbIdx].id };
  }

  function resizeRowDividerAtPosition(row, dividerIndex, targetRelX, rowWidthMm) {
    if (dividerIndex < 0 || dividerIndex >= row.cells.length - 1 || rowWidthMm <= 0) return row;
    const totalWeight = row.cells.reduce((a, c) => a + c.widthRatio, 0) || 1;
    const widths = row.cells.map((c) => (c.widthRatio / totalWeight) * rowWidthMm);
    const prefix = widths.slice(0, dividerIndex).reduce((a, b) => a + b, 0);
    const pairW = widths[dividerIndex] + widths[dividerIndex + 1];
    const minW = Math.min(MIN_CELL_WIDTH_MM, pairW * 0.35);
    const leftW = clamp(targetRelX - prefix, minW, pairW - minW);
    widths[dividerIndex] = leftW;
    widths[dividerIndex + 1] = pairW - leftW;
    return Object.assign({}, row, {
      cells: row.cells.map((c, i) => Object.assign({}, c, { widthRatio: widths[i] / rowWidthMm }))
    });
  }

  function setCellExactWidthInRow(row, cellId, desiredWidthMm, rowWidthMm) {
    if (row.cells.length <= 1 || rowWidthMm <= 0) return row;
    const idx = row.cells.findIndex((c) => c.id === cellId);
    if (idx === -1) return row;
    const totalWeight = row.cells.reduce((a, c) => a + c.widthRatio, 0) || 1;
    const widths = row.cells.map((c) => (c.widthRatio / totalWeight) * rowWidthMm);
    const neighborIdx = idx < row.cells.length - 1 ? idx + 1 : idx - 1;
    const pairSum = widths[idx] + widths[neighborIdx];
    const minW = Math.min(MIN_CELL_WIDTH_MM, pairSum * 0.25);
    const w = clamp(desiredWidthMm, minW, pairSum - minW);
    widths[idx] = w;
    widths[neighborIdx] = pairSum - w;
    return Object.assign({}, row, {
      cells: row.cells.map((c, i) => Object.assign({}, c, { widthRatio: widths[i] / rowWidthMm }))
    });
  }

  function getMagneticSnapRelativeXs(geometry, excludeRowId) {
    const out = [];
    geometry.rows.forEach((r) => {
      if (r.rowId === excludeRowId) return;
      for (let i = 0; i < r.cells.length - 1; i++) {
        const relX = r.cells[i].xMm + r.cells[i].widthMm - geometry.blockRect.xMm;
        if (!out.some((s) => Math.abs(s - relX) < 0.2)) out.push(relX);
      }
    });
    return out;
  }

    /* =============================== 运行状态 =============================== */
  const els = {};
  ['stage', 'viewport', 'rightPanel', 'canvasToolbar', 'statusBar',
    'modalRoot', 'toastStack', 'dragTooltip',
    'imageInput', 'jsonInput', 'panelScrim'].forEach((id) => { els[id] = document.getElementById(id); });

  const state = {
    doc: null,
    geometry: null,
    selection: { kind: 'none' },
    editing: null,
    past: [],
    future: [],
    view: { zoom: 0.5, panX: 0, panY: 0, autoFit: true, focusMode: false },
    ui: {
      rightTab: 'table',
      cleanPreview: false,
      templateOpen: false,
      exportOpen: false,
      exportBusy: false,
      exportResult: null,
      exportError: null,
      exportOpts: { dxfVersion: 1021, includeAxisTicks: true },
      mobileRight: false,
      dropCellId: null
    },
    drag: null,
    saveTimer: null
  };

  /* =============================== 持久化（IndexedDB） =============================== */
  const FRAME_IMG_OWNER = 'frame-cell';
  const FRAME_IMG_LIMITS = {
    owner: FRAME_IMG_OWNER,
    maxInputBytes: 4 * 1024 * 1024,
    maxWidth: 800,
    maxHeight: 800,
    maxOutputBytes: 400 * 1024,
    preferPng: true
  };

  function serializeDocForStorage(doc) {
    const out = clone(doc);
    ((out && out.block && out.block.rows) || []).forEach((r) => {
      (r.cells || []).forEach((c) => {
        if (c.type !== 'image') {
          c.imgId = '';
          c.imgSrc = '';
        } else if (c.imgId) {
          c.imgSrc = '';
        }
      });
    });
    return out;
  }

  function collectActiveFrameImageIds(includeApplied = true) {
    const keep = new Set();
    ((state.doc && state.doc.block && state.doc.block.rows) || []).forEach((r) => {
      (r.cells || []).forEach((c) => {
        if (c.type === 'image' && c.imgId) keep.add(c.imgId);
      });
    });
    if (includeApplied) {
      const applied = StorageDB.getJSON(APPLIED_FRAME_KEY, null);
      if (applied && Array.isArray(applied.images)) {
        applied.images.forEach((im) => { if (im && im.imageId) keep.add(im.imageId); });
      }
    }
    return keep;
  }

  function pruneFrameCellImages(includeApplied = true) {
    return StorageDB.pruneOwnerImages(FRAME_IMG_OWNER, collectActiveFrameImageIds(includeApplied));
  }

  async function hydrateDocImages(doc) {
    let migrated = false;
    const rows = (doc && doc.block && doc.block.rows) || [];
    for (const r of rows) {
      for (const c of (r.cells || [])) {
        if (c.type !== 'image') continue;
        if (c.imgId) {
          const du = await StorageDB.getImageDataUrl(c.imgId);
          if (du) c.imgSrc = du;
          else { c.imgId = ''; c.imgSrc = ''; }
        } else if (c.imgSrc && c.imgSrc.startsWith('data:image/')) {
          try {
            const saved = await StorageDB.saveImage(c.imgSrc, FRAME_IMG_LIMITS);
            c.imgId = saved.id;
            c.imgSrc = saved.dataUrl;
            migrated = true;
          } catch (e) { /* 保留原预览 */ }
        }
      }
    }
    if (migrated) {
      try { await StorageDB.setJSON(STORAGE_KEY, serializeDocForStorage(doc)); } catch (e) { }
    }
  }

  function loadStoredProject() {
    try {
      const parsed = StorageDB.getJSON(STORAGE_KEY, null);
      if (!parsed || !parsed.sheet || !parsed.block || !Array.isArray(parsed.block.rows)) return null;
      return hydrateProject(parsed);
    } catch (e) {
      return null;
    }
  }

  function hydrateProject(raw) {
    const base = buildBlankTemplate();
    const doc = {
      templateId: raw.templateId || 'custom',
      name: raw.name || base.name,
      sheet: Object.assign({}, base.sheet, raw.sheet || {}),
      customFields: Array.isArray(raw.customFields) ? raw.customFields : [],
      freeTexts: (Array.isArray(raw.freeTexts) ? raw.freeTexts : []).map((t) => createFreeText(t)),
      block: Object.assign({}, base.block, raw.block, {
        rows: (raw.block.rows || []).map((r) => ({
          id: r.id || uid('row'),
          heightMode: r.heightMode === 'fixed' ? 'fixed' : 'auto',
          fixedHeightMm: num(r.fixedHeightMm, 14),
          cells: (r.cells || []).map((c) => {
            const cell = createCell(c);
            if (!isColorValue(cell.textColor)) cell.textColor = 'ink';
            if (!CAD_FONTS.some((f) => f.key === cell.fontKey)) cell.fontKey = 'simhei';
            cell.lineSpacing = clamp(num(cell.lineSpacing, 1), 0.6, 3);
            if (typeof cell.prefix !== 'string') cell.prefix = '';
            if (typeof cell.suffix !== 'string') cell.suffix = '';
            return cell;
          })
        }))
      })
    };
    if (!doc.block.rows.length) doc.block.rows = base.block.rows;
    doc.sheet.showOuterBorder = doc.sheet.showOuterBorder !== false;
    doc.sheet.axisOuterFrame = doc.sheet.axisOuterFrame !== false;
    doc.sheet.axisCols = clamp(Math.round(num(doc.sheet.axisCols, 6)), 2, 12);
    doc.sheet.axisRows = clamp(Math.round(num(doc.sheet.axisRows, 4)), 2, 10);
    doc.sheet.axisBandMm = clamp(num(doc.sheet.axisBandMm, 5), 2, 12);
    doc.sheet.axisFontSizeMm = clamp(num(doc.sheet.axisFontSizeMm, 2.4), 1.2, 5);
    if (!['all', 'no-left', 'br'].includes(doc.sheet.axisSides)) doc.sheet.axisSides = 'all';
    return doc;
  }

  function saveProjectSoon() {
    clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(() => {
      try {
        StorageDB.setJSON(STORAGE_KEY, serializeDocForStorage(state.doc));
        pruneFrameCellImages(true);
      } catch (err) {
        /* ignore storage errors */
      }
    }, 420);
  }

  /* =============================== 历史记录 =============================== */
  function pushHistory() {
    state.past.push(clone(state.doc));
    if (state.past.length > MAX_HISTORY) state.past.shift();
    state.future.length = 0;
  }

  function undo() {
    if (!state.past.length) return;
    commitEditing(false);
    bindSessionActive = false; bindSessionDirty = false; bindSessionEl = null;
    state.future.unshift(clone(state.doc));
    state.doc = state.past.pop();
    state.selection = sanitizeSelection(state.selection);
    saveProjectSoon();
    render();
  }

  function redo() {
    if (!state.future.length) return;
    commitEditing(false);
    bindSessionActive = false; bindSessionDirty = false; bindSessionEl = null;
    state.past.push(clone(state.doc));
    state.doc = state.future.shift();
    state.selection = sanitizeSelection(state.selection);
    saveProjectSoon();
    render();
  }

  function sanitizeSelection(sel) {
    if (sel.kind === 'text') {
      return (state.doc.freeTexts || []).some((t) => t.id === sel.id) ? sel : { kind: 'none' };
    }
    if (sel.kind === 'cell' || sel.kind === 'row') {
      const row = state.doc.block.rows.find((r) => r.id === sel.rowId);
      if (!row) return { kind: 'table' };
      if (sel.kind === 'cell' && !row.cells.some((c) => c.id === sel.cellId)) return { kind: 'row', rowId: row.id };
    }
    return sel;
  }

  /* =============================== 文档修改 =============================== */
  function update(recipe, opts) {
    opts = opts || {};
    const next = clone(state.doc);
    const result = recipe(next);
    if (result === false) return;
    if (opts.history) pushHistory();
    state.doc = next;
    if (opts.history || opts.persist !== false) saveProjectSoon();
    render(opts.panels === false ? { panels: false } : undefined);
  }

  function selectSel(sel) {
    if (state.editing && !(sel.kind === 'cell' && state.editing.rowId === sel.rowId && state.editing.cellId === sel.cellId)) {
      state.editing = null;
    }
    state.selection = sel;
    render();
  }


  /* =============================== 选择查询 =============================== */
  function geomOfSelection() {
    const g = state.geometry;
    if (!g || state.selection.kind !== 'cell') return null;
    return g.cells.find((c) => c.rowId === state.selection.rowId && c.cellId === state.selection.cellId) || null;
  }
  function rowGeomOf(rowId) {
    const g = state.geometry;
    return g ? g.rows.find((r) => r.rowId === rowId) || null : null;
  }

  /* =============================== 提示条 =============================== */
  const TOAST_ICON = { success: 'check', error: 'info', default: 'info' };
  function notify(message, tone) {
    const id = uid('toast');
    const el = document.createElement('div');
    el.className = 'toast ' + (tone || 'default');
    el.dataset.id = id;
    el.innerHTML = ic(TOAST_ICON[tone] || 'info', '', 'width:15px;height:15px') + '<span>' + esc(message) + '</span>';
    els.toastStack.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .25s ease, transform .25s ease';
      el.style.opacity = '0';
      el.style.transform = 'translateY(6px) scale(.98)';
      setTimeout(() => el.remove(), 260);
    }, 2400);
  }

    /* =============================== 小组件构造器 =============================== */
  const fnum = (v) => {
    const n = Number(v);
    if (!Number.isFinite(n)) return '0';
    return String(Math.round(n * 100) / 100);
  };

  function section(title, icon, body, action) {
    return '<section class="section"><div class="section-head"><h3>' + (icon ? ic(icon) : '') + esc(title) + '</h3>' + (action || '') + '</div>' + body + '</section>';
  }

  function numberField(label, value, bind, o) {
    o = o || {};
    return '<label class="number-field' + (o.disabled ? ' disabled' : '') + '">' +
      '<span>' + esc(label) + '</span>' +
      '<div><input type="number" data-bind="' + bind + '" data-vt="' + (o.vt || 'number') + '"' +
      ' value="' + fnum(value) + '" min="' + (o.min == null ? -9999 : o.min) + '" max="' + (o.max == null ? 9999 : o.max) + '"' +
      ' step="' + (o.step == null ? 0.5 : o.step) + '"' + (o.disabled ? ' disabled' : '') + ' />' +
      '<em>' + esc(o.unit == null ? 'mm' : o.unit) + '</em>' +
      '<span class="number-steppers" aria-hidden="true">' +
      '<button type="button" tabindex="-1" data-act="numberStep" data-dir="1"' + (o.disabled ? ' disabled' : '') + ' title="增加">⌃</button>' +
      '<button type="button" tabindex="-1" data-act="numberStep" data-dir="-1"' + (o.disabled ? ' disabled' : '') + ' title="减少">⌄</button></span></div></label>';
  }

  function segmented(options, value, act, extra) {
    return '<div class="segmented' + (extra && extra.tiny ? ' tiny' : '') + '">' + options.map((op) =>
      '<button type="button" data-act="' + act + '" data-value="' + op.value + '"' + (extra && extra.attrs ? ' ' + extra.attrs : '') +
      ' class="' + (String(value) === String(op.value) ? 'active' : '') + '">' + esc(op.label) + '</button>'
    ).join('') + '</div>';
  }

  /** 字体下拉：Windows 预装中文字体，每项以该字体显示 */
  function fontSelect(bind, cur, attrs) {
    return '<select data-bind="' + bind + '"' + (attrs ? ' ' + attrs : '') + ' title="字体（导出 CAD 时按字体建立文字样式）">' +
      CAD_FONTS.map((f) => '<option value="' + f.key + '"' + (f.key === cur ? ' selected' : '') + ' style="font-family:' + esc(f.css) + '">' + esc(f.label) + '</option>').join('') +
      '</select>';
  }
  /** 颜色：预设色块 + 任意色选择器（input[type=color]，选择后写入 #rrggbb） */
  function colorPicker(act, cur) {
    const custom = !COLOR_CSS[cur];
    return '<span class="swatches">' + TEXT_COLORS.map((c) =>
      '<button type="button" class="swatch' + (cur === c.value ? ' active' : '') + '" style="background:' + c.css + '" data-act="' + act + '" data-value="' + c.value + '" title="' + c.tip + '"></button>'
    ).join('') +
      '<label class="swatch swatch-picker' + (custom ? ' active' : '') + '" title="自定义颜色（导出为 CAD 真彩色）"' + (custom ? ' style="background:' + colorCss(cur) + '"' : '') + '>' +
      '<input type="color" data-color-act="' + act + '" value="' + colorHex(cur) + '" /></label></span>';
  }

  function toggleRow(label, checked, bind) {
    return '<label class="toggle-row"><span>' + esc(label) + '</span>' +
      '<input type="checkbox" class="toggle-input" data-bind="' + bind + '" data-vt="bool"' + (checked ? ' checked' : '') + ' /></label>';
  }

  function paperSettingsHtml() {
    const s = state.doc.sheet;
    const cls = (k) => 'paper-size' + (s.preset === k ? ' active' : '');
    return '<div class="g3" style="grid-template-columns:repeat(5,1fr);gap:5px">' +
      SHEET_ORDER.map((k) => {
        const d = SHEET_DIMENSIONS[k];
        return '<button type="button" class="' + cls(k) + '" data-act="sheetPreset" data-value="' + k + '" title="' + d.widthMm + ' × ' + d.heightMm + ' mm">' + d.label + d.sub + '</button>';
      }).join('') + '</div>' +
      '<div class="g2" style="margin-top:9px">' +
      numberField('纸张宽', s.widthMm, 'sheet:widthMm', { min: 100, max: 2000 }) +
      numberField('纸张高', s.heightMm, 'sheet:heightMm', { min: 100, max: 2000 }) +
      '</div>' +
      '<div class="g2" style="margin-top:9px">' +
      numberField('左装订', s.marginLeftMm, 'sheet:marginLeftMm', { min: 5, max: 60 }) +
      numberField('上边距', s.marginTopMm, 'sheet:marginTopMm', { min: 5, max: 60 }) +
      numberField('右边距', s.marginRightMm, 'sheet:marginRightMm', { min: 5, max: 60 }) +
      numberField('下边距', s.marginBottomMm, 'sheet:marginBottomMm', { min: 5, max: 60 }) +
      '</div>';
  }

  function cornerPickerHtml() {
    const b = state.doc.block;
    const geo = state.geometry;
    let inner = '';
    if (b.layoutMode === 'edge') {
      inner = '<div class="drawing-zone">图纸工作区</div>' +
        '<button type="button" class="edge-btn' + (b.edgePosition === 'left' ? ' active' : '') + '" style="left:6px" data-act="setEdgePos" data-value="left">左</button>' +
        '<button type="button" class="edge-btn' + (b.edgePosition === 'right' ? ' active' : '') + '" style="right:6px" data-act="setEdgePos" data-value="right">右</button>';
    } else {
      const pos = [
        { v: 'top-left', l: '左上', css: 'left:10px;top:10px' },
        { v: 'top-right', l: '右上', css: 'right:10px;top:10px' },
        { v: 'bottom-left', l: '左下', css: 'left:10px;bottom:10px' },
        { v: 'bottom-right', l: '右下', css: 'right:10px;bottom:10px' }
      ];
      inner = '<div class="drawing-zone">图纸工作区</div>' + pos.map((p) =>
        '<button type="button" class="corner-btn' + (b.cornerPosition === p.v ? ' active' : '') + '" style="' + p.css + '" data-act="setCornerPos" data-value="' + p.v + '">' + p.l + '</button>'
      ).join('');
    }
    return '<div class="mini-sheet"><div class="mini-sheet-inner">' + inner + '</div></div>' +
      '<p class="helper-copy" style="margin-top:7px">参数框实际尺寸：' + snap1(geo.blockRect.widthMm) + ' × ' + snap1(geo.blockRect.heightMm) + ' mm</p>';
  }

  /* =============================== 画布工具栏 =============================== */
  // 工具栏左端：显示当前模板，点击弹出与旧版一致的「选择技术图框模板」弹窗
  function templatePickerHtml() {
    const doc = state.doc;
    const tpl = TEMPLATES.find((t) => t.id === doc.templateId);
    return '<button type="button" class="template-trigger" data-act="openTemplates" title="选择技术图框模板">' +
      '<span class="template-mini"><i></i><i></i><i></i><i></i></span>' +
      '<span class="tt-title">' + esc(tpl ? tpl.name : (doc.name || '自定义图框')) + '</span>' +
      ic('chevron-down', '', 'width:12px;height:12px') + '</button>';
  }

  function renderToolbar() {
    const sel = state.selection;
    const isCell = sel.kind === 'cell';
    const geo = state.geometry;
    const zoomPct = Math.round(state.view.zoom * 100);
    const left =
      '<div class="canvas-toolbar-left">' +
      templatePickerHtml() +
      '<div class="toolbar-divider"></div>' +
      '<button type="button" data-act="selectTable" class="' + (sel.kind === 'table' ? 'active' : '') + '">' + ic('table-2', '', 'width:14px;height:14px') + '<span>表格属性</span></button>' +
      '<button type="button" data-act="selectPage" class="' + (sel.kind === 'page' ? 'active' : '') + '">' + ic('frame', '', 'width:14px;height:14px') + '<span>页面</span></button>' +
      '<div class="toolbar-divider"></div>' +
      '<button type="button" data-act="addFreeText" title="在图框中添加一个可拖动的文本框（导出为 CAD 多行文字 MTEXT）" class="' + (sel.kind === 'text' ? 'active' : '') + '">' + ic('type', '', 'width:14px;height:14px') + '<span>添加文字</span></button>' +
      '</div>';

    const right =
      '<div class="canvas-toolbar-right">' +
      '<button type="button" data-act="toggleClean" class="' + (state.ui.cleanPreview ? 'active' : '') + '">' + ic(state.ui.cleanPreview ? 'eye-off' : 'eye', '', 'width:14px;height:14px') + '<span class="hide-sm">' + (state.ui.cleanPreview ? '退出预览' : '纯净预览') + '</span></button>' +
      '<div class="toolbar-divider"></div>' +
      '<button type="button" class="icon-button" data-act="zoomOut" title="缩小">' + ic('zoom-out') + '</button>' +
      '<button type="button" class="zoom-value" data-act="fitSheet" title="点击适应窗口">' + zoomPct + '%</button>' +
      '<button type="button" class="icon-button" data-act="zoomIn" title="放大">' + ic('zoom-in') + '</button>' +
      '<button type="button" class="icon-button" data-act="fitSheet" title="适应窗口">' + ic('maximize-2') + '</button>' +
      '<div class="toolbar-divider"></div>' +
      '<button type="button" data-act="focusBlock" title="放大参数框图框进行细节编辑">' + ic('focus', '', 'width:14px;height:14px') + '<span class="hide-sm">聚焦图框</span></button>' +
      '</div>';

    els.canvasToolbar.innerHTML = left + right;
  }

  function renderStatus() {
    const exitBtn = document.getElementById('exitPreview');
    if (exitBtn) exitBtn.classList.toggle('hidden', !state.ui.cleanPreview);
    els.statusBar.innerHTML =
      '<span>单击选格 · 双击改字 · 拖线调尺寸 · 空格拖动画布</span>' +
      '<span class="push">双击编辑 · 拖线调整尺寸 · Ctrl/⌘ + Z 撤销</span>';
  }

    /* =============================== 右栏 · 属性检查器 =============================== */
  let lastRightViewKey = '';
  let lastRightTab = '';
  function renderRightPanel() {
    if ((state.selection.kind === 'cell' || state.selection.kind === 'row') &&
      !state.geometry.rows.some((r) => r.rowId === state.selection.rowId)) {
      state.selection = { kind: 'table' };
    }
    const sel = state.selection;
    const doc = state.doc;
    const geo = state.geometry;
    // 页签跟随选中对象类型自动切换（cell / row → 单元格，page → 页面，其余 → 表格）
    const selKind = state.selection.kind;
    if (selKind === 'cell' || selKind === 'row' || selKind === 'text') state.ui.rightTab = 'cell';
    else if (selKind === 'page') state.ui.rightTab = 'page';
    else if (selKind === 'table') state.ui.rightTab = 'table';
    const tab = state.ui.rightTab || 'table';
    // 面板主题由页签决定；「单元格」页签在没有选中格子时给出空态提示
    const kind = tab === 'table' ? 'table'
      : tab === 'page' ? 'page'
        : (sel.kind === 'cell' || sel.kind === 'row' || sel.kind === 'text') ? sel.kind : 'none';
    let kicker = 'TABLE INSPECTOR';
    let title = '参数框属性';
    let badge = '';
    let body = '';

    if (kind === 'text') {
      const ft = (doc.freeTexts || []).find((t) => t.id === sel.id);
      if (!ft) { state.selection = { kind: 'none' }; return renderRightPanel(); }
      kicker = 'TEXT INSPECTOR';
      title = '文字属性';
      badge = '自由文字';
      body =
        section('文字内容', 'type',
          '<label class="form-label">文本（回车换行）<textarea rows="4" data-bind="text:text" data-vt="string" placeholder="输入文字，可写 {{projectName}} 等工程数据占位符">' + esc(ft.text) + '</textarea></label>' +
          '<p class="helper-copy" style="margin-top:6px">导出为 CAD 多行文字（MTEXT）文本框；{{字段}} 占位符在工作站导出时按每张图纸填入。</p>') +
        section('位置与尺寸', 'move',
          '<div class="g2">' +
          numberField('左边距 X', ft.xMm, 'text:xMm', { min: 0, max: geo.sheetWidthMm }) +
          numberField('上边距 Y', ft.yMm, 'text:yMm', { min: 0, max: geo.sheetHeightMm }) +
          numberField('文本框宽度', ft.widthMm, 'text:widthMm', { min: 0, max: geo.sheetWidthMm }) +
          numberField('字高', ft.fontSizeMm, 'text:fontSizeMm', { min: 1, max: 40, step: 0.1 }) +
          '</div>' +
          '<div class="g2" style="margin-top:9px">' +
          '<label class="form-label">字体' + fontSelect('text:fontKey', ft.fontKey) + '</label>' +
          numberField('字间距', ft.tracking, 'text:tracking', { min: 0.75, max: 4, step: 0.05, unit: '倍' }) +
          '</div>' +
          '<p class="helper-copy" style="margin-top:7px">宽度为 0 时按内容自动宽度、不自动换行；在画布上直接拖动文字可移动位置（按住 Alt 关闭 0.5 mm 吸附）。</p>') +
        section('对齐与颜色', 'align-center-horizontal',
          segmented([{ value: 'left', label: '左对齐' }, { value: 'center', label: '居中' }, { value: 'right', label: '右对齐' }], ft.hAlign, 'freeTextAlign', { tiny: true }) +
          '<div class="between" style="margin-top:10px"><span class="helper-copy">文字颜色</span>' +
          colorPicker('freeTextColor', ft.textColor) + '</div>' +
          '<p class="helper-copy" style="margin-top:7px">字间距 1 = 正常，导出为 CAD 多行文字的跟踪系数（0.75 ~ 4 倍），双击编辑后保持。</p>') +
        '<div class="g2" style="padding:14px 16px">' +
        '<button type="button" class="button-secondary" style="justify-content:center" data-act="duplicateFreeText">' + ic('copy', '', 'width:13px;height:13px') + '复制</button>' +
        '<button type="button" class="button-danger" style="justify-content:center" data-act="deleteFreeText">' + ic('trash', '', 'width:13px;height:13px') + '删除</button>' +
        '</div>';
    } else if (kind === 'none') {
      kicker = 'CELL INSPECTOR';
      title = '单元格属性';
      body = '<div class="panel-empty">' + ic('mouse-pointer-2', '', 'width:26px;height:26px') +
        '<strong>还没有选中的格子</strong>' +
        '<p>在画布上单击任意格子（或左侧行把手选中整行），这里就会显示它的内容、字号、对齐与边距参数。</p>' +
        '<button type="button" class="button-secondary" data-act="selectTable">' + ic('table-2', '', 'width:13px;height:13px') + '选中整表</button>' +
        '</div>';
    } else if (kind === 'cell') {
      const geom = geomOfSelection();
      const row = rowGeomOf(sel.rowId);
      if (!geom || !row) return;
      const cell = geom.cell;
      kicker = 'CELL INSPECTOR';
      title = '单元格属性';
      badge = 'R' + (row.rowIndex + 1) + ' · C' + (geom.cellIndex + 1);

      /* --- 尺寸 --- */
      let sizeBody =
        '<div class="g2">' +
        numberField(row.cells.length === 1 ? '格子宽度（整栏）' : '格子宽度', geom.widthMm, 'cellWidth', { min: 8, max: Math.round(geo.innerRect.widthMm) }) +
        numberField('固定行高', row.fixedHeightMm, 'row:fixedHeightMm', { min: 6, max: 260, disabled: row.heightMode !== 'fixed' }) +
        '</div>' +
        '<div style="margin-top:8px">' + segmented([{ value: 'auto', label: '高度自适应均分' }, { value: 'fixed', label: '单独指定行高' }], row.heightMode, 'rowHeightMode', { attrs: 'data-row="' + row.rowId + '"' }) + '</div>' +
        '<p class="helper-copy" style="margin-top:7px">当前实际行高 ' + snap1(row.heightMm) + ' mm，行内共 ' + row.cells.length + ' 格。</p>';

      /* --- 内容类型 --- */
      let contentBody = segmented(CELL_TYPE_OPTIONS, cell.type, 'cellType', { tiny: true }) + '<div style="margin-top:9px">';

      if (cell.type === 'image') {
        const imgScale = clamp(cell.imgScale == null ? 0.9 : cell.imgScale, 0.1, 1.6);
        contentBody += '<div class="image-preview' + (cell.imgSrc ? '' : ' empty') + '">' +
          (cell.imgSrc ? '<img src="' + cell.imgSrc + '" alt="" />' : '<span class="helper-copy">还没有图片，点击下方按钮上传</span>') + '</div>' +
          '<div class="g2" style="margin-top:8px">' +
          '<button type="button" class="button-secondary" style="justify-content:center" data-act="uploadCellImage">' + ic('upload', '', 'width:13px;height:13px') + (cell.imgSrc ? '替换图片' : '上传图片') + '</button>' +
          '<button type="button" class="button-secondary" style="justify-content:center" data-act="clearCellImage"' + (cell.imgSrc ? '' : ' disabled') + '>' + ic('trash', '', 'width:13px;height:13px') + '移除</button>' +
          '</div>' +
          '<div style="margin-top:11px"><div class="range-head"><span>图片缩放</span><b>' + Math.round(imgScale * 100) + '%</b></div>' +
          '<input type="range" class="range-input" min="0.1" max="1.6" step="0.02" value="' + imgScale + '" data-bind="cell:imgScale" data-vt="number" /></div>' +
          '<div style="margin-top:10px">' + toggleRow('图片下方显示说明文字', !!cell.imgShowCaption, 'cell:imgShowCaption') + '</div>' +
          (cell.imgShowCaption ? '<label class="form-label" style="margin-top:8px">说明文字<input type="text" data-bind="cell:value" data-vt="string" value="' + esc(cell.value) + '" placeholder="如：栖居营造私宅全案" /></label>' : '') +
          '<p class="helper-copy" style="margin-top:9px">图片的边距、偏移与九宫格对齐在下方「图片定位」中调节；也可以直接把图片文件拖到任意格子上。</p>';
      } else if (cell.type === 'text') {
        contentBody += '<label class="form-label">字段名称 (Label)<input type="text" data-bind="cell:label" data-vt="string" value="' + esc(cell.label || '') + '" placeholder="如：备注说明 / 设计说明" /></label>' +
          '<label class="form-label" style="margin-top:8px">文本内容<textarea rows="3" data-bind="cell:value" data-vt="string" placeholder="支持回车换行">' + esc(cell.value) + '</textarea></label>' +
          '<p class="helper-copy" style="margin-top:7px">纯文本格在画布上仅显示文本内容，字段名称用于网格列表与导出图纸表单中的标识；可配合「竖排」用于侧栏说明。</p>';
      } else {
        const linked = findDataField(cell.fieldId);
        const groups = [];
        DATA_FIELDS.forEach((f) => { if (groups.indexOf(f.group) === -1) groups.push(f.group); });
        contentBody += '<label class="form-label">关联工程数据' +
          '<select data-act="applyFieldSelect">' +
          '<option value="">— 独立自定义输入 —</option>' +
          groups.map((g) => '<optgroup label="' + esc(g) + '">' + DATA_FIELDS.filter((f) => f.group === g).map((f) => {
            const id = DATA_FIELD_PREFIX + f.key;
            return '<option value="' + id + '"' + (cell.fieldId === id ? ' selected' : '') + '>' + esc(f.label) + '：' + esc(dataFieldPreview(f.key).slice(0, 16)) + '</option>';
          }).join('') + '</optgroup>').join('') +
          '</select></label>' +
          '<label class="form-label" style="margin-top:8px">字段名称 (Label)<input type="text" data-bind="cell:label" data-vt="string" value="' + esc(cell.label) + '" placeholder="如：项目名称 / 图号" /></label>' +
          '<label class="form-label" style="margin-top:8px">字段内容 (Value)<textarea rows="2" data-bind="cell:value" data-vt="string" placeholder="输入显示内容，支持回车换行"' + (linked ? ' disabled' : '') + '>' + esc(cell.value) + '</textarea></label>' +
          '<div class="g2" style="margin-top:8px">' +
          '<label class="form-label">内容前缀<input type="text" data-bind="cell:prefix" data-vt="string" value="' + esc(cell.prefix || '') + '" placeholder="如：PZ-" /></label>' +
          '<label class="form-label">内容后缀<input type="text" data-bind="cell:suffix" data-vt="string" value="' + esc(cell.suffix || '') + '" placeholder="如：（{{floorName}}）" /></label>' +
          '</div>' +
          '<p class="helper-copy" style="margin-top:6px">前后缀会拼在内容两侧一起导出，可写 {{floorName}}、{{sheetSeq}} 等工程数据占位符；当前显示：' + esc(cellDisplayValue(cell).slice(0, 40) || '（空）') + '</p>' +
          '<div style="margin-top:8px"><span class="helper-copy">排布样式</span></div>' +
          '<div style="margin-top:5px">' + segmented(FIELD_LAYOUT_OPTIONS, cell.fieldLayout, 'fieldLayout', { tiny: true }) + '</div>' +
          (linked ? '<p class="helper-copy" style="margin-top:7px">已关联工程数据「' + esc(linked.label) + '」：导出时按每张图纸自动填入，这里显示的是预览值。</p>' : '');
      }
      contentBody += '</div>';

      /* --- 定位 --- */
      const alignBody =
        '<div class="alignment-control">' +
        '<div class="alignment-grid">' + ALIGNMENTS.map((a) =>
          '<button type="button" data-act="align" data-h="' + a.h + '" data-v="' + a.v + '" title="' + ALIGN_LABEL[a.h] + ALIGN_LABEL[a.v] + '对齐" class="' + (cell.hAlign === a.h && cell.vAlign === a.v ? 'active' : '') + '"><i></i></button>'
        ).join('') + '</div>' +
        '<div style="flex:1;min-width:0;color:var(--text-muted);font-size:9px;line-height:1.9">' +
        '<div>水平：' + ({ left: '左对齐', center: '居中', right: '右对齐' })[cell.hAlign] + '</div>' +
        '<div>垂直：' + ({ top: '靠上', middle: '居中', bottom: '靠下' })[cell.vAlign] + '</div>' +

    let focusSelector = '';
    let selStart = null;
    let selEnd = null;
    if (activeEl) {

        });
      }
    }

    bodyEl.innerHTML = body;

        if (selStart !== null && selEnd !== null && typeof restoreEl.setSelectionRange === 'function') {
